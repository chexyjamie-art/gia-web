<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | ULTRA-REAL VTO 4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@300;400;600&display=swap');
        
        body { background-color: #020c0a; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        
        /* 2nd Image Wala Cinematic Studio Background */
        .studio-bg {
            background: radial-gradient(circle at 50% 30%, #0a2d24 0%, #020c0a 70%);
            position: relative;
            border-radius: 40px;
            border: 1px solid rgba(191, 149, 63, 0.1);
        }

        /* Glass UI Panels */
        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
        }

        /* Scanner Animation (2nd Image Wala) */
        .scanner-line {
            position: absolute; width: 100%; height: 2px;
            background: linear-gradient(to right, transparent, #BF953F, transparent);
            box-shadow: 0 0 15px #BF953F; z-index: 50; top: 0; display: none;
            animation: scanMove 3s infinite linear;
        }
        @keyframes scanMove { 0% { top: 10%; } 100% { top: 90%; } }

        /* Custom Slider (Anatomy Panel) */
        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 2px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #BF953F; cursor: pointer; border: 2px solid #fff; }

        .btn-gold { background: linear-gradient(to right, #BF953F, #B38728); color: #000; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(191, 149, 63, 0.4); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="w-full h-full max-w-[1400px] flex gap-6 flex-col lg:flex-row">
        
        <div class="flex-grow studio-bg relative flex flex-col items-center justify-center overflow-hidden">
            <div class="absolute top-10 left-10">
                <h1 class="text-3xl gold-text italic tracking-tighter">ULTRA-REAL VTO</h1>
                <p class="text-[9px] tracking-[4px] uppercase opacity-50">Cinematic Rendering Engine 4.0</p>
            </div>

            <div id="scanner" class="scanner-line"></div>

            <div class="relative z-10 w-full h-full flex items-center justify-center p-12">
                <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="cursor-pointer text-center group">
                    <input type="file" id="file-input" class="hidden" onchange="handleUpload(event)">
                    <div id="upload-icon" class="mb-4 opacity-30 group-hover:opacity-100 transition">
                        <i data-lucide="camera" class="w-16 h-16 mx-auto text-gold"></i>
                    </div>
                    <p id="upload-text" class="text-xs font-bold tracking-widest opacity-40 uppercase">Click to Upload Full-Body Photo</p>
                    <img id="user-photo" class="hidden max-h-[80vh] rounded-2xl shadow-2xl border border-white/10">
                </div>
            </div>

            <button class="absolute bottom-8 btn-gold px-10 py-3 rounded-full text-[10px]">
                CAPTURE SNAPSHOT & SHARE
            </button>
        </div>

        <div class="w-full lg:w-[420px] flex flex-col gap-4">
            
            <div class="glass-panel p-6 flex-grow">
                <div class="flex gap-6 border-b border-white/10 mb-6 text-[11px] font-bold tracking-widest">
                    <button class="pb-3 border-b-2 border-gold text-gold uppercase">Anatomy</button>
                    <button class="pb-3 opacity-30 uppercase">Outfit</button>
                    <button class="pb-3 opacity-30 uppercase">Studio</button>
                </div>

                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between text-[10px] mb-2 uppercase opacity-60"><span>Body Mass</span> <span>82%</span></div>
                        <input type="range" class="w-full" value="82">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] mb-2 uppercase opacity-60"><span>Height</span> <span>165cm</span></div>
                        <input type="range" class="w-full" value="60">
                    </div>
                    
                    <div class="mt-8">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-4 opacity-40">Outfit Selection</p>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white/5 p-2 rounded-xl border border-gold/30 cursor-pointer" onclick="triggerTryOn('Saree')">
                                <div class="bg-zinc-800 h-24 rounded-lg mb-2 overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=200" class="w-full h-full object-cover">
                                </div>
                                <p class="text-[9px] font-bold text-center uppercase">Red Sequin Saree</p>
                            </div>
                            <div class="bg-white/5 p-2 rounded-xl border border-white/5 cursor-pointer" onclick="triggerTryOn('Denim')">
                                <div class="bg-zinc-800 h-24 rounded-lg mb-2 overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=200" class="w-full h-full object-cover">
                                </div>
                                <p class="text-[9px] font-bold text-center uppercase">Classic Denim</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-5 border border-gold/20">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <p id="ai-status" class="text-[9px] font-bold tracking-widest uppercase text-white/70">AI Fabric Engine Active</p>
                </div>
                <p class="text-[8px] mt-1 italic opacity-30">PBR Rendering: 98.2% Fit Accuracy</p>
            </div>
        </div>
    </div>

    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 text-center opacity-20 z-50 pointer-events-none">
        <p class="text-[7px] tracking-[5px] uppercase">© 2026 GIA LUXE | ALTER PROJECT | VIRTUAL TRIAL PATENTED</p>
    </div>

    <script>
        function handleUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('upload-icon').style.display = 'none';
                document.getElementById('upload-text').style.display = 'none';
                const img = document.getElementById('user-photo');
                img.src = event.target.result;
                img.classList.remove('hidden');
                document.getElementById('ai-status').innerText = "Digital Twin Created. Ready for Drape.";
            }
            reader.readAsDataURL(file);
        }

        function triggerTryOn(item) {
            const scanner = document.getElementById('scanner');
            const status = document.getElementById('ai-status');
            
            if(document.getElementById('user-photo').classList.contains('hidden')) {
                alert("Please upload your photo first!");
                return;
            }

            scanner.style.display = 'block';
            status.innerText = `Analyzing Fabric & Draping ${item}...`;
            status.style.color = "#BF953F";

            setTimeout(() => {
                scanner.style.display = 'none';
                status.innerText = `${item} Applied Successfully. Rendering Shadows...`;
                status.style.color = "#22c55e";
                // In a real AI setup, this is where the image changes.
            }, 3000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
