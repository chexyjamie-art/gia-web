<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Cinematic VTO 4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');
        body { background: #020a08; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        
        /* Premium UI Elements */
        .gold-glow { text-shadow: 0 0 15px rgba(191, 149, 63, 0.5); color: #FCF6BA; }
        .glass-ui { background: rgba(15, 25, 22, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .active-tab { border-bottom: 2px solid #BF953F; color: #BF953F; }
        
        /* Mobile vs Web View */
        .side-panel { width: 380px; position: fixed; right: 20px; top: 20px; bottom: 20px; z-index: 100; transition: 0.3s; }
        @media (max-width: 768px) {
            .side-panel { width: calc(100% - 40px); height: 40%; top: auto; bottom: 20px; }
        }

        /* Natural Range Slider */
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 10px; width: 100%; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #BF953F; border-radius: 50%; box-shadow: 0 0 10px rgba(191, 149, 63, 0.8); cursor: pointer; }

        #loader { position: fixed; inset: 0; background: #020a08; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loader">
        <h1 class="text-3xl font-bold tracking-[10px] gold-glow mb-2 italic">GIA LUXE</h1>
        <p class="text-[10px] opacity-40 uppercase tracking-[5px]">Cinematic Rendering Engine 4.0</p>
        <div class="w-48 h-[1px] bg-white/10 mt-10 overflow-hidden"><div id="bar" class="h-full bg-gold-glow w-0 transition-all"></div></div>
    </div>

    <div id="vto-viewport" class="w-full h-screen"></div>

    <div class="absolute top-10 left-10 z-50 pointer-events-none">
        <h2 class="text-xl font-light tracking-[8px] opacity-80 uppercase">Ultra-Real VTO</h2>
        <p class="text-[9px] gold-glow uppercase font-bold mt-1">GIA LUXE Digital Twin System</p>
    </div>

    <div class="side-panel glass-ui p-6 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <div class="flex gap-4 text-[11px] font-bold tracking-widest">
                <button class="active-tab pb-2">ANATOMY</button>
                <button class="opacity-30 pb-2">OUTFIT</button>
                <button class="opacity-30 pb-2">STUDIO</button>
            </div>
            <div class="flex bg-black/40 p-1 rounded-full border border-white/5">
                <button id="f-toggle" onclick="setGender('female')" class="px-4 py-1 text-[9px] font-bold rounded-full bg-[#BF953F] text-black">FEMALE</button>
                <button id="m-toggle" onclick="setGender('male')" class="px-4 py-1 text-[9px] font-bold rounded-full opacity-40">MALE</button>
            </div>
        </div>

        <div class="space-y-8 overflow-y-auto pr-2 custom-scroll">
            <div>
                <div class="flex justify-between text-[10px] uppercase font-bold mb-3 opacity-60"><span>Body Mass</span><span id="mass-label">100%</span></div>
                <input type="range" min="0.8" max="1.3" step="0.01" value="1" oninput="changeBody('mass', this.value)">
            </div>

            <div>
                <div class="flex justify-between text-[10px] uppercase font-bold mb-3 opacity-60"><span>Statue (Height)</span><span id="height-label">175cm</span></div>
                <input type="range" min="0.85" max="1.15" step="0.01" value="1" oninput="changeBody('height', this.value)">
            </div>

            <div>
                <p class="text-[10px] uppercase font-bold mb-4 opacity-60 tracking-widest">Melanin (Skin Tone)</p>
                <div class="flex gap-3">
                    <button onclick="setSkin('#f8d5c2')" class="w-10 h-10 rounded-xl border border-white/10" style="background: #f8d5c2;"></button>
                    <button onclick="setSkin('#d9a181')" class="w-10 h-10 rounded-xl border border-white/10" style="background: #d9a181;"></button>
                    <button onclick="setSkin('#8d5524')" class="w-10 h-10 rounded-xl border border-white/10" style="background: #8d5524;"></button>
                    <button onclick="setSkin('#3d2314')" class="w-10 h-10 rounded-xl border border-white/10" style="background: #3d2314;"></button>
                </div>
            </div>

            <div>
                <p class="text-[10px] uppercase font-bold mb-4 opacity-60 tracking-widest">Studio Poses</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="playAnim('idle')" class="py-4 rounded-xl bg-white/5 border border-white/10 text-[9px] font-bold tracking-widest hover:border-gold-glow">CLASSIC IDLE</button>
                    <button onclick="playAnim('walk')" class="py-4 rounded-xl bg-white/5 border border-white/10 text-[9px] font-bold tracking-widest hover:border-gold-glow">CATWALK</button>
                </div>
            </div>
        </div>

        <button class="mt-auto w-full py-5 bg-gradient-to-r from-[#BF953F] to-[#FCF6BA] text-black font-black text-[11px] uppercase tracking-widest rounded-2xl shadow-lg shadow-gold/20">
            Capture Snapshot & Share
        </button>
    </div>

    <script>
        let sc, cam, rend, model, mix, ctrl, clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        function init() {
            sc = new THREE.Scene();
            // Deep Cinematic Green/Black
            sc.background = new THREE.Color(0x020a08);
            
            cam = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            cam.position.set(0, 1.4, 5);

            rend = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            rend.setSize(window.innerWidth, window.innerHeight);
            rend.setPixelRatio(window.devicePixelRatio);
            rend.toneMapping = THREE.ACESFilmicToneMapping;
            rend.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('vto-viewport').appendChild(rend.domElement);

            // Orbit Controls for 360 view
            ctrl = new THREE.OrbitControls(cam, rend.domElement);
            ctrl.enableDamping = true;
            ctrl.minDistance = 2;
            ctrl.maxDistance = 7;
            ctrl.target.set(0, 1, 0);

            // Lighting for "Natural" Look
            const amb = new THREE.AmbientLight(0xffffff, 0.4);
            sc.add(amb);
            
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(2, 4, 5);
            sc.add(keyLight);

            // Floor Reflection Panel (Like your image)
            const glassGeo = new THREE.PlaneGeometry(3, 3);
            const glassMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness: 0.1, roughness: 0.05, transmission: 0.9, transparent: true, opacity: 0.1 
            });
            const glassFloor = new THREE.Mesh(glassGeo, glassMat);
            glassFloor.rotation.x = -Math.PI / 2;
            sc.add(glassFloor);

            loadBody('female');
            animate();
        }

        function loadBody(gender) {
            // Using stable High-Quality ReadyPlayerMe links
            const url = gender === 'female' 
                ? 'https://models.readyplayer.me/64db42b39f375084931a2936.glb' 
                : 'https://models.readyplayer.me/64db432a9f375084931a2a4d.glb';

            loader.load(url, (g) => {
                if(model) sc.remove(model);
                model = g.scene;
                sc.add(model);
                mix = new THREE.AnimationMixer(model);
                document.getElementById('loader').style.display = 'none';
            }, (xhr) => {
                document.getElementById('bar').style.width = (xhr.loaded / xhr.total * 100) + '%';
            });
        }

        function setGender(g) {
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('f-toggle').className = g === 'female' ? "px-4 py-1 text-[9px] font-bold rounded-full bg-[#BF953F] text-black" : "px-4 py-1 text-[9px] font-bold rounded-full opacity-40";
            document.getElementById('m-toggle').className = g === 'male' ? "px-4 py-1 text-[9px] font-bold rounded-full bg-[#BF953F] text-black" : "px-4 py-1 text-[9px] font-bold rounded-full opacity-40";
            loadBody(g);
        }

        function changeBody(type, val) {
            if(!model) return;
            if(type === 'mass') {
                model.scale.x = model.scale.z = val;
                document.getElementById('mass-label').innerText = Math.round(val*100) + '%';
            } else {
                model.scale.y = val;
                document.getElementById('height-label').innerText = Math.round(175*val) + 'cm';
            }
        }

        function setSkin(color) {
            model.traverse(o => {
                if(o.isMesh && o.material.name.toLowerCase().includes('skin')) {
                    o.material.color.set(color);
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(mix) mix.update(clock.getDelta());
            ctrl.update();
            rend.render(sc, cam);
        }

        window.onload = init;
        window.onresize = () => {
            cam.aspect = window.innerWidth / window.innerHeight;
            cam.updateProjectionMatrix();
            rend.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
