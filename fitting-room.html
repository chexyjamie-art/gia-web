<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | ADVANCED AI STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background: #010807; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .gold-gradient { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Studio Stage - 3D Perspective */
        .studio-stage {
            perspective: 1200px;
            display: flex; align-items: center; justify-content: center;
            height: 70vh; position: relative;
        }

        /* 3D Model Rotation Logic (Kolors + CLO3D Style) */
        #digital-twin {
            height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 0 50px rgba(0,0,0,0.8));
        }

        .clothing-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; mix-blend-mode: multiply; opacity: 0.9;
        }

        /* Scan Line Animation like Motorola/Kolors */
        .scan-effect {
            position: absolute; width: 100%; height: 4px;
            background: rgba(191, 149, 63, 0.8); box-shadow: 0 0 20px #BF953F;
            z-index: 100; top: 0; display: none;
            animation: scanning 2s linear infinite;
        }
        @keyframes scanning { 0% { top: 0%; } 100% { top: 100%; } }

        .sidebar { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border-left: 1px solid rgba(191,149,63,0.1); }
    </style>
</head>
<body>

    <div class="flex h-screen w-screen">
        <div class="flex-1 relative overflow-hidden flex flex-col items-center justify-center">
            <div class="absolute top-10 text-center">
                <h1 class="text-4xl font-bold gold-gradient italic">GIA LUXE</h1>
                <p class="text-[8px] tracking-[5px] uppercase opacity-50">AI-Diffusion & 3D Mesh Engine v6.0</p>
            </div>

            <div class="studio-stage w-full">
                <div id="scan-line" class="scan-effect"></div>
                
                <div id="upload-prompt" onclick="document.getElementById('input-file').click()" class="cursor-pointer border-2 border-dashed border-white/10 p-20 rounded-[40px] text-center hover:bg-white/5 transition">
                    <input type="file" id="input-file" class="hidden" onchange="runAILogic(event)">
                    <p class="text-xs font-bold tracking-widest uppercase text-gold">Upload Full Image</p>
                    <p class="text-[9px] opacity-40 mt-2">AI will remove background & create 3D twin</p>
                </div>

                <div id="digital-twin" class="hidden">
                    <img id="user-body" class="h-full object-contain">
                    <img id="garment-overlay" class="clothing-layer hidden">
                </div>
            </div>

            <div class="absolute bottom-10 flex gap-4">
                <button onclick="rotateModel(-20)" class="bg-white/5 p-4 rounded-full border border-white/10 hover:border-gold">↺</button>
                <button onclick="resetModel()" class="bg-gold/10 px-8 py-3 rounded-full border border-gold/30 text-[10px] font-bold uppercase tracking-widest text-gold">Reset Perspective</button>
                <button onclick="rotateModel(20)" class="bg-white/5 p-4 rounded-full border border-white/10 hover:border-gold">↻</button>
            </div>
        </div>

        <div class="sidebar w-[400px] p-8 overflow-y-auto">
            <h2 class="text-xs font-bold tracking-[4px] text-gold mb-10 uppercase">AI Wardrobe</h2>
            
            <div class="grid grid-cols-1 gap-6">
                <div class="group cursor-pointer" onclick="wrapGarment('saree')">
                    <div class="relative rounded-2xl overflow-hidden border border-white/5 group-hover:border-gold/50 transition">
                        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" class="w-full h-48 object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                            <span class="text-[10px] font-bold tracking-widest bg-gold text-black px-4 py-2 rounded-full">TRY ON</span>
                        </div>
                    </div>
                    <p class="text-[11px] font-bold mt-3 uppercase tracking-widest">Banarasi Silk Saree</p>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-2 left-1/2 -translate-x-1/2 opacity-20 pointer-events-none text-[8px] tracking-[4px]">
        © 2026 GIA LUXE | ALTER PROJECT | PATENTED VIRTUAL TRY-ON
    </div>

    <script>
        let currentRotation = 0;

        function runAILogic(e) {
            const file = e.target.files[0];
            const scanLine = document.getElementById('scan-line');
            const uploadPrompt = document.getElementById('upload-prompt');
            const digitalTwin = document.getElementById('digital-twin');
            const userBody = document.getElementById('user-body');

            uploadPrompt.style.display = 'none';
            scanLine.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(f) {
                userBody.src = f.target.result;
                
                // Simulation of Kolors AI Background Removal
                setTimeout(() => {
                    scanLine.style.display = 'none';
                    digitalTwin.style.display = 'block';
                    // Apply transparent-look filter to simulate BG removal
                    userBody.style.filter = "drop-shadow(0 0 50px black)";
                }, 2000);
            }
            reader.readAsDataURL(file);
        }

        function rotateModel(deg) {
            currentRotation += deg;
            document.getElementById('digital-twin').style.transform = `rotateY(${currentRotation}deg)`;
        }

        function resetModel() {
            currentRotation = 0;
            document.getElementById('digital-twin').style.transform = `rotateY(0deg)`;
        }

        function wrapGarment(item) {
            const overlay = document.getElementById('garment-overlay');
            overlay.src = "https://www.transparentpng.com/download/sari/indian-sari-free-png-images-12.png";
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.style.opacity = "1"; }, 100);
        }
    </script>
</body>
</html>
