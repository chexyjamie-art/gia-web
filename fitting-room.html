<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GIA Luxe Try-On Studio</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle at top,#0b132b,#000);
color:white;
text-align:center;
}

.title{
margin-top:20px;
font-size:28px;
letter-spacing:2px;
color:#d4af37;
}

.stage{
margin:30px auto;
width:320px;
height:520px;
position:relative;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 50px rgba(0,0,0,.9);
background:black;
}

#basePhoto{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
z-index:1;
}

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
pointer-events:auto;
z-index:2;
transition:.3s;
mix-blend-mode:multiply;
}

.controls{
margin-top:15px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
margin:6px;
font-size:15px;
cursor:pointer;
background:linear-gradient(45deg,#6A8DFF,#9B59FF);
color:white;
}

input{
margin-top:15px;
}

.products{
margin-top:25px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.card{
width:110px;
background:#111;
border-radius:15px;
padding:10px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 15px #6A8DFF;
}

.card img{
width:100%;
}

</style>
</head>
<body>

<h1 class="title">GIA LUXE AI TRY-ON</h1>

<div class="stage" id="stage">
<img id="basePhoto">
<img id="overlay">
</div>

<input type="file" accept="image/*" id="upload">

<div class="controls">
<button onclick="clearCloth()">Remove Outfit</button>
<button onclick="capture()">Capture</button>
</div>

<div class="products">

<div class="card" onclick="wear('https://i.ibb.co/0jqHpnp/shirt.png')">
<img src="https://i.ibb.co/0jqHpnp/shirt.png">
<p>Shirt</p>
</div>

<div class="card" onclick="wear('https://i.ibb.co/x5kq6jS/jacket.png')">
<img src="https://i.ibb.co/x5kq6jS/jacket.png">
<p>Jacket</p>
</div>

<div class="card" onclick="wear('https://i.ibb.co/2cLw9cB/saree.png')">
<img src="https://i.ibb.co/2cLw9cB/saree.png">
<p>Saree</p>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>

<script>

const basePhoto=document.getElementById("basePhoto")
const overlay=document.getElementById("overlay")

/* UPLOAD IMAGE */
upload.onchange=e=>{
const file=e.target.files[0]
if(!file)return
basePhoto.src=URL.createObjectURL(file)

setTimeout(()=>{
segmentBody()
matchLighting()
},500)
}

/* WEAR CLOTH */
function wear(src){

overlay.src=src

setTimeout(()=>{
smartFit()
clothPhysics()
foldEffect()
},200)

}

/* AUTO FIT */
function smartFit(){

let w=basePhoto.clientWidth
let h=basePhoto.clientHeight

overlay.style.width=w*0.72+"px"
overlay.style.left=w*0.14+"px"
overlay.style.top=h*0.18+"px"
overlay.style.height=h*0.65+"px"
}

/* DRAG */
let drag=false,offX,offY

overlay.onmousedown=e=>{
drag=true
offX=e.offsetX
offY=e.offsetY
}

document.onmouseup=()=>drag=false

document.onmousemove=e=>{
if(!drag)return
overlay.style.left=e.pageX-offX+"px"
overlay.style.top=e.pageY-offY+"px"
}

/* SCROLL SCALE */
overlay.onwheel=e=>{
e.preventDefault()
overlay.style.width=(overlay.clientWidth + e.deltaY*-0.1)+"px"
}

/* REMOVE */
function clearCloth(){
overlay.src=""
}

/* SNAPSHOT */
function capture(){
html2canvas(document.querySelector(".stage"))
.then(canvas=>{
let a=document.createElement("a")
a.download="TryOn.png"
a.href=canvas.toDataURL()
a.click()
})
}

/* SEGMENT BODY */
async function segmentBody(){

const net=await bodyPix.load()
const seg=await net.segmentPerson(basePhoto)

const canvas=document.createElement("canvas")
canvas.width=basePhoto.width
canvas.height=basePhoto.height

const ctx=canvas.getContext("2d")
ctx.drawImage(basePhoto,0,0)

const mask=bodyPix.toMask(seg)
bodyPix.drawMask(canvas,basePhoto,mask,0.6,0,false)

document.getElementById("stage").appendChild(canvas)
}

/* LIGHT MATCH */
function matchLighting(){

let img=new Image()
img.src=basePhoto.src

img.onload=()=>{
let canvas=document.createElement("canvas")
let ctx=canvas.getContext("2d")

canvas.width=img.width
canvas.height=img.height
ctx.drawImage(img,0,0)

let data=ctx.getImageData(0,0,canvas.width,canvas.height).data

let total=0
for(let i=0;i<data.length;i+=4)
total+=data[i]+data[i+1]+data[i+2]

let bright=total/(data.length/4)/3
overlay.style.filter=`brightness(${bright/128})`
}
}

/* PHYSICS */
function clothPhysics(){

let gravity=0.5
let vel=0

function fall(){

vel+=gravity
overlay.style.top=(overlay.offsetTop+vel)+"px"

if(overlay.offsetTop>200) vel*=-0.3

requestAnimationFrame(fall)
}

fall()
}

/* FOLD EFFECT */
function foldEffect(){
overlay.style.transform=`
perspective(800px)
rotateX(${Math.random()*2}deg)
rotateY(${Math.random()*2}deg)
skewX(${Math.random()*1}deg)
`
}

</script>

</body>
</html>
