<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | 3D VTO OVERLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;700&display=swap');
        
        body { background: #010807; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        
        /* 2nd Image Layout */
        .app-container { display: grid; grid-template-columns: 1fr 380px; height: 100vh; width: 100vw; background: radial-gradient(circle at 30% 40%, #0a2d24 0%, #010807 80%); }

        /* Photo Mirror Area */
        .mirror-area { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* The Overlay Magic Container */
        .vto-stage { position: relative; display: inline-block; max-height: 85vh; }
        #user-img { max-height: 80vh; border-radius: 15px; display: block; }
        
        /* Product Overlay (This will stick ON TOP of the photo) */
        #product-layer { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: contain; 
            pointer-events: none; 
            z-index: 50; 
            opacity: 0; 
            transition: opacity 0.5s ease-in-out;
            /* Filter to keep original color */
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.2));
        }

        .laser { position: absolute; width: 100%; height: 3px; background: #BF953F; box-shadow: 0 0 20px #BF953F; z-index: 100; top: 0; display: none; animation: scanAnim 2s infinite; }
        @keyframes scanAnim { 0% { top: 0%; } 100% { top: 100%; } }

        .sidebar { background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-left: 1px solid rgba(191,149,63,0.1); padding: 30px; }
        .btn-try { background: linear-gradient(to right, #BF953F, #B38728); color: black; font-weight: 800; padding: 10px 20px; border-radius: 8px; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mirror-area">
            <div class="absolute top-8 left-10">
                <h1 class="text-3xl gold-text italic">ULTRA-REAL VTO</h1>
                <p class="text-[9px] tracking-[4px] opacity-40 uppercase">GIA LUXE AI Engine</p>
            </div>

            <div class="vto-stage" id="main-stage">
                <div id="laser" class="laser"></div>
                
                <div id="upload-box" onclick="document.getElementById('input-file').click()" class="border-2 border-dashed border-white/10 p-20 rounded-[40px] cursor-pointer text-center">
                    <input type="file" id="input-file" class="hidden" onchange="previewUser(event)">
                    <i data-lucide="camera" class="w-12 h-12 mx-auto mb-4 text-gold/30"></i>
                    <p class="text-[10px] font-bold tracking-widest opacity-40">UPLOAD PHOTO</p>
                </div>

                <img id="user-img" class="hidden">
                <img id="product-layer" class="hidden">
            </div>
        </div>

        <div class="sidebar">
            <h2 class="text-xs font-bold tracking-[4px] text-gold mb-10 border-b border-white/10 pb-4 uppercase">Wardrobe</h2>
            
            <div class="space-y-6">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" class="w-full h-32 object-cover rounded-xl mb-3">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-bold">RED SAREE</span>
                        <button onclick="tryNow('saree')" class="btn-try text-[9px]">Try Now</button>
                    </div>
                </div>

                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <img src="https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=400" class="w-full h-32 object-cover rounded-xl mb-3">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] font-bold">DENIM JACKET</span>
                        <button onclick="tryNow('denim')" class="btn-try text-[9px]">Try Now</button>
                    </div>
                </div>
            </div>

            <div class="mt-20 p-4 bg-gold/5 rounded-xl border border-gold/10">
                <p id="status" class="text-[9px] font-bold uppercase opacity-50 text-center">Engine Ready</p>
            </div>
        </div>
    </div>

    <script>
        function previewUser(e) {
            const reader = new FileReader();
            reader.onload = function(f) {
                document.getElementById('upload-box').style.display = 'none';
                const img = document.getElementById('user-img');
                img.src = f.target.result;
                img.classList.remove('hidden');
                document.getElementById('status').innerText = "PHOTO LOADED. SELECT PRODUCT.";
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function tryNow(item) {
            const userImg = document.getElementById('user-img');
            const layer = document.getElementById('product-layer');
            const laser = document.getElementById('laser');
            const status = document.getElementById('status');

            if(userImg.classList.contains('hidden')) {
                alert("Pehle photo upload karein!");
                return;
            }

            laser.style.display = 'block';
            status.innerText = "WRAPPING PRODUCT...";
            layer.style.opacity = "0";

            setTimeout(() => {
                laser.style.display = 'none';
                
                // Logic: Overlay precisely on top of user image
                if(item === 'saree') {
                    layer.src = "https://www.transparentpng.com/download/sari/indian-sari-free-png-images-12.png";
                } else {
                    layer.src = "https://www.transparentpng.com/download/jacket/blue-jacket-png-images-21.png";
                }

                layer.classList.remove('hidden');
                layer.style.opacity = "1";
                status.innerText = "TRY-ON COMPLETE!";
                status.style.color = "#BF953F";
            }, 2000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
