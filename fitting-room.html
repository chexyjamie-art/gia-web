<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | AI 3D TRY-ON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@300;400;700&display=swap');
        
        body { background: #010807; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        
        /* 2nd Image Wala Cinematic Look */
        .main-studio {
            background: radial-gradient(circle at 50% 40%, #0a2d24 0%, #010807 80%);
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3D Glass Platform (Jahan Customer Khada Hoga) */
        .glass-platform {
            position: absolute; bottom: 15%; width: 400px; height: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transform: perspective(500px) rotateX(60deg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(191, 149, 63, 0.2);
        }

        /* Auto-Sizing & Wrapping Container */
        .vto-container {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            height: 80vh; width: 100%;
        }

        #customer-photo { 
            max-height: 100%; width: auto; 
            border-radius: 10px; transition: 0.5s;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.8));
        }

        /* The 3D Overlay Layer (Automatic Wrap) */
        #product-overlay {
            position: absolute;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            /* Yeh filter product ka color original rakhta hai */
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); 
        }

        .side-panel {
            position: absolute; right: 40px; top: 100px; width: 350px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(30px);
            border: 1px solid rgba(191, 149, 63, 0.2); border-radius: 30px;
            padding: 24px;
        }

        /* Try On Button Style */
        .btn-try {
            background: linear-gradient(to right, #BF953F, #B38728);
            color: black; font-weight: 900; letter-spacing: 1px;
            padding: 12px 30px; border-radius: 12px; transition: 0.3s;
        }
        .btn-try:hover { transform: scale(1.05); box-shadow: 0 0 20px #BF953F; }

        .scan-bar {
            position: absolute; width: 100%; height: 3px; background: #BF953F;
            box-shadow: 0 0 20px #BF953F; z-index: 50; display: none;
            animation: scan 2.5s infinite ease-in-out;
        }
        @keyframes scan { 0% { top: 20%; opacity: 0; } 50% { opacity: 1; } 100% { top: 80%; opacity: 0; } }
    </style>
</head>
<body>

    <div class="main-studio">
        <div class="absolute top-10 left-10">
            <h1 class="text-4xl gold-text italic">GIA LUXE</h1>
            <p class="text-[10px] tracking-[5px] uppercase opacity-40">Ultra-Real 3D Virtual Studio</p>
        </div>

        <div class="glass-platform"></div>

        <div class="vto-container" id="vto-screen">
            <div id="scanner" class="scan-bar"></div>
            
            <div id="upload-box" onclick="document.getElementById('input-file').click()" class="border-2 border-dashed border-white/10 p-20 rounded-[40px] cursor-pointer hover:bg-white/5 transition text-center">
                <input type="file" id="input-file" class="hidden" onchange="loadCustomer(event)">
                <i data-lucide="user" class="w-12 h-12 mx-auto mb-4 text-gold/40"></i>
                <p class="text-[10px] font-bold tracking-widest uppercase opacity-60">Upload Your Photo</p>
            </div>

            <img id="customer-photo" class="hidden">
            <img id="product-overlay" class="hidden">
        </div>

        <div class="side-panel">
            <div class="flex gap-6 border-b border-white/5 mb-6 text-[11px] font-bold tracking-widest">
                <button class="pb-3 border-b-2 border-gold text-gold">WARDROBE</button>
                <button class="pb-3 opacity-30">COLLECTION</button>
            </div>

            <div class="space-y-4">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" class="w-full h-32 object-cover rounded-xl mb-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-[9px] gold-text font-bold">GIA LUXE</p>
                            <p class="text-xs font-bold">Red Sequin Saree</p>
                        </div>
                        <button onclick="startTryOn('saree')" class="btn-try text-[10px]">TRY ON</button>
                    </div>
                </div>

                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <img src="https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=400" class="w-full h-32 object-cover rounded-xl mb-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-[9px] gold-text font-bold">ALTER PROJECT</p>
                            <p class="text-xs font-bold">Denim Classic Kit</p>
                        </div>
                        <button onclick="startTryOn('denim')" class="btn-try text-[10px]">TRY ON</button>
                    </div>
                </div>
            </div>

            <div class="mt-10 p-4 bg-gold/5 rounded-2xl border border-gold/10">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span id="engine-status" class="text-[9px] font-bold uppercase opacity-70">AI Engine Ready</span>
                </div>
                <p class="text-[8px] opacity-30 italic">PBR Rendering | Zero Color Shift Tech</p>
            </div>
        </div>

        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center opacity-30 pointer-events-none">
            <p class="text-[8px] tracking-[6px] uppercase font-bold">© 2026 GIA LUXE | ALTER PROJECT | HIGH-FIDELITY VTO</p>
        </div>
    </div>

    <script>
        function loadCustomer(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('upload-box').style.display = 'none';
                const img = document.getElementById('customer-photo');
                img.src = event.target.result;
                img.classList.remove('hidden');
                document.getElementById('engine-status').innerText = "3D POSE DETECTED. READY FOR WRAP.";
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function startTryOn(type) {
            const customer = document.getElementById('customer-photo');
            const overlay = document.getElementById('product-overlay');
            const scanner = document.getElementById('scanner');
            const status = document.getElementById('engine-status');

            if(customer.classList.contains('hidden')) {
                alert("Please upload your photo first!");
                return;
            }

            // Start 3D Scanning Effect
            scanner.style.display = 'block';
            status.innerText = "WRAPPING 3D FABRIC ON IMAGE...";
            status.style.color = "#BF953F";

            setTimeout(() => {
                scanner.style.display = 'none';
                
                // Auto-Sizing Logic
                overlay.style.width = customer.clientWidth + "px"; 
                overlay.style.height = customer.clientHeight + "px";

                // Set Product Image (Transparent PNGs)
                if(type === 'saree') {
                    overlay.src = "https://www.transparentpng.com/download/sari/indian-sari-free-png-images-12.png";
                } else {
                    overlay.src = "https://www.transparentpng.com/download/jacket/blue-jacket-png-images-21.png";
                }

                overlay.classList.remove('hidden');
                overlay.style.opacity = "1";
                
                // Realism: Light shadow on customer to blend
                customer.style.filter = "brightness(0.9) contrast(1.1)";
                
                status.innerText = "SUCCESS: 3D WRAP COMPLETE (98.4%)";
                status.style.color = "#22c55e";
            }, 2500);
        }

        lucide.createIcons();
    </script>
</body>
</html>
