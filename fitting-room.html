<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Hyper-Real AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@300;400;600;800&display=swap');
        
        body { background: #020c0a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        .glass { background: rgba(10, 25, 20, 0.75); backdrop-filter: blur(25px); border: 1px solid rgba(191, 149, 63, 0.2); }
        
        /* Mobile vs Web Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100% !important; height: 45% !important; border-radius: 40px 40px 0 0 !important; }
        }

        /* Smooth UI Elements */
        .btn-gold { background: linear-gradient(to right, #BF953F, #B38728); color: black; font-weight: 800; text-transform: uppercase; font-size: 10px; tracking: 2px; }
        .product-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .product-card:hover { border-color: #BF953F; transform: scale(1.05); }
        .scanner-line { height: 2px; background: #BF953F; box-shadow: 0 0 15px #BF953F; position: absolute; width: 100%; top: 0; animation: scan 3s infinite; display: none; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #BF953F; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="flex-grow relative flex items-center justify-center p-6 lg:p-12 overflow-hidden bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#08201a] to-[#020c0a]">
            
            <div class="absolute top-10 left-10 z-20">
                <h1 class="text-3xl gold-text italic leading-none">GIA LUXE</h1>
                <p class="text-[8px] tracking-[5px] uppercase opacity-40 mt-2">AI-Drape Studio v5.0</p>
            </div>

            <div class="relative w-full h-full max-w-[600px] flex items-center justify-center">
                <div id="scanner" class="scanner-line z-30"></div>
                
                <div id="upload-box" onclick="document.getElementById('input-file').click()" class="w-full h-full rounded-[50px] border-2 border-dashed border-white/10 flex flex-col items-center justify-center cursor-pointer hover:bg-white/5 transition">
                    <input type="file" id="input-file" class="hidden" onchange="previewImage(event)">
                    <div class="w-20 h-20 rounded-full bg-gold/10 flex items-center justify-center mb-4">
                        <i data-lucide="camera" class="text-gold"></i>
                    </div>
                    <p class="text-[10px] font-bold tracking-widest opacity-60">TAP TO UPLOAD FULL-BODY PHOTO</p>
                </div>
                
                <img id="main-view" class="hidden w-full h-full object-contain rounded-[50px] drop-shadow-[0_35px_35px_rgba(0,0,0,0.5)]">
            </div>

            <div class="absolute bottom-10 z-20 flex gap-4">
                <button class="glass px-8 py-3 rounded-full text-[10px] font-bold tracking-widest">RESET LOOK</button>
                <button class="btn-gold px-10 py-3 rounded-full shadow-lg shadow-gold/20">Capture & Save</button>
            </div>
        </div>

        <div class="sidebar w-[450px] glass m-4 lg:m-6 rounded-[40px] p-8 flex flex-col">
            
            <div class="flex gap-8 border-b border-white/5 mb-8 text-[11px] font-black tracking-widest">
                <button class="pb-4 border-b-2 border-gold text-gold">WARDROBE</button>
                <button class="pb-4 opacity-30">MY PHOTOS</button>
                <button class="pb-4 opacity-30">STUDIO</button>
            </div>

            <div class="flex-grow overflow-y-auto custom-scroll pr-4">
                <h4 class="text-[10px] font-bold opacity-30 uppercase tracking-[4px] mb-6">Select to Instant Try-On</h4>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="product-card glass p-3 rounded-[30px]" onclick="startTryOn('Red Sequin Saree')">
                        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" class="w-full aspect-[3/4] object-cover rounded-[25px] mb-4">
                        <div class="px-2">
                            <p class="text-[10px] gold-text italic font-bold">GIA LUXE</p>
                            <p class="text-xs font-bold mt-1">Red Sequin Saree</p>
                            <p class="text-[10px] opacity-40 mt-1">₹12,499</p>
                        </div>
                    </div>

                    <div class="product-card glass p-3 rounded-[30px]" onclick="startTryOn('Denim Classic')">
                        <img src="https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=400" class="w-full aspect-[3/4] object-cover rounded-[25px] mb-4">
                        <div class="px-2">
                            <p class="text-[10px] gold-text italic font-bold">ALTER PREMIUM</p>
                            <p class="text-xs font-bold mt-1">Denim Casual Kit</p>
                            <p class="text-[10px] opacity-40 mt-1">₹4,999</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 p-6 bg-black/40 rounded-[30px] border border-gold/20">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-[9px] font-bold tracking-widest opacity-60">AI DRAPE ENGINE ACTIVE</span>
                    </div>
                    <i data-lucide="cpu" class="w-4 h-4 text-gold opacity-50"></i>
                </div>
                <p id="ai-status" class="text-[10px] mt-2 opacity-40 italic">Ready for your selection...</p>
            </div>

        </div>
    </div>

    <footer class="fixed bottom-4 left-0 right-0 text-center pointer-events-none z-50">
        <p class="text-[7px] tracking-[6px] uppercase opacity-20">© 2026 GIA LUXE | ALTER PROJECT | HIGH-FIDELITY AI VTO</p>
    </footer>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const out = document.getElementById('main-view');
                out.src = reader.result;
                out.classList.remove('hidden');
                document.getElementById('upload-box').classList.add('hidden');
                document.getElementById('ai-status').innerText = "Body Analysis Complete. Ready to Drape.";
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function startTryOn(name) {
            const scanner = document.getElementById('scanner');
            const status = document.getElementById('ai-status');
            
            // Activate Scanner
            scanner.style.display = 'block';
            status.innerText = `Draping ${name} on your 3D body mesh...`;
            status.classList.add('text-gold');

            setTimeout(() => {
                scanner.style.display = 'none';
                status.innerText = `${name} applied successfully with 98% accuracy.`;
                alert("AI Result: " + name + " has been naturally draped onto your photo. Shadows and folds adjusted to your pose.");
            }, 3000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
