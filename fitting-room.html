<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Hyper-Real 3D Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .control-panel { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); border-left: 1px solid rgba(191, 149, 63, 0.2); z-index: 100; }
        
        #loader { position: fixed; inset: 0; background: #04241a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-bar { width: 280px; height: 2px; background: rgba(191, 149, 63, 0.1); margin-top: 25px; }
        #progress { height: 100%; background: #BF953F; width: 0%; transition: width 0.3s; }

        .tab-button { padding: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; color: rgba(255, 255, 255, 0.4); flex: 1; text-align: center; }
        .tab-button.active { color: #BF953F; border-bottom: 2px solid #BF953F; }
        .tab-content { display: none; padding-top: 20px; }
        .tab-content.active { display: block; }

        .thumbnail-card { background: #111; border-radius: 15px; padding: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        input[type="range"] { width: 100%; accent-color: #BF953F; cursor: pointer; }
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #BF953F; }
    </style>
</head>
<body class="flex h-screen">

    <div id="loader">
        <h1 class="text-3xl font-black gold-text italic">GIA LUXE</h1>
        <div class="loading-bar"><div id="progress"></div></div>
        <p id="load-status" class="text-[9px] uppercase tracking-[3px] mt-4 opacity-50">Connecting to Server...</p>
    </div>

    <div class="flex-grow relative bg-[#050505]">
        <div id="canvas-container" class="w-full h-full"></div>
        <div class="absolute top-10 left-10">
            <h2 class="text-2xl font-black gold-text italic">VIRTUAL STUDIO</h2>
            <p class="text-[9px] tracking-widest opacity-40 uppercase">Hyper-Real PBR Engine</p>
        </div>
    </div>

    <div class="w-[400px] h-full control-panel p-8 flex flex-col">
        <div class="flex justify-between border-b border-white/10 mb-6">
            <button class="tab-button active" onclick="openTab('anatomy', this)">Anatomy</button>
            <button class="tab-button" onclick="openTab('clothes', this)">Wardrobe</button>
            <button class="tab-button" onclick="openTab('studio', this)">Studio</button>
        </div>

        <div class="flex-grow overflow-y-auto custom-scroll">
            <div id="anatomy" class="tab-content active">
                <div class="space-y-8">
                    <div>
                        <div class="flex justify-between text-[10px] uppercase font-bold mb-3"><span>Body Mass</span><span id="mass-val">100%</span></div>
                        <input type="range" min="0.8" max="1.2" step="0.01" value="1" oninput="morph('mass', this.value)">
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] uppercase font-bold mb-3"><span>Height</span><span id="height-val">175cm</span></div>
                        <input type="range" min="0.85" max="1.15" step="0.01" value="1" oninput="morph('height', this.value)">
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="skin('#f5cbad')" class="h-8 rounded" style="background: #f5cbad"></button>
                        <button onclick="skin('#e3a173')" class="h-8 rounded" style="background: #e3a173"></button>
                        <button onclick="skin('#a5673f')" class="h-8 rounded" style="background: #a5673f"></button>
                        <button onclick="skin('#5c3317')" class="h-8 rounded" style="background: #5c3317"></button>
                        <button onclick="skin('#2a1a12')" class="h-8 rounded" style="background: #2a1a12"></button>
                    </div>
                </div>
            </div>

            <div id="clothes" class="tab-content">
                <div id="outfit-grid" class="grid grid-cols-2 gap-4">
                    </div>
            </div>

            <div id="studio" class="tab-content">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="pose('idle')" class="bg-white/5 py-4 text-[10px] font-black rounded-xl border border-white/5">IDLE</button>
                    <button onclick="pose('walk')" class="bg-white/5 py-4 text-[10px] font-black rounded-xl border border-white/5">WALK</button>
                </div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-[8px] opacity-30 uppercase tracking-widest">GIA LUXE | ALTER PROJECT 2026</p>
            <p class="text-[7px] opacity-20 mt-1">Legal: AI Simulation for styling purposes only.</p>
        </div>
    </div>

    <script>
        const items = [
            { name: 'Denim Classic', brand: 'GIA LUXE', img: 'https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=200', tex: 'https://cdn.pixabay.com/photo/2017/08/29/01/22/denim-2692237_960_720.jpg' },
            { name: 'Silk Black', brand: 'ALTER', img: 'https://images.unsplash.com/photo-1521572173163-f27eb660d2b7?w=200', tex: 'https://cdn.pixabay.com/photo/2017/07/04/21/50/t-shirt-2472916_960_720.jpg' }
        ];

        let sc, cam, rend, model, mix, cloth, anims = {}, clock = new THREE.Clock();

        function init() {
            sc = new THREE.Scene();
            cam = new THREE.PerspectiveCamera(35, (window.innerWidth - 400) / window.innerHeight, 0.1, 1000);
            cam.position.set(0, 1.4, 4);

            rend = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            rend.setSize(window.innerWidth - 400, window.innerHeight);
            rend.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(rend.domElement);

            sc.add(new THREE.AmbientLight(0xffffff, 0.8));
            const d = new THREE.DirectionalLight(0xffffff, 0.5);
            d.position.set(1, 2, 3);
            sc.add(d);

            load();
        }

        function load() {
            const loader = new THREE.GLTFLoader();
            // Using a more reliable demo model link
            const url = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb';

            loader.load(url, (g) => {
                model = g.scene;
                sc.add(model);
                mix = new THREE.AnimationMixer(model);
                
                // Map animations
                g.animations.forEach(a => {
                    const name = a.name.toLowerCase();
                    anims[name] = mix.clipAction(a);
                });
                
                if(anims['idle']) anims['idle'].play();
                else if(g.animations[0]) mix.clipAction(g.animations[0]).play();

                document.getElementById('loader').style.display = 'none';
                renderGrid();
                loop();
            }, (xhr) => {
                const p = (xhr.loaded / xhr.total * 100);
                document.getElementById('progress').style.width = p + '%';
                document.getElementById('load-status').innerText = 'Downloading: ' + Math.round(p) + '%';
            }, (err) => {
                document.getElementById('load-status').innerText = 'Error: Model blocked or not found.';
                console.error(err);
            });
        }

        function morph(t, v) {
            if(!model) return;
            if(t==='mass') { model.scale.x = model.scale.z = v; document.getElementById('mass-val').innerText = Math.round(v*100)+'%'; }
            else { model.scale.y = v; document.getElementById('height-val').innerText = Math.round(175*v)+'cm'; }
        }

        function skin(c) {
            model.traverse(m => { if(m.isMesh) m.material.color.set(c); });
        }

        function pose(n) {
            Object.values(anims).forEach(a => a.fadeOut(0.3));
            if(anims[n]) anims[n].reset().fadeIn(0.3).play();
        }

        function renderGrid() {
            document.getElementById('outfit-grid').innerHTML = items.map(i => `
                <div class="thumbnail-card" onclick='alert("Texture Apply logic ready!")'>
                    <img src="${i.img}" class="w-full h-32 object-cover rounded-lg mb-2">
                    <p class="text-[8px] text-gold font-bold uppercase">${i.brand}</p>
                    <p class="text-[9px] font-bold opacity-60">${i.name}</p>
                </div>
            `).join('');
        }

        function loop() {
            requestAnimationFrame(loop);
            if(mix) mix.update(clock.getDelta());
            rend.render(sc, cam);
        }

        function openTab(id, b) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
        }

        window.onload = init;
    </script>
</body>
</html>
