<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Virtual Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Inter:wght@300;400;700&display=swap');
        
        body { background: #051612; color: white; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .gold-border { border: 1.5px solid #BF953F; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        .glass-panel { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(191, 149, 63, 0.3); border-radius: 24px; }
        
        /* Mobile vs Desktop View */
        .main-container { display: flex; height: 100vh; width: 100vw; }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .control-panel { width: 100% !important; height: 40% !important; border-left: none !important; border-top: 2px solid #BF953F; position: absolute; bottom: 0; }
        }

        /* Gold Slider */
        input[type="range"] { -webkit-appearance: none; background: rgba(191, 149, 63, 0.2); height: 2px; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #BF953F; border-radius: 50%; border: 2px solid #FCF6BA; }

        #loader { position: fixed; inset: 0; background: #051612; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-progress { width: 200px; height: 2px; background: rgba(191, 149, 63, 0.1); margin-top: 20px; position: relative; }
        #bar { height: 100%; background: #BF953F; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

    <div id="loader">
        <h1 class="text-4xl gold-text italic">GIA LUXE</h1>
        <div class="loading-progress"><div id="bar"></div></div>
    </div>

    <div class="main-container">
        <div class="flex-grow relative overflow-hidden">
            <div id="canvas-container" class="w-full h-full cursor-move"></div>
            
            <div class="absolute top-10 left-10 pointer-events-none">
                <h1 class="text-3xl gold-text italic leading-none">VIRTUAL<br>STUDIO</h1>
                <p class="text-[9px] tracking-[4px] uppercase text-white/40 mt-2 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Hyper-Real PBR Engine
                </p>
            </div>

            <div class="absolute bottom-10 left-10 glass-panel p-4 flex items-center gap-4 gold-border">
                <div class="w-16 h-16 bg-white/5 rounded-xl border border-white/10 overflow-hidden">
                    <img id="p-img" src="https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=200" class="w-full h-full object-cover">
                </div>
                <div>
                    <p class="text-[8px] text-gold font-bold tracking-widest uppercase">GIA LUXE</p>
                    <h3 id="p-name" class="text-xl italic font-serif text-white">Denim Classic</h3>
                </div>
            </div>
        </div>

        <div class="w-[400px] control-panel glass-panel m-6 p-8 flex flex-col gold-border">
            <div class="flex justify-between items-center mb-8">
                <button class="text-[10px] font-bold uppercase tracking-widest opacity-50">← Exit</button>
                <div class="flex gap-2 bg-black/40 p-1 rounded-full border border-white/10">
                    <button id="btn-female" onclick="switchGender('female')" class="px-4 py-1 text-[9px] font-bold rounded-full bg-gold text-black transition-all">FEMALE</button>
                    <button id="btn-male" onclick="switchGender('male')" class="px-4 py-1 text-[9px] font-bold rounded-full opacity-40 transition-all">MALE</button>
                </div>
            </div>

            <div class="flex gap-4 border-b border-white/10 mb-8">
                <button class="pb-3 text-[10px] font-black tracking-widest border-b-2 border-gold text-gold">ANATOMY</button>
                <button class="pb-3 text-[10px] font-black tracking-widest opacity-30">STUDIO</button>
            </div>

            <div class="space-y-10">
                <div>
                    <div class="flex justify-between text-[10px] font-bold uppercase mb-4 tracking-widest opacity-60"><span>Body Mass</span><span id="mass-label">100%</span></div>
                    <input type="range" min="0.8" max="1.3" step="0.01" value="1" class="w-full" oninput="updateMorph('mass', this.value)">
                </div>
                <div>
                    <div class="flex justify-between text-[10px] font-bold uppercase mb-4 tracking-widest opacity-60"><span>Height</span><span id="height-label">175cm</span></div>
                    <input type="range" min="0.85" max="1.15" step="0.01" value="1" class="w-full" oninput="updateMorph('height', this.value)">
                </div>
                <div>
                    <p class="text-[10px] font-bold uppercase mb-4 tracking-widest opacity-60">Skin Tone</p>
                    <div class="grid grid-cols-5 gap-3">
                        <div onclick="setSkin('#f5cbad')" class="h-8 rounded-lg border border-white/10" style="background: #f5cbad"></div>
                        <div onclick="setSkin('#e3a173')" class="h-8 rounded-lg border border-white/10" style="background: #e3a173"></div>
                        <div onclick="setSkin('#a5673f')" class="h-8 rounded-lg border border-white/10" style="background: #a5673f"></div>
                        <div onclick="setSkin('#5c3317')" class="h-8 rounded-lg border border-white/10" style="background: #5c3317"></div>
                        <div onclick="setSkin('#2a1a12')" class="h-8 rounded-lg border border-white/10 gold-border" style="background: #2a1a12"></div>
                    </div>
                </div>
                
                <div class="pt-4 grid grid-cols-2 gap-3">
                    <button onclick="playPose('idle')" class="py-4 rounded-2xl bg-white/5 border border-white/10 text-[10px] font-bold tracking-widest hover:border-gold transition-all">IDLE POSE</button>
                    <button onclick="playPose('walk')" class="py-4 rounded-2xl bg-white/5 border border-white/10 text-[10px] font-bold tracking-widest hover:border-gold transition-all">WALK RUNWAY</button>
                </div>
            </div>

            <div class="mt-auto text-center pt-6 opacity-20">
                <p class="text-[8px] uppercase tracking-[4px]">GIA LUXE | ALTER PROJECT 2026</p>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, model, mixer, controls, clock = new THREE.Clock();
        let currentGender = 'female';
        const loader = new THREE.GLTFLoader();

        function init() {
            scene = new THREE.Scene();
            // Deep Greenish Gradient Background (Like your image)
            scene.background = new THREE.Color(0x051612);
            
            camera = new THREE.PerspectiveCamera(35, (window.innerWidth) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.4, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Orbit Controls (360 Degree rotation)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.minDistance = 2;
            controls.maxDistance = 6;
            controls.enablePan = false;
            controls.target.set(0, 1, 0);

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const spot = new THREE.DirectionalLight(0xffffff, 1);
            spot.position.set(5, 10, 5);
            scene.add(spot);

            // Floor Shadow Circle (Like image)
            const circleGeo = new THREE.CircleGeometry(0.6, 32);
            const circleMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 });
            const circle = new THREE.Mesh(circleGeo, circleMat);
            circle.rotation.x = -Math.PI / 2;
            circle.position.y = 0.01;
            scene.add(circle);

            loadModel('female');
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadModel(gender) {
            // Placeholder stable models
            const url = gender === 'female' 
                ? 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb' // Soldier as placeholder
                : 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

            loader.load(url, (gltf) => {
                if(model) scene.remove(model);
                model = gltf.scene;
                scene.add(model);
                mixer = new THREE.AnimationMixer(model);
                if(gltf.animations[0]) mixer.clipAction(gltf.animations[0]).play();
                document.getElementById('loader').style.display = 'none';
            }, (xhr) => {
                const p = (xhr.loaded / xhr.total * 100);
                document.getElementById('bar').style.width = p + '%';
            });
        }

        function switchGender(g) {
            currentGender = g;
            document.getElementById('btn-female').className = g === 'female' ? 'px-4 py-1 text-[9px] font-bold rounded-full bg-gold text-black' : 'px-4 py-1 text-[9px] font-bold rounded-full opacity-40';
            document.getElementById('btn-male').className = g === 'male' ? 'px-4 py-1 text-[9px] font-bold rounded-full bg-gold text-black' : 'px-4 py-1 text-[9px] font-bold rounded-full opacity-40';
            document.getElementById('loader').style.display = 'flex';
            loadModel(g);
        }

        function updateMorph(type, val) {
            if(!model) return;
            if(type === 'mass') {
                model.scale.x = model.scale.z = val;
                document.getElementById('mass-label').innerText = Math.round(val*100) + '%';
            } else {
                model.scale.y = val;
                document.getElementById('height-label').innerText = Math.round(175*val) + 'cm';
            }
        }

        function setSkin(color) {
            model.traverse(o => { if(o.isMesh) o.material.color.set(color); });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(mixer) mixer.update(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
