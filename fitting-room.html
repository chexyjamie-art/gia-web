<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | AI BRIDGE STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;900&display=swap');
        body { background: #010807; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Playfair Display', serif; }
        
        /* Layout Split */
        .studio-grid { display: grid; grid-template-columns: 300px 1fr 350px; height: 100vh; }

        /* Left: Anatomy Sidebar (CLO 3D Logic) */
        .anatomy-panel { background: rgba(0,0,0,0.5); border-right: 1px solid rgba(191,149,63,0.1); padding: 25px; }
        
        /* Center: AI Canvas */
        .canvas-area { position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #0a2d24 0%, #010807 100%); perspective: 1000px; }
        
        /* Right: Wardrobe (Kolors Style) */
        .wardrobe-panel { background: rgba(0,0,0,0.5); border-left: 1px solid rgba(191,149,63,0.1); padding: 25px; }

        .slider-custom { accent-color: #BF953F; width: 100%; height: 4px; }
        
        /* Scan Effect */
        #ai-scanner { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .line { width: 300px; height: 2px; background: #BF953F; box-shadow: 0 0 20px #BF953F; animation: scanMove 2s infinite ease-in-out; }
        @keyframes scanMove { 0%, 100% { transform: translateY(-100px); } 50% { transform: translateY(100px); } }
    </style>
</head>
<body>

    <div id="ai-scanner">
        <div class="line mb-6"></div>
        <h2 class="gold-text text-xl italic tracking-widest uppercase">Kolors AI: Synthesizing Fabric...</h2>
    </div>

    <div class="studio-grid">
        <aside class="anatomy-panel">
            <h3 class="text-[10px] font-black tracking-[4px] text-gold mb-10 uppercase">Anatomy Sliders</h3>
            <div class="space-y-8">
                <div>
                    <label class="text-[9px] opacity-40 uppercase block mb-2">Body Height</label>
                    <input type="range" class="slider-custom">
                </div>
                <div>
                    <label class="text-[9px] opacity-40 uppercase block mb-2">Waist Width</label>
                    <input type="range" class="slider-custom">
                </div>
                <div>
                    <label class="text-[9px] opacity-40 uppercase block mb-2">Fabric Tension</label>
                    <select class="w-full bg-white/5 border border-white/10 p-2 text-[10px] rounded text-gold">
                        <option>Soft Silk</option>
                        <option>Heavy Denim</option>
                    </select>
                </div>
            </div>
        </aside>

        <main class="canvas-area">
            <div class="absolute top-10 text-center">
                <h1 class="text-4xl gold-text italic">GIA LUXE</h1>
                <p class="text-[8px] tracking-[6px] opacity-30 uppercase">Professional AI Bridge</p>
            </div>

            <div id="upload-zone" onclick="document.getElementById('file-in').click()" class="border-2 border-dashed border-white/10 p-20 rounded-[50px] cursor-pointer hover:bg-white/5 transition text-center">
                <input type="file" id="file-in" class="hidden" onchange="loadUserPhoto(event)">
                <i data-lucide="user-plus" class="w-12 h-12 mx-auto mb-4 text-gold/30"></i>
                <p class="text-[10px] font-black tracking-widest uppercase opacity-40">Upload Human Image</p>
            </div>

            <div id="output-frame" class="hidden relative group h-[80vh] transition-transform duration-500" style="transform-style: preserve-3d;">
                <img id="ai-result" class="h-full rounded-3xl shadow-2xl">
            </div>
        </main>

        <aside class="wardrobe-panel">
            <h3 class="text-[10px] font-black tracking-[4px] text-gold mb-10 uppercase">Kolors Wardrobe</h3>
            <div class="space-y-4 overflow-y-auto h-[75vh] pr-2">
                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 cursor-pointer hover:border-gold/50" onclick="startAITryOn('saree_url')">
                    <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400" class="w-full h-32 object-cover rounded-xl mb-3">
                    <p class="text-[9px] font-bold uppercase text-center">Red Silk Saree</p>
                </div>
                </div>
        </aside>
    </div>

    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 text-[7px] tracking-[6px] opacity-20 uppercase pointer-events-none">
        © 2026 GIA LUXE | ALTER PROJECT | ALL AI MODELS ARE LICENSED & COMPLIANT
    </footer>

    <script>
        let userImageBase64 = "";

        function loadUserPhoto(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (f) => {
                userImageBase64 = f.target.result;
                document.getElementById('upload-zone').style.display = 'none';
                document.getElementById('output-frame').classList.remove('hidden');
                document.getElementById('ai-result').src = userImageBase64;
            };
            reader.readAsDataURL(file);
        }

        async function startAITryOn(garmentUrl) {
            if(!userImageBase64) return alert("Pehle apni photo upload karein!");
            
            document.getElementById('ai-scanner').style.display = 'flex';
            
            // Yahan hum fal.ai API ko call karenge
            // Abhi ke liye hum 3 second ka delay simulate kar rahe hain
            setTimeout(() => {
                document.getElementById('ai-scanner').style.display = 'none';
                // Result aane par photo update hogi
                alert("Logic: AI is generating the result using Kolors Diffusion...");
            }, 3000);
        }

        lucide.createIcons();
    </script>
</body>
</html>
