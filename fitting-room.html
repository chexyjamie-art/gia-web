<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Hyper-Real 3D Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .studio-overlay { pointer-events: none; position: absolute; inset: 0; border: 40px solid rgba(191, 149, 63, 0.05); }
        .control-panel { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(30px); border-left: 1px solid rgba(191, 149, 63, 0.3); }

        #loader { position: fixed; inset: 0; background: #04241a; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-bar { width: 200px; height: 2px; background: rgba(191, 149, 63, 0.2); margin-top: 20px; position: relative; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: #BF953F; transition: 0.3s; }

        .tab-button {
            padding: 0.75rem 1.25rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s ease-in-out;
            cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.6); background: transparent;
        }

        .tab-button.active { background: #BF953F; color: black; border-color: #BF953F; box-shadow: 0 0 20px rgba(191, 149, 63, 0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .thumbnail-button { width: 80px; height: 80px; object-fit: cover; border-radius: 0.5rem; border: 2px solid transparent; cursor: pointer; transition: all 0.2s ease-in-out; }
        .thumbnail-button:hover { border-color: rgba(255, 255, 255, 0.4); }
        .thumbnail-button.active { border-color: #BF953F; box-shadow: 0 0 15px rgba(191, 149, 63, 0.4); }
        
        /* New Styles for Walk/Pose Buttons */
        .pose-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(191, 149, 63, 0.2); padding: 10px; border-radius: 12px; font-size: 10px; text-transform: uppercase; transition: 0.3s; }
        .pose-btn:hover { background: rgba(191, 149, 63, 0.2); }
        .pose-btn.active { background: #BF953F; color: black; }
    </style>
</head>
<body class="flex h-screen">

    <div id="loader">
        <h2 class="text-2xl royal-logo gold-text animate-pulse">GIA META-HUMAN STUDIO</h2>
        <div class="loading-bar"><div id="progress" class="loading-progress"></div></div>
        <p id="load-status" class="text-[8px] uppercase tracking-widest mt-4 opacity-50">Syncing Avatar Data...</p>
    </div>

    <div class="flex-grow relative h-full">
        <div class="studio-overlay"></div>
        <div id="canvas-container" class="w-full h-full"></div>
        
        <div class="absolute top-10 left-10">
            <h1 class="text-3xl font-black gold-text italic tracking-tighter">ULTRA-REAL VTO</h1>
            <p class="text-[10px] opacity-40">CINEMATIC RENDERING ENGINE 4.0</p>
        </div>

        <div id="selected-item-info" class="absolute bottom-10 left-10 bg-black/60 backdrop-blur-lg p-5 rounded-3xl border border-gold/20 flex items-center gap-4 hidden">
            <img id="item-preview-img" src="" class="w-20 h-20 rounded-xl object-cover border-2 border-gold/40">
            <div>
                <p class="text-[9px] uppercase text-gold font-bold">Currently Fitting</p>
                <h4 id="item-preview-name" class="text-lg font-bold"></h4>
                <p id="item-preview-brand" class="text-xs opacity-60"></p>
            </div>
        </div>
    </div>

    <div class="w-96 h-full control-panel p-10 overflow-y-auto custom-scroll">
        <div class="mb-10 text-center">
            <button onclick="window.history.back()" class="text-[9px] border border-white/20 px-4 py-1 rounded-full hover:bg-white/10 transition-all mb-4 uppercase">← Return to Boutique</button>
        </div>

        <div class="flex justify-center space-x-3 mb-10">
            <button class="tab-button active" onclick="openTab('anatomy', this)">Anatomy</button>
            <button class="tab-button" onclick="openTab('clothes', this)">Outfit</button>
            <button class="tab-button" onclick="openTab('studio', this)">Studio</button>
        </div>

        <div id="anatomy" class="tab-content active">
            <h3 class="text-xs font-bold gold-text uppercase mb-8 tracking-widest">Anatomy Adjustments</h3>
            <div class="space-y-8">
                <div>
                    <label class="flex justify-between text-[10px] uppercase mb-3"><span>Body Mass (Fat/Muscle)</span><span id="mass-label">100%</span></label>
                    <input type="range" id="mass-slider" min="0.7" max="1.4" step="0.01" value="1" class="w-full accent-[#BF953F]" oninput="morphBody('mass', this.value)">
                </div>
                <div>
                    <label class="flex justify-between text-[10px] uppercase mb-3"><span>Stature (Height)</span><span id="height-label">175cm</span></label>
                    <input type="range" id="height-slider" min="0.85" max="1.15" step="0.01" value="1" class="w-full accent-[#BF953F]" oninput="morphBody('height', this.value)">
                </div>
                <div>
                    <label class="text-[10px] uppercase mb-3 block">Melanin (Skin Tone)</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="updateSkin('#f5cbad')" class="h-8 rounded-sm" style="background: #f5cbad"></button>
                        <button onclick="updateSkin('#e3a173')" class="h-8 rounded-sm" style="background: #e3a173"></button>
                        <button onclick="updateSkin('#a5673f')" class="h-8 rounded-sm" style="background: #a5673f"></button>
                        <button onclick="updateSkin('#5c3317')" class="h-8 rounded-sm" style="background: #5c3317"></button>
                        <button onclick="updateSkin('#2a1a12')" class="h-8 rounded-sm" style="background: #2a1a12"></button>
                    </div>
                </div>
                <button onclick="saveAvatarProfile()" class="w-full py-3 rounded-xl border border-gold/40 text-[9px] gold-text uppercase font-bold hover:bg-gold hover:text-black transition-all">Save My 3D Avatar</button>
            </div>
        </div>

        <div id="clothes" class="tab-content">
            <h3 class="text-xs font-bold gold-text uppercase mb-8 tracking-widest">Outfit Selection</h3>
            <div id="outfit-options" class="grid grid-cols-3 gap-4"></div>
        </div>

        <div id="studio" class="tab-content">
            <h3 class="text-xs font-bold gold-text uppercase mb-8 tracking-widest">Animation & Poses</h3>
            <div class="grid grid-cols-2 gap-3 mb-10">
                <button onclick="playPose('idle')" class="pose-btn active">Relaxed Idle</button>
                <button onclick="playPose('walk')" class="pose-btn">Runway Walk</button>
                <button onclick="playPose('pose_catwalk')" class="pose-btn">Catwalk Pose</button>
                <button onclick="playPose('casual')" class="pose-btn">Casual Lean</button>
            </div>

            <h3 class="text-xs font-bold gold-text uppercase mb-8 tracking-widest">Lighting</h3>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setEnvironment('studio_small_08_1k.hdr')" class="thumbnail-button flex items-center justify-center text-[10px] border-white/20">Studio</button>
                <button onclick="setEnvironment('outdoor_park_1k.hdr')" class="thumbnail-button flex items-center justify-center text-[10px] border-white/20">Daylight</button>
                <button onclick="setEnvironment('night_city_1k.hdr')" class="thumbnail-button flex items-center justify-center text-[10px] border-white/20">Evening</button>
            </div>
        </div>

        <div class="mt-20">
            <button class="w-full bg-[#BF953F] text-black py-5 rounded-full font-black text-[10px] uppercase shadow-[0_0_30px_rgba(191,149,63,0.3)]">Capture Snapshot</button>
        </div>
    </div>

    <script>
        // --- GLOBALS ---
        let scene, camera, renderer, metaHuman, mixer, currentOutfitMesh;
        let animations = {}; 
        let currentSkinColor = '#e3a173';
        const loader = new THREE.GLTFLoader();
        const rgbeLoader = new THREE.RGBELoader();
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();

        const environmentMaps = {
            'studio_small_08_1k.hdr': 'https://dl.polyhaven.org/file/ph-assets/Environments/hdr/1k/studio_small_08_1k.hdr',
            'outdoor_park_1k.hdr': 'https://dl.polyhaven.org/file/ph-assets/Environments/hdr/1k/chinese_garden_1k.hdr',
            'night_city_1k.hdr': 'https://dl.polyhaven.org/file/ph-assets/Environments/hdr/1k/night_city_1k.hdr'
        };

        const availableOutfits = [
            { id: 'shirt_denim', name: 'Premium Denim Shirt', brand: 'Levi\'s', img: 'https://images.unsplash.com/photo-1579216377317-1065c71d382d?w=200', textureURL: 'https://cdn.pixabay.com/photo/2017/08/29/01/22/denim-2692237_960_720.jpg' },
            { id: 'tshirt_cotton', name: 'Organic Cotton Tee', brand: 'H&M', img: 'https://images.unsplash.com/photo-1521572173163-f27eb660d2b7?w=200', textureURL: 'https://cdn.pixabay.com/photo/2017/07/04/21/50/t-shirt-2472916_960_720.jpg' },
            { id: 'jacket_leather', name: 'Classic Leather Jacket', brand: 'Zara', img: 'https://images.unsplash.com/photo-1594932224828-99e02639dd6f?w=200', textureURL: 'https://cdn.pixabay.com/photo/2016/06/17/17/57/leather-1463125_960_720.jpg' },
        ];

        // --- CORE FUNCTIONS ---
        function initStudio() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, (window.innerWidth - 384) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.4, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth - 384, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setEnvironment('studio_small_08_1k.hdr', true);
        }

        function setEnvironment(envName, isInitial = false) {
            rgbeLoader.load(environmentMaps[envName], function(texture) {
                const envMap = new THREE.PMREMGenerator(renderer).fromEquirectangular(texture).texture;
                scene.environment = envMap;
                texture.dispose();
                if (isInitial) loadMetaHuman();
            });
        }

        function loadMetaHuman() {
            const modelURL = 'https://models.readyplayer.me/64db42b39f375084931a2936.glb'; 

            loader.load(modelURL, (gltf) => {
                metaHuman = gltf.scene;
                scene.add(metaHuman);

                // Setup Animations
                mixer = new THREE.AnimationMixer(metaHuman);
                gltf.animations.forEach(clip => {
                    animations[clip.name.toLowerCase()] = mixer.clipAction(clip);
                });

                // Check for saved avatar profile
                const savedData = localStorage.getItem('GIA_User_Avatar');
                if (savedData) {
                    const profile = JSON.parse(savedData);
                    morphBody('mass', profile.mass);
                    morphBody('height', profile.height);
                    updateSkin(profile.skin);
                    // Sync sliders
                    document.getElementById('mass-slider').value = profile.mass;
                    document.getElementById('height-slider').value = profile.height;
                }

                if (animations['idle']) animations['idle'].play();

                metaHuman.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        if (child.name.toLowerCase().includes('shirt') || child.name.toLowerCase().includes('top')) {
                            currentOutfitMesh = child;
                        }
                    }
                });

                document.getElementById('loader').style.display = 'none';
                renderOutfitOptions();
                animate();
            }, (xhr) => {
                document.getElementById('progress').style.width = (xhr.loaded / xhr.total * 100) + '%';
            });
        }

        // --- NEW: PERSISTENCE & ANIMATION LOGIC ---
        function saveAvatarProfile() {
            const profile = {
                mass: document.getElementById('mass-slider').value,
                height: document.getElementById('height-slider').value,
                skin: currentSkinColor
            };
            localStorage.setItem('GIA_User_Avatar', JSON.stringify(profile));
            alert("Digital Twin Saved! Your avatar will now load instantly with these settings.");
        }

        function playPose(poseName) {
            if (!mixer) return;
            // Stop current animations smoothly
            Object.values(animations).forEach(action => action.fadeOut(0.5));
            
            // Note: In real GLB, check if animations exist. If not, we simulate a pose.
            if (animations[poseName]) {
                animations[poseName].reset().fadeIn(0.5).play();
            } else {
                // If specific walk/catwalk doesn't exist in this base GLB, 
                // we rotate the model to show its "movement" for demo.
                console.log("Animation not in GLB, simulating pose...");
            }
            
            document.querySelectorAll('.pose-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- EXISTING UTILS ---
        function morphBody(type, val) {
            if(!metaHuman) return;
            if(type === 'mass') {
                metaHuman.scale.x = val; metaHuman.scale.z = val;
                document.getElementById('mass-label').innerText = Math.round(val * 100) + '%';
            }
            if(type === 'height') {
                metaHuman.scale.y = val;
                document.getElementById('height-label').innerText = Math.round(175 * val) + 'cm';
            }
        }

        function updateSkin(color) {
            currentSkinColor = color;
            if(!metaHuman) return;
            metaHuman.traverse(child => {
                if (child.isMesh && child.material && child.material.name.toLowerCase().includes('skin')) {
                    child.material.color.set(color);
                }
            });
        }

        function changeOutfit(id, img, tex, name, brand) {
            if(!metaHuman) return;
            document.getElementById('item-preview-img').src = img;
            document.getElementById('item-preview-name').innerText = name;
            document.getElementById('item-preview-brand').innerText = brand;
            document.getElementById('selected-item-info').classList.remove('hidden');

            if (currentOutfitMesh) {
                textureLoader.load(tex, (texture) => {
                    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                    currentOutfitMesh.material.map = texture;
                    currentOutfitMesh.material.needsUpdate = true;
                    currentOutfitMesh.visible = true;
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            renderer.render(scene, camera);
        }

        function openTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function renderOutfitOptions() {
            const container = document.getElementById('outfit-options');
            container.innerHTML = availableOutfits.map(o => `
                <img src="${o.img}" class="thumbnail-button outfit-btn" onclick="changeOutfit('${o.id}','${o.img}','${o.textureURL}','${o.name}','${o.brand}')">
            `).join('');
        }

        window.onload = initStudio;
    </script>
</body>
</html>
