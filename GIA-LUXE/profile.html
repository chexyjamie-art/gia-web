<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GIA Profile</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Orbitron;
background:linear-gradient(135deg,#000,#0f0f0f);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:95%;
max-width:420px;
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:25px;
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(191,149,63,.2);
}

.title{
text-align:center;
font-size:22px;
margin-bottom:20px;
color:#BF953F;
}

label{
font-size:12px;
opacity:.7;
}

input{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:15px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.save{
background:linear-gradient(45deg,#BF953F,#FCF6BA);
color:#000;
}

.logout{
background:#ff3b3b;
color:#fff;
}

.bar{
width:100%;
height:8px;
background:#222;
border-radius:10px;
margin-top:15px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(45deg,#BF953F,#FCF6BA);
}
</style>
</head>

<body>

<div class="card">

<div class="title">GIA PROFILE</div>

<label>Name</label>
<input id="name">

<label>Phone</label>
<input id="phone">

<label>Email</label>
<input id="email">

<label>Address</label>
<input id="address">

<button class="save" onclick="saveProfile()">Save Profile</button>
<button class="logout" onclick="logout()">Logout</button>

<div class="bar">
<div id="progress" class="fill"></div>
</div>

</div>

<script>
/* SESSION CHECK */
if(localStorage.getItem("giaSession")!=="true"){
location.href="login.html"
}

/* ENCRYPTION */
function enc(d){return btoa(d)}
function dec(d){return atob(d)}

/* LOAD DATA */
function load(){

document.getElementById("name").value=
localStorage.getItem("giaUserName")||""

document.getElementById("phone").value=
localStorage.getItem("giaUserPhone")||""

document.getElementById("email").value=
dec(localStorage.getItem("giaUserEmail")||"")

document.getElementById("address").value=
dec(localStorage.getItem("giaUserAddress")||"")

updateBar()
}

load()

/* SAVE */
function saveProfile(){

localStorage.setItem("giaUserName",
document.getElementById("name").value)

localStorage.setItem("giaUserPhone",
document.getElementById("phone").value)

localStorage.setItem("giaUserEmail",
enc(document.getElementById("email").value))

localStorage.setItem("giaUserAddress",
enc(document.getElementById("address").value))

alert("Profile Saved ✓")
updateBar()
}

/* LOGOUT */
function logout(){
if(confirm("Logout?")){
localStorage.clear()
location.href="login.html"
}
}

/* PROGRESS BAR */
function updateBar(){
let s=0
if(localStorage.getItem("giaUserName"))s+=25
if(localStorage.getItem("giaUserPhone"))s+=25
if(localStorage.getItem("giaUserEmail"))s+=25
if(localStorage.getItem("giaUserAddress"))s+=25
document.getElementById("progress").style.width=s+"%"
}
</script>

</body>
</html>
