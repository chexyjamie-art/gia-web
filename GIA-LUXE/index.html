<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA LUXE | Visual AI Stylist</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
if(!localStorage.getItem("giaUserName")) location.href="login.html";
</script>

<style>
/* SAME CSS — NOTHING REMOVED */
body{
background:linear-gradient(135deg,#f0f9ff,#fff,#fff1f2);
font-family:'Inter',sans-serif;
margin:0;
overflow-x:hidden;
color:#1e293b;
}

.royal-logo{font-family:'Playfair Display',serif;font-weight:900;letter-spacing:.3em;text-transform:uppercase}
.gold-text{background:linear-gradient(to right,#0ea5e9,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.product-card{
background:rgba(255,255,255,.75);
backdrop-filter:blur(15px);
border-radius:2rem;
border:1px solid rgba(14,165,233,.1);
transition:.35s;
cursor:pointer;
position:relative;
}
.product-card:hover{transform:translateY(-8px);border-color:#f472b6}

.tryon-trigger-btn{
margin-top:10px;
background:#1e293b;
color:#fff;
padding:8px;
border-radius:12px;
font-size:9px;
font-weight:900;
letter-spacing:1px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
}
.tryon-trigger-btn:hover{background:#0ea5e9}

.mobile-nav{
display:flex;
position:fixed;
bottom:0;left:0;right:0;
background:#ffffffee;
backdrop-filter:blur(20px);
border-top:1px solid rgba(14,165,233,.1);
padding:1rem;
justify-content:space-around;
}
</style>
</head>

<body class="pb-24">

<header class="py-6 px-6 border-b bg-white/70 backdrop-blur sticky top-0 z-50">
<nav class="flex justify-between items-center max-w-7xl mx-auto">
<button onclick="filterType('offer')"><i data-lucide="percent" class="text-sky-500"></i></button>
<h1 class="royal-logo gold-text text-2xl cursor-pointer" onclick="location.reload()">GIA LUXE</h1>
<div class="flex items-center gap-3">
<span id="nav-user-name" class="text-[10px] font-bold uppercase text-sky-600"></span>
<img id="user-avatar" class="w-10 h-10 rounded-full border">
</div>
</nav>
</header>

<main class="max-w-7xl mx-auto px-6 py-12">

<h2 class="text-4xl royal-logo gold-text text-center mb-10 italic">
Welcome, <span id="hero-name">Stylist</span>
</h2>

<input id="ai-search-input"
placeholder="Search or ask GIA..."
class="w-full max-w-xl mx-auto block border rounded-full px-6 py-4 shadow mb-10">

<h3 id="section-title" class="text-[10px] font-bold tracking-[0.4em] uppercase text-sky-500 mb-10">
AI Picks
</h3>

<div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-6"></div>

</main>

<nav class="mobile-nav">
<button onclick="filterType('regular')" class="text-sky-500"><i data-lucide="home"></i></button>
<button onclick="filterType('combo')"><i data-lucide="package"></i></button>
<button onclick="filterType('offer')"><i data-lucide="percent"></i></button>
</nav>

<script>
lucide.createIcons();

/* PRODUCTS */
const products=[];
const types=["regular","combo","offer"];
const brands=["Amazon","Myntra","Ajio","Zara","Zudio"];

for(let i=1;i<=60;i++){
let t=types[Math.floor((i-1)/20)];
products.push({
id:i,
type:t,
name:`${t==="combo"?"Bundle":"Premium"} Item ${i}`,
price:(Math.random()*5000+999|0),
match:(8.5+Math.random()*1.4).toFixed(1),
img:`https://picsum.photos/seed/gia${i}/600`,
brand:brands[i%5],
wearable:i%2===0
});
}

/* INIT */
window.onload=()=>{
let name=localStorage.getItem("giaUserName")||"Stylist";
document.getElementById("hero-name").textContent=name;
document.getElementById("nav-user-name").textContent=name;
document.getElementById("user-avatar").src=
localStorage.getItem("giaUserDP")||
`https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;

render(products.filter(p=>p.type==="regular"));
};

/* RENDER */
function render(list){
const grid=document.getElementById("product-grid");

grid.innerHTML=list.map(p=>`
<div class="product-card p-4">

<div class="score-badge"
onclick="event.stopPropagation();alert('${p.match} GIA Score')">
${p.match}
</div>

<img src="${p.img}" class="rounded-2xl mb-4">

<h4 class="text-xs font-bold uppercase">${p.name}</h4>
<p class="font-black gold-text">₹${p.price}</p>

${p.wearable?`
<button class="tryon-trigger-btn"
onclick="event.stopPropagation();launchUniversalTryOn('${p.name}')">
Try On
</button>`:""}

</div>
`).join("");

lucide.createIcons();
}

/* FILTER */
function filterType(t){
document.getElementById("section-title").textContent=t.toUpperCase()+" PICKS";
render(products.filter(p=>p.type===t));
}

/* ================================
   UNIVERSAL TRYON CONNECT SYSTEM
================================ */

/* AUTO DETECT TYPE */
function detectWearType(name){

name=name.toLowerCase();

if(name.includes("shirt")||name.includes("t-shirt")||name.includes("top"))
return "topwear";

if(name.includes("pant")||name.includes("jean"))
return "bottomwear";

if(name.includes("shoe"))
return "footwear";

if(name.includes("glass"))
return "glasses";

if(name.includes("watch"))
return "watch";

return "topwear";
}

/* LAUNCH TRYON */
function launchUniversalTryOn(productName){

let selected=products.find(p=>p.name===productName);
if(!selected) return;

let tryProduct={
name:selected.name,
image:selected.img,
type:detectWearType(selected.name),
softness:6
};

localStorage.setItem("tryProduct",JSON.stringify(tryProduct));
localStorage.setItem("tryReminder",Date.now());

window.location.href="tryon.html";
}

/* SMART REMINDER */
(function(){

let lastTry=localStorage.getItem("tryReminder");
if(!lastTry) return;

let minutes=(Date.now()-lastTry)/60000;

if(minutes<15){

let reminder=document.createElement("div");
reminder.innerText="Continue your Try-On?";
reminder.style=`
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
background:#111;
color:#fff;
padding:12px 20px;
border-radius:40px;
z-index:9999;
cursor:pointer;
font-size:11px;
font-weight:900;
`;

reminder.onclick=()=>location.href="tryon.html";

document.body.appendChild(reminder);
}

})();
</script>

</body>
</html>
