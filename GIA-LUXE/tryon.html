<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GIA PRO STUDIO TRYON</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Inter;
background:linear-gradient(135deg,#dbeafe,#fff,#fce7f3);
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
}

header{
padding:18px;
font-weight:900;
letter-spacing:3px;
color:#0ea5e9;
}

.card{
background:#fff;
padding:25px;
border-radius:24px;
box-shadow:0 25px 60px rgba(0,0,0,.12);
width:95%;
max-width:720px;
text-align:center;
}

canvas,video{
width:100%;
border-radius:20px;
margin-top:15px;
background:#000;
}

button{
margin-top:12px;
padding:13px 24px;
border:none;
border-radius:30px;
font-weight:700;
cursor:pointer;
background:linear-gradient(to right,#0ea5e9,#ec4899);
color:white;
}

button:hover{transform:scale(1.04)}
</style>
</head>

<body>

<header>GIA PRO STUDIO TRY-ON</header>

<div class="card">

<input type="file" accept="image/*" onchange="uploadPhoto(event)">
<button onclick="startCamera()">Live Camera TryOn</button>

<video id="cam" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<div id="name"></div>

<button onclick="loadProduct()">Load Product</button>
<button onclick="download()">Save Look</button>

</div>

<script type="module">

/* ---------------- GLOBAL ---------------- */

const DPR=devicePixelRatio||1
let poseAI
let bodySource=null
let product=null
let running=false

/* ---------------- LOAD AI ---------------- */

async function initAI(){

const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest")
const r=await vision.FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
)

poseAI=await vision.PoseLandmarker.createFromOptions(r,{
baseOptions:{modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/lite/float16/latest/pose_landmarker_lite.task"
},
runningMode:"VIDEO"
})

}
await initAI()

/* ---------------- UTILS ---------------- */

const P=i=>({
x:landmarks[i].x*W,
y:landmarks[i].y*H
})

const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2})
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)

/* ---------------- UPLOAD PHOTO ---------------- */

window.uploadPhoto=async e=>{

const img=new Image()
img.src=URL.createObjectURL(e.target.files[0])
await new Promise(r=>img.onload=r)

bodySource=img
running=false
drawFrame(img)

}

/* ---------------- CAMERA ---------------- */

window.startCamera=async()=>{

const stream=await navigator.mediaDevices.getUserMedia({video:true})
const video=document.getElementById("cam")
video.srcObject=stream
video.style.display="block"

running=true
requestAnimationFrame(loop)

}

/* ---------------- DRAW FRAME ---------------- */

let ctx,W,H,landmarks

function drawFrame(src){

const canvas=document.getElementById("canvas")
ctx=canvas.getContext("2d")

W=src.videoWidth||src.width
H=src.videoHeight||src.height

canvas.width=W*DPR
canvas.height=H*DPR
ctx.setTransform(DPR,0,0,DPR,0,0)

ctx.drawImage(src,0,0,W,H)

}

/* ---------------- LOOP ---------------- */

async function loop(){

if(!running)return

const video=document.getElementById("cam")
drawFrame(video)

const res=await poseAI.detectForVideo(video,performance.now())
landmarks=res.landmarks?.[0]

if(product && landmarks)
renderProduct()

requestAnimationFrame(loop)

}

/* ---------------- SHADOW ---------------- */

function shadow(x,y,w,h){
const g=ctx.createRadialGradient(x+w/2,y+h/2,10,x+w/2,y+h/2,w)
g.addColorStop(0,"rgba(0,0,0,.35)")
g.addColorStop(1,"transparent")
ctx.fillStyle=g
ctx.fillRect(x,y,w,h)
}

/* ---------------- FABRIC ENGINE ---------------- */

function warp(img,x,y,w,h,bend){

ctx.save()
ctx.translate(x+w/2,y+h/2)

for(let i=0;i<12;i++){
const slice=h/12
ctx.drawImage(
img,
0,i*(img.height/12),
img.width,img.height/12,
-w/2,
-h/2+i*slice+Math.sin(i*.7)*bend,
w,
slice)
}

ctx.restore()
}

/* ---------------- PLACEMENT ---------------- */

function placement(type){

switch(type){

case "topwear":{
const a=P(11),b=P(12)
return{c:mid(a,b),w:dist(a,b)*1.8,rot:(b.y-a.y)}
}

case "bottomwear":{
const a=P(23),b=P(24)
return{c:mid(a,b),w:dist(a,b)*1.6,rot:0}
}

case "glasses":{
const a=P(2),b=P(5)
return{c:mid(a,b),w:dist(a,b)*1.7,rot:(b.y-a.y)}
}

case "watch":{
const w=P(15)
return{c:w,w:90,rot:0}
}

case "footwear":{
const a=P(31),b=P(32)
return{c:mid(a,b),w:dist(a,b)*2,rot:0}
}

}
}

/* ---------------- RENDER ---------------- */

function renderProduct(){

const img=new Image()
img.src=product.image

img.onload=()=>{

const p=placement(product.type)
if(!p)return

const w=p.w
const h=img.height*(w/img.width)
const x=p.c.x-w/2
const y=p.c.y-h/2

shadow(x,y,w,h)

ctx.save()
ctx.translate(p.c.x,p.c.y)
ctx.rotate(p.rot*.01)
ctx.globalCompositeOperation="multiply"

warp(img,-w/2,-h/2,w,h,product.softness||6)

ctx.restore()
ctx.globalCompositeOperation="source-over"
}
}

/* ---------------- LOAD PRODUCT ---------------- */

window.loadProduct=()=>{

const p=JSON.parse(localStorage.getItem("tryProduct"))
if(!p)return alert("No product found")

product=p
document.getElementById("name").innerText=p.name

if(!running && bodySource)
renderStatic()
}

function renderStatic(){

drawFrame(bodySource)

poseAI.detect(bodySource).then(r=>{
landmarks=r.landmarks?.[0]
renderProduct()
})

}

/* ---------------- DOWNLOAD ---------------- */

window.download=()=>{
const a=document.createElement("a")
a.download="gia-look.png"
a.href=document.getElementById("canvas").toDataURL()
a.click()
}

</script>
</body>
</html>
