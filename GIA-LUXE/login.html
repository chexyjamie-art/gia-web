<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#fff;
font-family:Inter;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
margin:0;
}

.card{
background:#fff;
padding:40px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
width:100%;
max-width:420px;
}

.input{
border:none;
border-bottom:2px solid #eee;
padding:14px;
width:100%;
text-align:center;
outline:none;
font-size:18px;
}

.btn{
background:linear-gradient(90deg,#0ea5e9,#f472b6);
color:white;
padding:16px;
width:100%;
border-radius:999px;
font-weight:bold;
letter-spacing:2px;
transition:.3s;
}

.btn:hover{transform:translateY(-2px)}
.otp{
width:55px;
height:60px;
border-radius:14px;
border:1px solid #eee;
text-align:center;
font-size:22px;
}
</style>
</head>

<body>

<div class="card">

<h1 class="text-center text-4xl font-bold mb-8 bg-gradient-to-r from-sky-400 to-pink-400 bg-clip-text text-transparent">
GIA
</h1>

<!-- STEP 1 -->
<div id="step1">

<input id="name" placeholder="Full Name" class="input mb-6">

<input id="phone" placeholder="Mobile Number" class="input mb-8">

<button id="sendBtn" onclick="sendOTP()" class="btn">JOIN</button>

</div>

<!-- STEP 2 -->
<div id="step2" class="hidden text-center">

<p class="text-xs tracking-widest mb-6 text-sky-400">ENTER OTP</p>

<div class="flex justify-center gap-3 mb-8">

<input class="otp" maxlength="1">
<input class="otp" maxlength="1">
<input class="otp" maxlength="1">
<input class="otp" maxlength="1">

</div>

<button onclick="verifyOTP()" class="btn">VERIFY</button>

<p onclick="location.reload()" class="mt-6 text-xs text-gray-400 cursor-pointer">RESET</p>

</div>

</div>

<script>

// SESSION AUTO LOGIN
const session=localStorage.getItem("giaSession")
const expiry=localStorage.getItem("giaSessionExpiry")

if(session==="active" && Date.now()<expiry){
location.href="index.html"
}

// OTP LOGIC
let generatedOTP=""

// VALIDATION
function validPhone(p){
return /^[6-9]\d{9}$/.test(p)
}

function sendOTP(){

const name=nameInput.value.trim()
const phone=phoneInput.value.trim()

if(name.length<3)
return alert("Enter valid name")

if(!validPhone(phone))
return alert("Enter valid 10 digit number")

// disable spam click
sendBtn.disabled=true
sendBtn.innerText="Sending..."

setTimeout(()=>{

generatedOTP=Math.floor(1000+Math.random()*9000).toString()
console.log("Demo OTP:",generatedOTP)

localStorage.setItem("giaTempName",name)
localStorage.setItem("giaTempPhone",phone)

step1.classList.add("hidden")
step2.classList.remove("hidden")

sendBtn.disabled=false
sendBtn.innerText="JOIN"

},800)

}

// OTP INPUT AUTO MOVE
document.querySelectorAll(".otp").forEach((box,i,arr)=>{

box.addEventListener("input",()=>{
if(box.value && arr[i+1]) arr[i+1].focus()
})

box.addEventListener("keydown",e=>{
if(e.key==="Backspace" && !box.value && arr[i-1])
arr[i-1].focus()
})

})

// VERIFY
function verifyOTP(){

let typed=""
document.querySelectorAll(".otp").forEach(i=>typed+=i.value)

if(typed!==generatedOTP)
return alert("Wrong OTP")

// SAVE USER
localStorage.setItem("giaUserName",localStorage.getItem("giaTempName"))
localStorage.setItem("giaUserPhone",localStorage.getItem("giaTempPhone"))

// SESSION
localStorage.setItem("giaSession","active")
localStorage.setItem("giaSessionExpiry",Date.now()+86400000)

// redirect
location.href="index.html"
}

// DOM refs
const nameInput=document.getElementById("name")
const phoneInput=document.getElementById("phone")
const sendBtn=document.getElementById("sendBtn")
const step1=document.getElementById("step1")
const step2=document.getElementById("step2")

</script>

</body>
</html>
