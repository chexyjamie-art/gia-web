<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Lifestyle Bundles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background: #021a12;
            font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .combo-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(191, 149, 63, 0.1); 
            transition: 0.4s;
        }
        .combo-card:hover { border-color: #BF953F; transform: scale(1.02); }
    </style>
</head>
<body>

    <header class="py-6 px-8 border-b border-[#BF953F]/20 sticky top-0 bg-[#021a12]/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <button onclick="history.back()" class="text-[#BF953F] flex items-center gap-2 text-xs font-bold tracking-widest uppercase">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <h1 class="text-xl royal-logo gold-text">GIA BUNDLES</h1>
            <div class="w-10"></div> </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <header class="mb-12">
            <h2 id="page-title" class="text-3xl royal-logo gold-text italic mb-2">Curated Vault</h2>
            <p class="text-white/40 text-sm">Bhai, GIA ne aapke style ke liye ye exclusive combos select kiye hain.</p>
        </header>

        <div id="bundles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            </div>
    </main>

    <script>
        // Fake Bundles Database
        const bundles = [
            {
                id: 1,
                tag: "Night Out",
                name: "The Emerald Elite",
                keyword: "shirt",
                items: [
                    { name: "Emerald Linen Shirt", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400" },
                    { name: "Silver Chrono Watch", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" },
                    { name: "Oud Intense Perfume", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400" }
                ],
                totalPrice: "7,999",
                discount: "15% Off"
            },
            {
                id: 2,
                tag: "Self Care",
                name: "Glow & Clear Kit",
                keyword: "beauty",
                items: [
                    { name: "Salicylic Face Wash", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400" },
                    { name: "Sunscreen SPF 50", img: "https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?w=400" }
                ],
                totalPrice: "1,249",
                discount: "10% Off"
            }
        ];

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('query')?.toLowerCase() || "";
            
            if(query) {
                document.getElementById('page-title').innerText = `Bundles for "${query}"`;
            }

            const filtered = query 
                ? bundles.filter(b => b.keyword.includes(query) || b.name.toLowerCase().includes(query))
                : bundles;

            renderBundles(filtered);
            lucide.createIcons();
        };

        function renderBundles(data) {
            const grid = document.getElementById('bundles-grid');
            if(data.length === 0) {
                grid.innerHTML = `<p class="text-white/20 italic">Bhai, is search ke liye koi bundle nahi mila. Try 'shirt' or 'beauty'.</p>`;
                return;
            }

            grid.innerHTML = data.map(b => `
                <div class="combo-card p-8 rounded-[2rem]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="text-[8px] gold-text font-black uppercase tracking-[0.3em]">${b.tag}</span>
                            <h3 class="text-xl font-bold mt-1">${b.name}</h3>
                        </div>
                        <span class="bg-green-500/10 text-green-500 text-[10px] font-bold px-3 py-1 rounded-full border border-green-500/20">${b.discount}</span>
                    </div>
                    
                    <div class="flex items-center gap-4 mb-8">
                        ${b.items.map((item, idx) => `
                            <div class="relative group">
                                <img src="${item.img}" class="w-20 h-20 object-cover rounded-xl border border-white/10">
                                <p class="text-[7px] text-white/40 mt-2 text-center w-20 truncate">${item.name}</p>
                            </div>
                            ${idx < b.items.length - 1 ? '<span class="text-white/20">+</span>' : ''}
                        `).join('')}
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-white/5">
                        <div>
                            <p class="text-[8px] text-white/30 uppercase tracking-widest">Bundle Price</p>
                            <p class="text-2xl font-black italic gold-text">₹${b.totalPrice}</p>
                        </div>
                        <button class="bg-[#BF953F] text-black px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-white transition-all">Buy Bundle</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
