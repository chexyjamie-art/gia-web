<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GIA – Smart AI Stylist</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="topbar">
  <div class="left">☰ Menu</div>

  <div class="logo">
    <img src="public/assets/logo.svg">
    <span>Smart AI Stylist</span>
  </div>

  <div class="right">
    <a href="profile.html">👤</a>
  </div>
</header>

<!-- ===== AI SEARCH SECTION ===== -->
<section class="search-section">

  <canvas id="waveCanvas"></canvas>

  <div class="search-box">
    <input
      id="aiSearch"
      type="text"
      placeholder="Ask AI: best watch under ₹10,000"
    >

    <div class="search-icons">
      <img src="public/assets/mic.svg" title="Voice Search">
      <img src="public/assets/camera.svg" title="Instant Camera">

      <!-- IMAGE SEARCH UPLOAD -->
      <label>
        <img src="public/assets/upload.svg" title="Upload Photo">
        <input type="file" hidden onchange="imageSearch(this.files[0])">
      </label>

    </div>
  </div>

</section>

<!-- ===== HEADLINE ===== -->
<section class="headline">
  <h1>Curated luxury for you</h1>
  <p>AI that tells you what to buy — and what not to.</p>
</section>

<!-- ===== CATEGORIES ===== -->
<nav class="categories">
  <span class="active" data-cat="all">All</span>
  <span data-cat="Watches">Watches</span>
  <span data-cat="Skincare">Skincare</span>
  <span data-cat="Electronics">Electronics</span>
  <span data-cat="Shoes">Shoes</span>
</nav>

<!-- ===== PRODUCTS ===== -->
<section class="products" id="products"></section>

<!-- ===== FOOTER ===== -->
<footer>
  <a href="terms.html">Terms</a> ·
  <a href="privacy.html">Privacy</a> ·
  <span>© GIA AI</span>
</footer>

<!-- JS FILES -->
<script src="app.js"></script>
<script src="image-search.js"></script>

</body>
</html>
