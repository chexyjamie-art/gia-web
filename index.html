<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIA – Smart AI Stylist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">GIA</div>
  <div class="tagline">Smart AI Stylist</div>
  <div class="search-box">
    <input type="text" placeholder="Search fashion, beauty, gadgets...">
    <div class="mic">🎤</div>
  </div>
  <div class="greeting" id="greeting">Good Morning, User! Aaj main aapke liye kis chiz me madad kar sakta hoon?</div>
</header>

<section class="hero">
  <h2>Curated luxury for you</h2>
  <p>Smart choices recommended by AI</p>
</section>

<section class="product-preview">
  <div class="cards">
    <!-- Placeholder products -->
    <div class="card">
      <img src="assets/images/product1.jpg" alt="Luxury Watch">
      <h4>Luxury Watch</h4>
      <div class="price">₹7,999</div>
      <a href="#" class="buy">Buy Now</a>
    </div>
    <div class="card">
      <img src="assets/images/product2.jpg" alt="Skincare Serum">
      <h4>Skincare Serum</h4>
      <div class="price">₹1,499</div>
      <a href="#" class="buy">Buy Now</a>
    </div>
    <div class="card">
      <img src="assets/images/product3.jpg" alt="Designer Shirt">
      <h4>Designer Shirt</h4>
      <div class="price">₹2,299</div>
      <a href="#" class="buy">Buy Now</a>
    </div>
  </div>
</section>

<footer>
  © 2026 GIA • Built with ❤️ in India
</footer>

<script src="js/main.js"></script>
</body>
</html>
