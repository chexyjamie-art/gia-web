<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GIA – AI Stylist</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="top-header">
  <div class="icon-btn">
    <!-- MENU -->
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </div>

  <div class="logo">GIA</div>

  <div class="right-icons">
    <!-- WISHLIST -->
    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>

    <!-- NOTIFICATION -->
    <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>

    <img class="profile" src="https://i.pravatar.cc/40" />
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Your personal <span>AI shopping stylist</span></h1>
  <p>Fashion • Beauty • Gadgets — honest, smart decisions</p>

  <div class="search-wrap">
    <input placeholder="Search outfits, skincare, gadgets…" />
    <button>Search</button>
  </div>

  <div class="tabs">
    <button class="active">Fashion</button>
    <button>Beauty</button>
    <button>Gadgets</button>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products">
  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
    <h3>Casual White Shirt</h3>
    <p>₹999 • Daily wear</p>
    <button>Buy Now</button>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9">
    <h3>Luxury Skincare Serum</h3>
    <p>₹1,499 • Brightening</p>
    <button>Buy Now</button>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
    <h3>Wireless Headphones</h3>
    <p>₹2,999 • Best sound</p>
    <button>Buy Now</button>
  </div>
</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
    <span>Home</span>
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Search</span>
  </div>

  <div class="nav-item ai">
    ✨
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21z"/></svg>
    <span>Wishlist</span>
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
    <span>Profile</span>
  </div>
</nav>

</body>
</html>
