<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        /* LOGIN CHECK LOGIC */
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.9), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh; overflow-x: hidden;
        }

        @keyframes giaSummon { 0% { opacity: 0; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes sectionSummon { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        .animate-summon-gia { animation: giaSummon 1.5s ease-out forwards; }
        .animate-summon-section { opacity: 0; animation: sectionSummon 1s ease-out 0.8s forwards; }

        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-icon { color: #BF953F; }

        .product-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); color: white; border-radius: 1.5rem; 
            transition: all 0.3s ease; border: 1px solid rgba(191, 149, 63, 0.1); cursor: pointer;
        }
        .product-card:hover { transform: translateY(-5px); border: 1px solid #BF953F; background: rgba(255, 255, 255, 0.06); }

        .sentiment-box { background: rgba(191, 149, 63, 0.05); border-left: 4px solid #BF953F; padding: 1.25rem; border-radius: 0 1rem 1rem 0; font-style: italic; color: #eee; }
        
        /* VOICE ANIMATION */
        .mic-active { color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        #analysis-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="animate-summon-gia">

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/30 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <button onclick="window.location.href='offers.html'" class="relative p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F] transition-all">
                <i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i>
            </button>
            <h1 class="text-2xl md:text-3xl font-serif italic tracking-widest gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <div class="flex items-center gap-3">
                <p class="text-[9px] uppercase tracking-widest gold-text font-bold hidden sm:block" id="header-user-name">Loading...</p>
                <div onclick="window.location.href='profile.html'" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 cursor-pointer">
                    <img id="user-avatar" src="" class="w-full h-full rounded-full object-cover">
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 md:px-8 py-12 animate-summon-section">
        <section class="text-center mb-24">
            <h2 class="text-4xl md:text-6xl font-serif italic gold-text mb-8 leading-tight">Welcome to the Vault, <br><span id="hero-user-name" class="font-bold">Style Enthusiast</span></h2>
            
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/40 rounded-full p-1.5 bg-black/40 backdrop-blur-xl">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Search Style, Beauty or Tech..." class="flex-grow bg-transparent text-white/90 text-sm py-3 px-4 outline-none">
                
                <div class="flex items-center gap-2 pr-2">
                    <button id="mic-btn" class="p-2.5 hover:bg-white/5 rounded-full transition-all" onclick="startVoiceSearch()">
                        <i data-lucide="mic" class="w-5 h-5 text-[#BF953F]"></i>
                    </button>
                    <button class="gold-text flex items-center gap-2 py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 hover:bg-white/10" onclick="alert('Camera Scan Active')">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="mb-20">
            <div class="flex justify-between items-end mb-10">
                <h3 class="text-xs font-bold tracking-[0.4em] uppercase text-[#BF953F]">AI Intelligence Grid</h3>
                <button onclick="logout()" class="text-[8px] uppercase tracking-widest text-red-500/60 hover:text-red-500">Exit Vault</button>
            </div>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8"></div>
        </section>
    </main>

    <div id="analysis-modal">
        <div class="bg-[#04241a] border border-[#BF953F]/30 max-w-2xl w-[92%] rounded-[2.5rem] p-8 relative overflow-y-auto max-h-[90vh]">
            <button onclick="closeAnalysis()" class="absolute top-8 right-8 text-white/30 hover:text-white"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="py-16 text-center border-t border-white/5">
        <h2 class="gold-text text-xl italic mb-6">GIA LUXE</h2>
        <p class="text-[9px] leading-relaxed max-w-md mx-auto px-6 text-white/30 italic">Disclaimer: GIA is an AI-powered affiliate platform. We earn commissions on qualifying purchases.</p>
    </footer>

    <script>
        lucide.createIcons();

        /* DATABASE: CATEGORY-WISE */
        const allDatabase = [
            { id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", score: 98, sentiment: "Bhai, pure linen hai, bindass le lo!", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400", styleTip: "Pair this with white trousers for an elite summer look." },
            { id: 101, category: 'beauty', name: "Salicylic Face Wash", price: "499", score: 95, sentiment: "Oily skin ke liye ye best hai.", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400", routine: "1. Cleanse with this. \n2. Apply Serum. \n3. Sunscreen is must!", before: "Use a makeup remover if needed.", after: "Apply a light moisturizer." },
            { id: 201, category: 'tech', name: "ANC Earbuds Pro", price: "4,499", score: 92, sentiment: "Bhai, noise cancellation next level hai.", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400", specs: "24h Battery, 10mm Drivers, IPX5", use: "Long press right bud to toggle ANC mode." }
        ];

        window.onload = function() {
            const savedName = localStorage.getItem('giaUserName');
            if(savedName) {
                document.getElementById('header-user-name').innerText = savedName;
                document.getElementById('hero-user-name').innerText = savedName;
                document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${savedName}`;
            }
            renderResults(allDatabase);
        };

        /* SEARCH LOGIC */
        document.getElementById('ai-search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allDatabase.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderResults(filtered);
        });

        function renderResults(results) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = results.map(p => `
                <div class="product-card p-6 relative group" onclick="openGiaAssistant(${p.id})">
                    <div class="absolute top-4 left-4 bg-black/80 text-[#BF953F] text-[8px] font-bold px-2 py-1 rounded border border-[#BF953F]/40 uppercase">${p.category}</div>
                    <img src="${p.img}" class="w-full h-52 object-cover mb-5 rounded-2xl">
                    <h4 class="text-sm font-bold text-white/90">${p.name}</h4>
                    <p class="text-xl font-black mt-2">₹${p.price}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        /* VOICE SEARCH */
        function startVoiceSearch() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            const micBtn = document.querySelector('#mic-btn i');
            
            recognition.onstart = () => micBtn.classList.add('mic-active');
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('ai-search-input').value = transcript;
                document.getElementById('ai-search-input').dispatchEvent(new Event('input'));
                micBtn.classList.remove('mic-active');
            };
            recognition.start();
        }

        /* AI ASSISTANT DIALOGUE */
        function openGiaAssistant(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('analysis-modal');
            const content = document.getElementById('modal-content');

            let aiQuestion = "";
            if(p.category === 'beauty') aiQuestion = "Bhai, kya aapko iska **Routine** aur **Use method** janna hai?";
            else if(p.category === 'tech') aiQuestion = "Bhai, iske **Specs** aur **Kaise use karein** bataun?";
            else aiQuestion = "Bhai, iska **Styling Tip** dekhna hai?";

            content.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <img src="${p.img}" class="w-full md:w-1/2 rounded-3xl border border-[#BF953F]/20 shadow-2xl">
                    <div class="flex-1">
                        <h2 class="text-3xl gold-text italic font-serif">${p.name}</h2>
                        <div class="sentiment-box my-6">"${p.sentiment}"</div>
                        
                        <div id="ai-chat-box" class="bg-black/30 p-6 rounded-2xl border border-white/5">
                            <p class="text-xs text-[#BF953F] font-bold mb-2">GIA Assistant:</p>
                            <p class="text-sm text-white/80 mb-6">${aiQuestion}</p>
                            <button onclick="askGia('detail', ${p.id})" class="bg-[#BF953F] text-black text-[10px] font-black px-6 py-3 rounded-full uppercase tracking-widest hover:scale-105 transition-all">Yes, Explain Me</button>
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function askGia(type, id) {
            const p = allDatabase.find(x => x.id === id);
            const chatBox = document.getElementById('ai-chat-box');
            
            let response = "";
            if(p.category === 'beauty') {
                response = `<p class="mb-4"><b>Before:</b> ${p.before}</p>
                            <p class="mb-4"><b>Routine:</b><br>${p.routine}</p>
                            <p><b>After:</b> ${p.after}</p>`;
            } else if(p.category === 'tech') {
                response = `<p class="mb-4"><b>Specs:</b> ${p.specs}</p>
                            <p><b>Pro Tip:</b> ${p.use}</p>`;
            } else {
                response = `<p><b>Styling Tip:</b> ${p.styleTip}</p>`;
            }

            chatBox.innerHTML = `
                <p class="text-xs text-[#BF953F] font-bold mb-4">GIA's Guide:</p>
                <div class="text-sm text-white/70 leading-relaxed">${response}</div>
                <button onclick="window.open('https://amazon.in')" class="mt-6 w-full border border-[#BF953F] text-[#BF953F] py-3 rounded-full text-[10px] font-black uppercase">Buy Product</button>
            `;
        }

        function closeAnalysis() { document.getElementById('analysis-modal').style.display = 'none'; }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
