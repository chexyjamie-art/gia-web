<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="menu">☰</div>

  <div class="header-right">
    <img src="https://i.pravatar.cc/40" class="profile">
    <span>Wishlist</span>
    <span>Notifications</span>
  </div>
</header>

<!-- CENTER AREA -->
<div class="center">

  <!-- LEFT WAVE -->
  <img src="wave.png" class="wave left">

  <!-- SEARCH BAR -->
  <div class="search-box">

    <!-- LEFT SEARCH ICON -->
    <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" class="search-icon">

    <!-- INPUT -->
    <input type="text" placeholder="Ask AI anything...">

    <!-- RIGHT ICONS -->
    <div class="right-icons">
      <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" title="Voice Search">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png" title="Image Search">
    </div>

  </div>

  <!-- RIGHT WAVE -->
  <img src="wave.png" class="wave right">

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

</body>
</html>
