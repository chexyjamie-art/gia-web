<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="menu-left">
    ☰ Menu
  </div>

  <div class="right">
    <span>Notifications</span>
    <span>Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile">
  </div>
</header>

<!-- CENTER -->
<div class="center">

  <!-- SEARCH BAR -->
  <div class="search-box">
  <input type="text" placeholder="Ask AI anything...">

  <!-- ATTACHMENT ICON -->
  <svg class="icon" viewBox="0 0 24 24">
    <path d="M16.5 6.5l-7.8 7.8a3 3 0 104.2 4.2l8.5-8.5a5 5 0 10-7.1-7.1L5.8 11.4" 
      stroke="black" stroke-width="1.5" fill="none"/>
  </svg>

  <!-- MIC ICON -->
  <svg class="icon" viewBox="0 0 24 24">
    <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" 
      stroke="black" stroke-width="1.5" fill="none"/>
    <path d="M19 11a7 7 0 01-14 0M12 19v3" 
      stroke="black" stroke-width="1.5" fill="none"/>
  </svg>
</div>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

</body>
</html>
