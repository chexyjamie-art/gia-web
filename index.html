<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // LOGIN PROTECTION
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* GRID: Mobile 2 Col | Web 5 Col */
        #product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 1024px) { #product-grid { grid-template-columns: repeat(5, 1fr); gap: 24px; } }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 1.5rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden;
        }

        /* NAVIGATION: Hide on Web, Show on Mobile */
        .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(4, 36, 26, 0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000; padding: 1rem; justify-content: space-around; }
        @media (min-width: 1024px) { .mobile-nav { display: none !important; } }

        /* SCORE MODAL (White Premium UI) */
        .score-card-white { background: white; border-radius: 2.5rem; color: #04241a; padding: 2rem; max-width: 420px; width: 95%; margin: auto; position: relative; }
        .gia-score-box { background: #f0fff4; border-radius: 2rem; padding: 1.5rem; text-align: center; border: 1px solid #dcfce7; }
        .checks-box { background: #f8fafc; border-radius: 2rem; padding: 1.5rem; border: 1px solid #f1f5f9; }
        .sentiment-black-box { background: #000; color: white; border-radius: 2rem; padding: 1.5rem; margin-top: 1.5rem; }

        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); overflow-y: auto; }
        
        .match-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 6px; border: 1px solid #BF953F; font-size: 8px; font-weight: 900; color: #BF953F; z-index: 10; cursor: pointer; }
        .try-on-btn { position: absolute; bottom: 85px; right: 8px; background: #BF953F; color: black; font-size: 7px; font-weight: 900; padding: 4px 8px; border-radius: 4px; z-index: 20; cursor: pointer; }
    </style>
</head>
<body class="pb-24 lg:pb-0"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 sticky top-0 z-[100] bg-[#04241a]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <button onclick="openOffers()" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i></button>
            <h1 class="text-2xl royal-logo gold-text cursor-pointer" onclick="location.reload()">GIA LUXE</h1>
            
            <div class="hidden lg:flex gap-8 text-[10px] font-bold uppercase tracking-widest items-center">
                <a href="#" onclick="location.reload()" class="gold-text">Home</a>
                <a href="#" onclick="openCombos()">Combos</a>
                <a href="#" onclick="openOffers()">Offers</a>
                <a href="profile.html" class="w-10 h-10 rounded-full border border-gold overflow-hidden block">
                    <img id="web-avatar" src="" class="w-full h-full object-cover">
                </a>
            </div>
            <a href="profile.html" class="lg:hidden w-10 h-10 rounded-full border border-gold overflow-hidden">
                <img id="mob-avatar" src="" class="w-full h-full object-cover">
            </a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="text-center mb-10">
            <h2 class="text-3xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Search Style, Skin, or Tech..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2 px-4 rounded-full text-[10px] font-bold bg-white/5 flex items-center gap-2 border border-gold/20 mr-1"><i data-lucide="camera" class="w-4 h-4"></i> Visual AI</button>
                <input type="file" id="image-upload" class="hidden">
            </div>
        </section>

        <h3 id="section-title" class="text-[9px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-8">AI Curated Picks</h3>
        <div id="product-grid"></div>
    </main>

    <div id="details-modal" onclick="if(event.target==this) closeModal()">
        <div id="modal-content" class="w-full flex justify-center py-10"></div>
    </div>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span></button>
        <button onclick="openCombos()" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span></button>
        <button onclick="openOffers()" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="percent" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Offers</span></button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span></button>
    </nav>

    <footer class="py-10 text-center border-t border-white/5">
        <p class="text-[8px] text-[#BF953F]/60 uppercase tracking-[0.3em] font-bold">© 2026 ALTER PROJECT | LEGAL DISCLAIMER: AI-Generated Advice.</p>
    </footer>

    <script>
        const allDatabase = [
            { id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", match: "9.1", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", brand: 'Amazon' },
            { id: 2, category: 'fashion', name: "Charcoal Chinos", price: "1,899", match: "8.5", img: "https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600", brand: 'Ajio' },
            { id: 3, category: 'tech', name: "Apple Watch S9", price: "41,999", match: "9.4", img: "https://images.unsplash.com/photo-1434494878577-86c23bcb06b9?w=600", brand: 'Reliance' },
            { id: 4, category: 'beauty', name: "Face Serum", price: "899", match: "9.0", img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=600", brand: 'Nykaa' },
            { id: 5, category: 'fashion', name: "Leather Boots", price: "3,499", match: "8.8", img: "https://images.unsplash.com/photo-1520639885833-92c51b3983e2?w=600", brand: 'Myntra' }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('hero-name').innerText = name;
            const dp = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            document.getElementById('web-avatar').src = dp;
            document.getElementById('mob-avatar').src = dp;
            renderProducts(allDatabase);
            lucide.createIcons();
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card" onclick="openProductPage(${p.id})">
                    <div class="match-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match} GIA</div>
                    ${p.category === 'fashion' ? `<div class="try-on-btn">TRY ON</div>` : ''}
                    <img src="${p.img}" class="w-full h-44 object-cover">
                    <div class="p-3">
                        <p class="text-[7px] text-white/30 uppercase font-bold">${p.brand}</p>
                        <h4 class="text-[10px] font-bold truncate">${p.name}</h4>
                        <p class="gold-text font-black text-xs mt-1">₹${p.price}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // [SCORE PAGE] - SAME AS SCREENSHOT
        function openScorePage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="score-card-white shadow-2xl animate-in fade-in zoom-in duration-300">
                    <div class="flex justify-between items-center mb-6">
                        <span class="bg-black text-white text-[7px] px-3 py-1.5 rounded-full font-black uppercase tracking-tighter">Verified by GIA AI • <span class="text-green-400">Live Analysis</span></span>
                        <button onclick="closeModal()" class="text-black/20"><i data-lucide="x"></i></button>
                    </div>
                    
                    <h2 class="text-4xl royal-logo italic text-black mb-8 leading-tight">${p.name}</h2>

                    <div class="border border-blue-50 rounded-[2rem] p-6 mb-6 bg-blue-50/20">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-[10px] font-black text-blue-900 uppercase">Price Analysis</span>
                            <div class="flex gap-2 text-[8px] font-bold">
                                <span class="text-blue-600 bg-white px-3 py-1 rounded-md shadow-sm border border-blue-50">Days</span>
                                <span class="text-gray-400 px-2 py-1">Months</span>
                            </div>
                        </div>
                        <div class="flex items-end gap-3 h-24 mb-6">
                            <div class="flex-grow bg-blue-100 rounded-xl h-2/3"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-full"></div>
                            <div class="flex-grow bg-blue-500 rounded-xl h-1/2"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-3/4"></div>
                        </div>
                        <div class="flex justify-between">
                            <div><p class="text-[7px] text-gray-400 uppercase font-bold mb-1">Current Status</p><p class="text-[10px] font-black text-green-600">Lowest Price in 30D</p></div>
                            <div class="text-right"><p class="text-[7px] text-gray-400 uppercase font-bold mb-1">Predicted Trend</p><p class="text-[10px] font-black text-blue-800">Stable for 2 Weeks</p></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="gia-score-box">
                            <p class="text-[8px] font-black text-green-800 uppercase mb-2">GIA Score</p>
                            <p class="text-4xl font-black text-green-700 mb-1">${p.match}</p>
                            <p class="text-[8px] font-bold text-green-600">High Trust Factor</p>
                        </div>
                        <div class="checks-box">
                            <p class="text-[8px] font-black text-gray-500 uppercase mb-3">Checks Passed</p>
                            <div class="space-y-2 text-[9px] font-bold text-gray-700">
                                <div class="flex items-center gap-2"><i data-lucide="shield-check" class="w-3 h-3 text-blue-500"></i> Auth. Seller</div>
                                <div class="flex items-center gap-2"><i data-lucide="trending-down" class="w-3 h-3 text-red-400"></i> No Price Hikes</div>
                                <div class="flex items-center gap-2"><i data-lucide="bot" class="w-3 h-3 text-purple-500"></i> Fake Review Filter</div>
                            </div>
                        </div>
                    </div>

                    <div class="sentiment-black-box">
                        <p class="text-[8px] text-gray-400 font-bold uppercase mb-3 tracking-widest">GIA Intelligence Sentiment:</p>
                        <p class="text-[11px] leading-relaxed italic text-gray-200">
                            "Bhai, ye product abhi buying range mein hai. Seller ki history kaafi clean hai aur price drop ekdum real hai."
                        </p>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function openProductPage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="bg-[#04241a] rounded-[3rem] overflow-hidden border border-white/10 w-full max-w-4xl m-4">
                    <div class="grid grid-cols-1 md:grid-cols-2">
                        <img src="${p.img}" class="w-full h-full object-cover aspect-square">
                        <div class="p-10 flex flex-col justify-center">
                            <button onclick="closeModal()" class="self-end text-white/20 mb-4"><i data-lucide="x"></i></button>
                            <h2 class="text-4xl royal-logo gold-text mb-4 italic">${p.name}</h2>
                            <p class="text-2xl font-black mb-8">₹${p.price}</p>
                            <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-5 rounded-2xl font-black uppercase text-xs">Purchase Now</button>
                        </div>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('details-modal').style.display = 'none'; }
        function openCombos() { document.getElementById('section-title').innerText = "Flash Match Combos"; renderProducts(allDatabase); }
        function openOffers() { document.getElementById('section-title').innerText = "Hot Deals & Offers"; renderProducts(allDatabase.filter(p => p.id % 2 === 0)); }
    </script>
</body>
</html>
