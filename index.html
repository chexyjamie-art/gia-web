<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Emerald Marble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* THE WALL: Emerald Marble Background */
        body { 
            background: 
                linear-gradient(rgba(10, 20, 15, 0.85), rgba(10, 20, 15, 0.95)), /* Dark Overlay */
                url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80'); /* Real Green Marble Texture */
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: white;
            min-h-screen;
        }

        /* GOLD BRUSH STROKES (Like the photo) */
        .gold-leaf {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(191, 149, 63, 0.2) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .brush-right { top: 10%; right: -100px; transform: rotate(-15deg); filter: blur(40px); }
        .brush-left { bottom: 10%; left: -100px; transform: rotate(20deg); filter: blur(50px); }

        .gold-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* SHARP LUXURY CARDS */
        .marble-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(191, 149, 63, 0.3);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .marble-card:hover {
            background: rgba(191, 149, 63, 0.05);
            border-color: #BF953F;
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .search-container {
            border-bottom: 1px solid rgba(191, 149, 63, 0.4);
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="gold-leaf brush-right"></div>
    <div class="gold-leaf brush-left"></div>

    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="text-3xl font-serif italic tracking-widest gold-text">GIA LUXE</h1>
        <div class="flex items-center gap-6">
            <i data-lucide="camera" class="w-5 h-5 text-[#BF953F] cursor-pointer"></i>
            <div onclick="window.location.href='profile.html'" class="w-12 h-12 border border-[#BF953F] p-1 rounded-full cursor-pointer">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" class="rounded-full bg-black/20">
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-10">
        
        <div class="max-w-2xl mx-auto mb-20">
            <div class="search-container flex items-center p-4">
                <i data-lucide="search" class="text-[#BF953F] mr-4"></i>
                <input type="text" placeholder="Explore Heritage or ask GIA..." class="bg-transparent w-full outline-none text-xs uppercase tracking-[0.2em] text-white/70">
                <i data-lucide="mic" class="text-[#BF953F] ml-4"></i>
            </div>
        </div>

        <h2 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F]/60 mb-10">Handpicked for You</h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-20">
            <div class="marble-card p-6 relative group">
                <div class="absolute top-4 right-4 text-[10px] gold-text font-bold">9.4</div>
                <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=300" class="w-full h-48 object-contain mb-4 group-hover:scale-110 transition-transform duration-500">
                <h3 class="text-xs uppercase tracking-widest text-white/80">Emerald Linen</h3>
                <p class="text-sm font-bold gold-text mt-2">₹2,499</p>
            </div>

            <div class="marble-card p-6 relative group">
                <div class="absolute top-4 right-4 text-[10px] gold-text font-bold">9.8</div>
                <img src="https://images.unsplash.com/photo-1598033129183-c4f50c7176c8?w=300" class="w-full h-48 object-contain mb-4 group-hover:scale-110 transition-transform duration-500">
                <h3 class="text-xs uppercase tracking-widest text-white/80">Jet Black Suit</h3>
                <p class="text-sm font-bold gold-text mt-2">₹8,899</p>
            </div>
        </div>

        <div class="marble-card p-10 flex flex-col md:flex-row items-center gap-10 mb-20">
            <div class="flex gap-4">
                <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=150" class="w-24 shadow-2xl">
                <img src="https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=150" class="w-24 shadow-2xl">
            </div>
            <div class="flex-1">
                <h3 class="text-2xl font-serif italic gold-text">GIA Combo</h3>
                <p class="text-[10px] text-white/40 uppercase tracking-widest mt-2">Bundle Price: ₹4,299</p>
            </div>
            <button class="bg-[#BF953F] text-black px-10 py-4 text-[10px] font-black uppercase tracking-widest hover:bg-white transition-colors">Buy Set</button>
        </div>

        <footer class="py-10 text-center border-t border-white/5">
            <p class="text-[8px] text-white/20 uppercase tracking-[0.4em]">GIA AI Stylist • Affiliate Amazon / Myntra</p>
            <p class="text-[8px] text-white/10 mt-4 leading-relaxed">
                Legal: This site is an affiliate platform. Purchases are fulfilled by third-party retailers.
            </p>
        </footer>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
