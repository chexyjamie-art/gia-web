<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="menu-left">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>

</header>

<!-- CENTER AREA -->
<div class="center">

  <!-- LEFT WAVE -->
  <img src="wave.png" class="wave">

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Ask AI anything...">

    <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png"
         class="mic"
         onclick="startVoiceSearch()">

    <input type="file" id="imageInput" hidden onchange="imageSearch(event)">
  </div>

  <!-- RIGHT WAVE -->
  <img src="wave.png" class="wave">

</div>

<!-- AI RESPONSE -->
<div id="aiResponse" class="ai-box"></div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script src="app.js"></script>

</body>
</html>
