<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 2rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden; height: auto; display: flex; flex-direction: column; cursor: pointer;
        }
        .product-card:hover { transform: translateY(-10px); border: 1px solid #BF953F; box-shadow: 0 0 30px rgba(191, 149, 63, 0.2); }

        .score-badge {
            position: absolute; top: 15px; left: 15px;
            background: linear-gradient(45deg, #BF953F, #FCF6BA);
            color: black; font-weight: 900; padding: 4px 10px;
            border-radius: 10px; font-size: 10px; z-index: 20;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }

        /* NEW SCORE FILTER UI - WHITE PREMIUM */
        .score-card-white { background: white; border-radius: 2.5rem; color: #04241a; padding: 2rem; max-width: 420px; width: 95%; margin: auto; position: relative; }
        .gia-score-box { background: #f0fff4; border-radius: 2rem; padding: 1.5rem; text-align: center; border: 1px solid #dcfce7; }
        .checks-box { background: #f8fafc; border-radius: 2rem; padding: 1.5rem; border: 1px solid #f1f5f9; }
        .sentiment-black-box { background: #000; color: white; border-radius: 2rem; padding: 1.5rem; margin-top: 1.5rem; }

        .stylist-lens-box { border-left: 3px solid #BF953F; background: rgba(191, 149, 63, 0.08); border-radius: 0 1.5rem 1.5rem 0; padding: 1.5rem; font-style: italic; }
        .gia-insight-panel { background: rgba(191, 149, 63, 0.05); border: 1px dashed rgba(191, 149, 63, 0.3); border-radius: 1.5rem; animation: fadeIn 0.8s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); z-index: 2000; display: none; overflow-y: auto; backdrop-filter: blur(25px); }
        #score-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }

        /* NAVIGATION: Mobile Only */
        .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000; padding: 1rem; justify-content: space-around; }
        @media (min-width: 1024px) { .mobile-nav { display: none !important; } }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100] bg-[#04241a]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="offers.html" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i></a>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <div class="flex items-center gap-3">
                <p id="header-user-name" class="text-[9px] font-bold gold-text tracking-widest uppercase hidden sm:block">Stylist</p>
                <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden"><img id="user-avatar" src="" class="w-full h-full rounded-full object-cover"></a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center mb-10">
            <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-6">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Bhai, kya dhund rahe ho?" class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5 hover:bg-white/5 rounded-full"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i> <span class="hidden sm:inline">Visual AI</span></button>
                <input type="file" id="image-upload" class="hidden">
            </div>

            <div id="gia-ai-box" class="max-w-2xl mx-auto gia-insight-panel p-6 text-left hidden">
                <p id="gia-ai-text" class="text-sm italic text-white/80 leading-relaxed font-light"></p>
            </div>
        </section>

        <section class="mb-20">
            <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Curated Picks</h3>
            <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8"></div>
        </section>
    </main>

    <nav class="mobile-nav">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span></button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span></button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span></button>
    </nav>

    <div id="score-modal" onclick="if(event.target==this) closeScore()">
        <div id="score-modal-content" class="w-full flex justify-center py-10"></div>
    </div>

    <div id="details-modal">
        <div id="modal-content" class="max-w-6xl mx-auto px-6 py-10"></div>
    </div>

    <footer class="py-16 text-center border-t border-white/5">
        <p class="text-[8px] text-[#BF953F]/60 uppercase tracking-[0.3em] font-bold">© 2026 ALTER PROJECT | LEGAL DISCLAIMER: AI-Generated Advice. Verified by GIA.</p>
    </footer>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI"; 
        
        const allDatabase = [
            { id: 1, brand: 'Amazon', category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", match: "9.1", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", sentiment: "Summer parties ke liye best royal choice.", material: "100% Irish Linen", colors: "Emerald, White, Navy" },
            { id: 101, brand: 'Myntra', category: 'beauty', name: "Salicylic Face Wash", price: "499", match: "8.5", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600", sentiment: "Pimples ke liye sabse effective cleanser.", material: "2% Salicylic Acid", colors: "Clear Gel" },
            { id: 2, brand: 'Ajio', category: 'fashion', name: "Charcoal Chinos", price: "1,899", match: "9.4", img: "https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600", sentiment: "Durable aur comfortable chinos.", material: "Stretch Cotton Twill", colors: "Charcoal, Khaki, Black" }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('header-user-name').innerText = name;
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
            lucide.createIcons();
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-4" onclick="openDetails(${p.id})">
                    <div class="score-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match} GIA</div>
                    <img src="${p.img}" class="w-full h-44 object-cover rounded-2xl mb-4">
                    <h4 class="text-[10px] font-bold text-white/80 uppercase tracking-widest truncate">${p.name}</h4>
                    <div class="flex justify-between items-center mt-2">
                        <p class="text-xs font-black gold-text">₹${p.price}</p>
                        <span class="text-[7px] text-white/20 uppercase font-bold">${p.brand}</span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- NEW: SCORE FILTER UI AS REQUESTED ---
        function openScorePage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('score-modal');
            document.getElementById('score-modal-content').innerHTML = `
                <div class="score-card-white shadow-2xl animate-in fade-in zoom-in duration-300">
                    <div class="flex justify-between items-center mb-6">
                        <span class="bg-black text-white text-[7px] px-3 py-1.5 rounded-full font-black uppercase tracking-tighter">Verified by GIA AI • <span class="text-green-400">Live Analysis</span></span>
                        <button onclick="closeScore()" class="text-black/20"><i data-lucide="x"></i></button>
                    </div>
                    
                    <h2 class="text-4xl royal-logo italic text-black mb-8 leading-tight">${p.name}</h2>

                    <div class="border border-blue-50 rounded-[2rem] p-6 mb-6 bg-blue-50/20">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-[10px] font-black text-blue-900 uppercase">Price Analysis</span>
                            <span class="text-[8px] font-bold text-blue-600 bg-white px-3 py-1 rounded-md border border-blue-50">30 DAYS</span>
                        </div>
                        <div class="flex items-end gap-3 h-20 mb-6 px-2">
                            <div class="flex-grow bg-blue-100 rounded-xl h-2/3"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-full"></div>
                            <div class="flex-grow bg-blue-500 rounded-xl h-1/2"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-3/4"></div>
                        </div>
                        <div class="flex justify-between text-[9px] font-black">
                            <span class="text-green-600">Lowest Price Point</span>
                            <span class="text-blue-800">Stable Trend</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="gia-score-box">
                            <p class="text-[8px] font-black text-green-800 uppercase mb-2">GIA Score</p>
                            <p class="text-4xl font-black text-green-700 mb-1">${p.match}</p>
                            <p class="text-[8px] font-bold text-green-600">High Trust</p>
                        </div>
                        <div class="checks-box">
                            <div class="space-y-2 text-[9px] font-bold text-gray-700">
                                <div class="flex items-center gap-2"><i data-lucide="shield-check" class="w-3 h-3 text-blue-500"></i> Auth. Seller</div>
                                <div class="flex items-center gap-2"><i data-lucide="trending-down" class="w-3 h-3 text-red-400"></i> No Price Hike</div>
                                <div class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-purple-500"></i> Real Reviews</div>
                            </div>
                        </div>
                    </div>

                    <div class="sentiment-black-box">
                        <p class="text-[8px] text-gray-400 font-bold uppercase mb-2 tracking-widest">GIA Intelligence:</p>
                        <p class="text-[11px] leading-relaxed italic text-gray-200">
                            "Bhai, ye abhi buying zone mein hai. GIA ne verify kiya hai ki reviews legit hain aur quality top-notch hai."
                        </p>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <img src="${p.img}" class="w-full aspect-square object-cover rounded-[3rem]">
                    <div class="flex flex-col justify-center">
                        <button onclick="closeDetails()" class="self-end text-white/20 mb-4"><i data-lucide="x"></i></button>
                        <h2 class="text-5xl royal-logo gold-text mb-6">${p.name}</h2>
                        <p class="text-3xl font-black mb-10 italic">₹${p.price}</p>
                        <div class="stylist-lens-box mb-10 text-sm">"${p.sentiment}"</div>
                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-6 rounded-[2rem] font-black uppercase text-xs">Buy Now on ${p.brand}</button>
                    </div>
                </div>`;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }
        function closeScore() { document.getElementById('score-modal').style.display = 'none'; }

        async function askGiaAI(query) {
            const aiBox = document.getElementById('gia-ai-box');
            const aiText = document.getElementById('gia-ai-text');
            aiBox.classList.remove('hidden');
            aiText.innerText = "GIA soch rahi hai...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }] })
                });
                const data = await response.json();
                aiText.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { aiText.innerText = "Error loading AI."; }
        }

        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => {
                const t = e.results[0][0].transcript;
                document.getElementById('ai-search-input').value = t;
                askGiaAI(t);
            };
            rec.start();
        }
    </script>
</body>
</html>
