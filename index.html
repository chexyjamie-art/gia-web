<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<!-- Google Premium Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  align-items: center;
}

.menu-left {
  font-size: 16px;
  cursor: pointer;
}

.right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.profile {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  cursor: pointer;
}

/* CENTER AREA */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* SEARCH BAR */
.search-box {
  width: 90%;
  max-width: 550px;
  border: 1px solid #ddd;
  border-radius: 30px;
  padding: 14px 18px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.search-box input {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
}

/* PREMIUM TEXT */
.center h1 {
  margin-top: 30px;
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 600;
}

.center p {
  color: #666;
  margin-top: 5px;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 15px;
  font-size: 14px;
  color: gray;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="menu-left">
    ☰ Menu
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>

</header>

<!-- CENTER -->
<div class="center">

  <div class="search-box">
    <input type="text" placeholder="Ask AI anything...">
  </div>

  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script>
function openProfile(){
  window.location.href = "profile.html";
}

function goWishlist(){
  alert("Wishlist page coming next");
}
</script>

</body>
</html>
