<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background: #04241a; font-family: 'Inter', sans-serif; color: white; min-height: 100vh; overflow-x: hidden; }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.1em; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Mobile Grid: 2 Col | Desktop: 4-5 Col */
        #product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; }
        @media (min-width: 1024px) { #product-grid { grid-template-columns: repeat(5, 1fr); gap: 25px; } }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); border-radius: 1.5rem; 
            border: 1px solid rgba(191, 149, 63, 0.1); position: relative; overflow: hidden;
        }

        /* Try On Label on Card */
        .try-on-btn {
            position: absolute; bottom: 85px; right: 10px;
            background: #BF953F; color: black; font-size: 8px;
            font-weight: 900; padding: 4px 10px; border-radius: 6px;
            text-transform: uppercase; z-index: 10; cursor: pointer;
        }

        /* Score Badge */
        .score-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.6); backdrop-blur: 5px; color: #BF953F; 
            font-weight: 900; padding: 4px 8px; border-radius: 8px; font-size: 9px; 
            border: 1px solid #BF953F/30; z-index: 10;
        }

        /* Navigation Visibility Control */
        .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: #04241a; border-top: 1px solid rgba(191,149,63,0.2); z-index: 1000; padding: 12px; justify-content: space-around; }
        @media (min-width: 1024px) { .mobile-nav { display: none; } }

        /* Modal Screens */
        .full-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; overflow-y: auto; padding-bottom: 80px; }

        /* Screenshot Accurate Score UI */
        .gia-score-card { background: white; border-radius: 3rem; color: #04241a; padding: 2.5rem; max-width: 500px; margin: auto; }
        .bar-chart { display: flex; align-items: end; gap: 8px; height: 100px; }
        .bar { flex: 1; border-radius: 4px; background: #eef2ff; }
        .bar.active { background: #4f46e5; }
    </style>
</head>
<body class="pb-24 lg:pb-0"> 

    <header class="py-6 px-4 border-b border-white/5 sticky top-0 bg-[#04241a] z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl royal-logo gold-text">GIA LUXE</h1>
            <div class="hidden lg:flex gap-8 text-[10px] font-bold uppercase tracking-widest">
                <a href="#" onclick="location.reload()" class="gold-text">Home</a>
                <a href="#" onclick="openCombos()">Combos</a>
                <a href="#">Profile</a>
            </div>
            <div class="w-8 h-8 rounded-full border border-gold overflow-hidden"><img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul"></div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto py-8">
        <div class="max-w-xl mx-auto px-4 mb-10">
            <div class="relative flex items-center bg-white/5 border border-white/10 rounded-full px-5 py-3">
                <i data-lucide="search" class="w-4 h-4 text-white/30"></i>
                <input type="text" id="ai-search" placeholder="Ask something to GIA..." class="flex-grow bg-transparent text-sm px-4 outline-none">
                <i data-lucide="mic" class="w-4 h-4 text-[#BF953F]"></i>
            </div>
        </div>
        <div id="product-grid"></div>
    </main>

    <div id="score-modal" class="full-modal flex items-center justify-center p-4">
        <div id="score-content" class="w-full"></div>
    </div>

    <div id="tryon-modal" class="full-modal p-4">
        <div class="max-w-md mx-auto text-center pt-10">
            <button onclick="closeModals()" class="float-right mb-4"><i data-lucide="x"></i></button>
            <h2 class="text-xl gold-text royal-logo mb-8">Virtual Studio</h2>
            <div id="studio-box" class="aspect-[3/4] bg-black border-2 border-dashed border-white/10 rounded-[2.5rem] flex flex-col items-center justify-center p-6 mb-6">
                <i data-lucide="camera" class="w-12 h-12 text-white/5 mb-4"></i>
                <p class="text-[10px] text-white/40">Upload full photo to start Try-On</p>
            </div>
            <input type="file" id="studio-input" class="hidden" onchange="runTryOnAI()">
            <button onclick="document.getElementById('studio-input').click()" class="w-full bg-[#BF953F] text-black py-4 rounded-2xl font-black text-xs uppercase">Upload Photo</button>
        </div>
    </div>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-black">HOME</span></button>
        <button onclick="openCombos()" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-black">COMBOS</span></button>
        <button class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-black">SEARCH</span></button>
        <button class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-black">PROFILE</span></button>
    </nav>

    <script>
        // Database with 10 Products for Structure Test
        const db = [
            { id: 1, cat: 'fashion', name: "Emerald Linen Shirt", price: "2,499", brand: "Amazon", score: "9.4", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600" },
            { id: 2, cat: 'tech', name: "Apple Watch S9", price: "41,900", brand: "Apple", score: "9.1", img: "https://images.unsplash.com/photo-1434493907317-a46b53b81882?w=600" },
            { id: 3, cat: 'fashion', name: "Charcoal Chinos", price: "1,899", brand: "Ajio", score: "8.7", img: "https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600" },
            { id: 4, cat: 'beauty', name: "Face Serum", price: "699", brand: "Nykaa", score: "9.0", img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=600" },
            { id: 5, cat: 'fashion', name: "Denim Jacket", price: "3,200", brand: "Myntra", score: "8.5", img: "https://images.unsplash.com/photo-1576871337622-98d48d890e49?w=600" },
            { id: 6, cat: 'tech', name: "Earbuds Pro", price: "2,999", brand: "Amazon", score: "9.2", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600" },
            { id: 7, cat: 'fashion', name: "Cargo Pants", price: "1,500", brand: "Flipkart", score: "7.9", img: "https://images.unsplash.com/photo-1517438476312-10d79c6775e3?w=600" },
            { id: 8, cat: 'beauty', name: "Sunscreen SPF 50", price: "450", brand: "Myntra", score: "9.5", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600" },
            { id: 9, cat: 'fashion', name: "Leather Boots", price: "4,500", brand: "Ajio", score: "8.8", img: "https://images.unsplash.com/photo-1520639885833-92c51b3983e2?w=600" },
            { id: 10, cat: 'tech', name: "Smart Bulb", price: "999", brand: "Amazon", score: "8.1", img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600" }
        ];

        function renderProducts(target, data) {
            target.innerHTML = data.map(p => `
                <div class="product-card">
                    <div class="score-badge" onclick="openScorePage(${p.id})">${p.score}</div>
                    ${p.cat === 'fashion' ? `<div class="try-on-btn" onclick="openTryOn(${p.id})">Try On</div>` : ''}
                    <img src="${p.img}" class="w-full h-40 object-cover rounded-t-1.5rem">
                    <div class="p-3">
                        <p class="text-[8px] text-white/30 uppercase font-bold tracking-tighter">${p.brand}</p>
                        <h4 class="text-[10px] font-bold truncate">${p.name}</h4>
                        <p class="gold-text font-black text-xs mt-1">₹${p.price}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- SCREENSHOT ACCURATE SCORE PAGE ---
        function openScorePage(id) {
            const p = db.find(x => x.id === id);
            const modal = document.getElementById('score-modal');
            document.getElementById('score-content').innerHTML = `
                <div class="gia-score-card">
                    <div class="flex justify-between items-center mb-8">
                        <div class="flex items-center gap-2">
                            <span class="bg-black text-white text-[7px] px-3 py-1.5 rounded-full font-black uppercase">Verified by GIA AI</span>
                            <span class="text-green-500 text-[7px] font-bold italic">• Live Analysis</span>
                        </div>
                        <button onclick="closeModals()"><i data-lucide="x" class="text-black/20"></i></button>
                    </div>
                    
                    <h2 class="text-4xl royal-logo italic mb-10 text-slate-900">${p.name}</h2>

                    <div class="border border-blue-50 rounded-[2.5rem] p-6 mb-8">
                        <div class="flex justify-between text-[10px] font-black text-blue-900 mb-6 uppercase">
                            <span>Price Analysis</span>
                            <div class="flex gap-4 text-gray-300"><span>Days</span><span>Months</span><span>Years</span></div>
                        </div>
                        <div class="bar-chart mb-6">
                            <div class="bar h-[60%]"></div><div class="bar h-[80%]"></div><div class="bar active h-[40%]"></div><div class="bar h-[55%]"></div>
                        </div>
                        <div class="flex justify-between border-t border-blue-50 pt-4">
                            <div><p class="text-[8px] text-gray-400 font-bold">CURRENT STATUS</p><p class="text-[10px] font-black text-green-600 uppercase">Lowest Price in 30D</p></div>
                            <div class="text-right"><p class="text-[8px] text-gray-400 font-bold">PREDICTED TREND</p><p class="text-[10px] font-black text-blue-800 uppercase">Stable for 2 Weeks</p></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-green-50 rounded-[2rem] p-6 text-center">
                            <p class="text-[8px] text-green-700 font-bold uppercase mb-2">GIA SCORE</p>
                            <p class="text-4xl font-black text-green-800">${p.score}</p>
                            <p class="text-[7px] text-green-600 font-bold mt-2">High Trust Factor</p>
                        </div>
                        <div class="bg-slate-50 rounded-[2rem] p-6">
                            <p class="text-[8px] text-slate-400 font-bold uppercase mb-4">Checks Passed</p>
                            <div class="space-y-2 text-[8px] font-bold">
                                <p class="flex items-center gap-2">🛡️ Auth. Seller</p>
                                <p class="flex items-center gap-2">📈 No Price Hikes</p>
                                <p class="flex items-center gap-2">🤖 Fake Review Filter</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-black text-white p-6 rounded-[2rem]">
                        <p class="text-[8px] text-gray-500 font-bold italic mb-2 uppercase tracking-widest">GIA Intelligence Sentiment:</p>
                        <p class="text-[11px] leading-relaxed italic opacity-90">"Rahul, ye product abhi buying range mein hai. Seller ki history kaafi clean hai aur price drop real hai."</p>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        // --- COMBO PAGE RESTORED ---
        function openCombos() {
            const grid = document.getElementById('product-grid');
            document.querySelector('h3').innerText = "Flash Match Combos";
            // Mix products to show combo style
            renderProducts(grid, [...db].reverse());
            window.scrollTo(0,0);
        }

        function openTryOn(id) { document.getElementById('tryon-modal').style.display = 'block'; }
        function closeModals() { document.querySelectorAll('.full-modal').forEach(m => m.style.display='none'); }

        window.onload = () => { renderProducts(document.getElementById('product-grid'), db); };
    </script>

    <footer class="py-10 text-center border-t border-white/5 opacity-40">
        <p class="text-[8px] font-bold gold-text uppercase tracking-widest">GIA LUXE © 2026 | Verified Affiliate AI</p>
        <p class="text-[7px] mt-2 max-w-xs mx-auto">LEGAL DISCLAIMER: AI-generated styling advice. Affiliate commissions may be earned on verified purchases.</p>
    </footer>

</body>
</html>
