<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <div class="menu-left" onclick="openMenu()">☰ <span>Menu</span></div>

  <div class="right">
    <span onclick="toggleHomeWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>
</header>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
</div>

<!-- HOME WISHLIST POPUP -->
<div id="homeWishlist" class="home-wishlist">
  <h3>Your Wishlist ❤️</h3>
  <div id="homeWishlistItems">Your wishlist is empty ❤️</div>
</div>

<!-- CENTER -->
<div class="center">
  <div class="search-box">
    <input type="text" placeholder="Ask AI anything...">
  </div>

  <h1 class="hero-title">Curated luxury for you, Rahul</h1>
  <p class="hero-sub">Smart choices recommended by AI.</p>
</div>

<!-- PRODUCTS -->
<section class="ai-picks">
  <h2 class="ai-title">Trending Products</h2>

  <div class="products-center">
    <div class="ai-card">Luxury Watch</div>
    <div class="ai-card">Skincare Set</div>
    <div class="ai-card">Premium Shoes</div>
  </div>

  <h2 class="ai-title">Combo Deals</h2>
  <div class="horizontal-scroll">
    <div class="ai-card">Watch + Wallet</div>
    <div class="ai-card">Skin Combo</div>
  </div>
</section>

<footer class="footer">
  <a href="#">Terms & Conditions</a> |
  <a href="#">Privacy Policy</a> |
  <a href="#">Refund Policy</a>
</footer>

<script src="app.js"></script>
<script>
function openProfile(){ location.href="profile.html"; }
function openMenu(){ sideMenu.style.width="250px"; }
function closeMenu(){ sideMenu.style.width="0"; }
</script>

</body>
</html>
