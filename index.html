<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GIA AI Stylist</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <i class="fa fa-bars menu"></i>

    <div class="brand">
      <span class="mark">GIA</span>
      <span class="logo">AI STYLIST</span>
    </div>

    <div class="icons">
      <i class="fa fa-bell"></i>
      <i class="fa fa-heart"></i>
      <i class="fa fa-user"></i>
    </div>
  </div>
</header>

<section class="hero">
  <div class="search-wrap">
    <div class="search">
      <i class="fa fa-search"></i>
      <input id="searchInput" placeholder="Luxury skincare for glowing skin?" />
    </div>
  </div>

  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI</p>
</section>

<div class="tabs">
  <a class="tab active">All</a>
  <a class="tab">Watches</a>
  <a class="tab">Skincare</a>
  <a class="tab">Electronics</a>
  <a class="tab">Shoes</a>
</div>

<section class="grid">

  <div class="card">
    <span class="badge">AI Selected</span>
    <img src="https://via.placeholder.com/140">
    <h3>Fossil Grant Classic</h3>
    <p class="price">₹8,995</p>
    <button class="buy-btn">Buy Now →</button>
  </div>

  <div class="card">
    <span class="badge">Verified</span>
    <img src="https://via.placeholder.com/140">
    <h3>Titan Edge Ultra Thin</h3>
    <p class="price">₹19,999</p>
    <button class="buy-btn">Buy Now →</button>
  </div>

  <div class="card">
    <span class="badge">Premium</span>
    <img src="https://via.placeholder.com/140">
    <h3>Seiko Prospex Solar</h3>
    <p class="price">₹21,899</p>
    <button class="buy-btn">Buy Now →</button>
  </div>

</section>

<footer>
  <a href="#">Terms</a> ·
  <a href="#">Privacy</a> ·
  <a href="#">Conditions</a>
</footer>

<script src="script.js"></script>
</body>
</html>
