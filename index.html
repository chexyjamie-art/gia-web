<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="header">

  <!-- LEFT MENU -->
  <div class="menu">☰</div>

  <!-- RIGHT SIDE -->
  <div class="right-section">
    <img src="https://i.pravatar.cc/40" class="profile-pic">
    <span>Wishlist</span>
    <span>Notifications</span>
  </div>

</header>

<!-- ===== CENTER SEARCH ===== -->
<div class="center-area">

  <!-- LEFT WAVE -->
  <div class="wave left-wave"></div>

  <!-- RIGHT WAVE -->
  <div class="wave right-wave"></div>

  <!-- SEARCH BAR -->
  <div class="search-container">
    <div class="search-icons-left">
      <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" title="Search">
      <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" onclick="voiceSearch()" title="Mic">
      <label>
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png" title="Scan">
        <input type="file" hidden accept="image/*" capture="camera">
      </label>
    </div>

    <input type="text" placeholder="Ask AI anything...">
  </div>

</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script src="script.js"></script>
</body>
</html>
