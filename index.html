<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA | Smart AI Stylist</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }
        .reveal-section { animation: slideUp 0.8s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Voice Wave Animation */
        .wave { animation: wave 1s infinite alternate; }
        @keyframes wave { from { height: 4px; } to { height: 16px; } }
    </style>
</head>
<body class="bg-white text-black overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-50 rounded-full blur-[120px] opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-orange-50 rounded-full blur-[120px] opacity-60"></div>
    </div>

    <nav class="flex justify-between items-center p-6 sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-50">
        <div class="flex gap-4 items-center"><span class="cursor-pointer font-medium">☰ Menu</span></div>
        <div class="text-2xl font-bold tracking-widest">GIA</div>
        <div class="w-10 h-10 rounded-full bg-gray-100 overflow-hidden">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" alt="User">
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-10">
        <div class="relative max-w-2xl mx-auto mb-16 px-4">
            <div class="relative group">
                <input type="text" id="gia-search-input" placeholder="Search luxury or ask GIA..." 
                    class="w-full bg-white border border-gray-100 shadow-2xl py-5 px-14 rounded-full focus:outline-none focus:ring-2 ring-blue-100 transition-all">
                <div class="absolute right-6 top-1/2 -translate-y-1/2 flex items-center gap-3">
                    <button id="gia-voice-btn" class="text-xl opacity-40 hover:opacity-100 transition-opacity">🎤</button>
                    <label class="cursor-pointer text-xl opacity-40 hover:opacity-100">📷 <input type="file" class="hidden"></label>
                </div>
            </div>
            <div id="voice-waves" class="hidden mt-4 flex justify-center gap-1 items-center h-4">
                <div class="w-1 bg-blue-400 wave"></div>
                <div class="w-1 bg-blue-600 wave" style="animation-delay: 0.2s"></div>
                <div class="w-1 bg-blue-400 wave" style="animation-delay: 0.4s"></div>
            </div>
        </div>

        <section class="mb-20">
            <h2 class="text-sm font-bold tracking-[0.2em] uppercase text-gray-400 mb-8">GIA Verified Selections</h2>
            <div class="flex gap-8 overflow-x-auto pb-10 no-scrollbar">
                
                <div class="min-w-[320px] glass-card p-8 rounded-[3rem] border border-gray-100 shadow-sm relative group">
                    <div class="absolute top-6 left-8">
                        <span class="text-[9px] font-bold bg-green-50 text-green-600 px-3 py-1 rounded-full border border-green-100 uppercase">✔ GIA Score: 9.2</span>
                    </div>
                    <div class="h-48 flex items-center justify-center my-6">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" class="object-contain h-full drop-shadow-2xl group-hover:scale-105 transition-transform">
                    </div>
                    <h3 class="font-semibold text-lg">St. Fossil Grant Classic</h3>
                    <div class="flex justify-between items-end mt-8">
                        <div><p class="text-2xl font-bold">₹8,999</p> <p class="text-[10px] text-blue-500 font-bold italic">Price History: Stable</p></div>
                        <button class="bg-black text-white px-8 py-3 rounded-2xl text-sm">Buy Now</button>
                    </div>
                </div>

                <div class="min-w-[320px] glass-card p-8 rounded-[3rem] border border-gray-100 shadow-sm relative group">
                    <div class="absolute top-6 left-8">
                        <span class="text-[9px] font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full border border-blue-100 uppercase">✔ Trusted Seller</span>
                    </div>
                    <div class="h-48 flex items-center justify-center my-6">
                        <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=200" class="object-contain h-full group-hover:scale-105 transition-transform">
                    </div>
                    <h3 class="font-semibold text-lg">Premium Sunglasses</h3>
                    <div class="flex justify-between items-end mt-8">
                        <div><p class="text-2xl font-bold">₹4,999</p> <p class="text-[10px] text-orange-500 font-bold">Low Stock Alert</p></div>
                        <button class="bg-black text-white px-8 py-3 rounded-2xl text-sm">Buy Now</button>
                    </div>
                </div>

            </div>
        </section>

        <section id="gia-comparison-section" class="hidden mb-24 reveal-section">
            <div class="glass-card rounded-[3rem] p-10 border border-blue-50 shadow-xl">
                <h3 class="text-xl font-bold mb-6">📊 Price Comparison Table</h3>
                <table class="w-full text-left text-sm">
                    <tr class="border-b"><td class="py-4">Amazon</td> <td class="font-bold text-green-600">₹8,999</td> <td>Verified</td></tr>
                    <tr class="border-b"><td class="py-4">Flipkart</td> <td>₹9,150</td> <td class="text-gray-400">Not Verified</td></tr>
                </table>
            </div>
        </section>

        <section id="gia-3d-section" class="hidden mb-24 reveal-section">
            <div class="glass-card rounded-[4rem] p-12 flex flex-col items-center min-h-[500px] border border-gray-50">
                <div id="product-3d-container" class="w-64 md:w-80 cursor-grab">
                    <img src="https://images.unsplash.com/photo-1547996160-81dfa63595dd?w=600" id="floating-product" class="w-full drop-shadow-2xl">
                </div>
                <h3 class="text-2xl font-medium mt-8 text-center">Royal Oak Gold Concept (360°)</h3>
            </div>
        </section>

    </main>

    <div id="gia-aura-container" class="fixed bottom-8 right-8 z-[100] flex flex-col items-end">
        <div id="gia-chat-bubble" class="hidden w-80 bg-black text-white p-6 rounded-[2rem] shadow-2xl mb-4 border border-white/10">
            <p id="gia-chat-text" class="text-sm leading-relaxed"></p>
            <div id="gia-chat-actions" class="mt-4 flex flex-col gap-2"></div>
        </div>
        <button id="aura-trigger" class="w-16 h-16 rounded-full bg-black shadow-2xl flex items-center justify-center border border-white/10 text-2xl hover:scale-110 transition">✨</button>
    </div>

        <script>
        // ELEMENTS
        const bubble = document.getElementById('gia-chat-bubble');
        const textDisplay = document.getElementById('gia-chat-text');
        const actions = document.getElementById('gia-chat-actions');
        const waves = document.getElementById('voice-waves');
        let currentStep = "";

        // SPEECH RECOGNITION (Listening)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';

        // SPEECH SYNTHESIS (Speaking)
        function giaSpeak(text) {
            window.speechSynthesis.cancel(); // Purani awaaz roko
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            window.speechSynthesis.speak(msg);
            textDisplay.innerHTML = text;
            bubble.classList.remove('hidden');
        }

        // START LISTENING FOR COMMAND
        function listenForResponse() {
            waves.classList.remove('hidden');
            recognition.start();
        }

        recognition.onresult = (event) => {
            const voiceMatch = event.results[0][0].transcript.toLowerCase();
            waves.classList.add('hidden');
            console.log("User ne bola:", voiceMatch);

            if (voiceMatch.includes("haan") || voiceMatch.includes("dikhao") || voiceMatch.includes("yes") || voiceMatch.includes("ok")) {
                handlePositiveResponse();
            }
        };

        // Logic to handle "Yes" response for both steps
        function handlePositiveResponse() {
            if (currentStep === "compare") {
                revealFeature('gia-comparison-section');
                // 2 second ka pause dekar 3D ke liye pucho
                setTimeout(askFor3D, 2000);
            } else if (currentStep === "3d") {
                revealFeature('gia-3d-section');
                giaSpeak("3D View active kar diya hai, Rahul. Enjoy your luxury experience!");
                currentStep = "finished";
                actions.innerHTML = ""; // Buttons saaf kar do
            }
        }

        function revealFeature(id) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.scrollIntoView({ behavior: 'smooth' });
            bubble.classList.add('hidden'); // Ek pal ke liye hide karo taaki next question pop-up lage
        }

        // STEP 1: Ask for Comparison
        function startGIAAssistant() {
            currentStep = "compare";
            giaSpeak("Rahul, maine analysis kar li hai. Kya tum iska price comparison table dekhna chahte ho?");
            actions.innerHTML = `
                <button onclick="listenForResponse()" class="bg-blue-600 p-2 rounded-xl text-[10px] font-bold text-white hover:scale-105 transition">🎤 Bol kar jawab dein</button>
                <button onclick="handlePositiveResponse()" class="bg-white/10 p-2 rounded-xl text-[10px] text-white hover:bg-white/20">Haan, dikhao</button>
            `;
        }

        // STEP 2: Ask for 3D
        function askFor3D() {
            currentStep = "3d";
            bubble.classList.remove('hidden');
            giaSpeak("Vaise Rahul, main aapko ye product 3D view mein bhi dikha sakti hoon. Kya aap ise rotate karke dekhna chahte hain?");
            actions.innerHTML = `
                <button onclick="listenForResponse()" class="bg-green-600 p-2 rounded-xl text-[10px] font-bold text-white hover:scale-105 transition">🎤 Haan, 3D dikhao</button>
                <button onclick="handlePositiveResponse()" class="bg-white/10 p-2 rounded-xl text-[10px] text-white">Zaroor</button>
            `;
        }

        // Auto-start after 5 seconds
        window.addEventListener('load', () => {
            setTimeout(startGIAAssistant, 5000);
        });

        document.getElementById('aura-trigger').addEventListener('click', startGIAAssistant);
    </script>

</body>
</html>
