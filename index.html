<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIA – Smart AI Stylist</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8f9fc, #eef1f8);
      color: #222;
    }

    header {
      text-align: center;
      padding: 30px 15px;
    }

    .logo {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #c9a24d;
    }

    .tagline {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }

    .search-box {
      margin: 25px auto;
      max-width: 420px;
      display: flex;
      background: #fff;
      border-radius: 50px;
      padding: 10px 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 15px;
    }

    .mic {
      font-size: 20px;
      color: #888;
    }

    .hero {
      text-align: center;
      padding: 20px;
    }

    .hero h2 {
      font-size: 22px;
      font-weight: 500;
    }

    .hero p {
      font-size: 14px;
      color: #666;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
    }

    .card h4 {
      margin: 10px 0 5px;
      font-size: 14px;
    }

    .price {
      font-size: 13px;
      color: #444;
    }

    .buy {
      margin-top: 8px;
      display: inline-block;
      background: linear-gradient(135deg, #6a85ff, #8fd3f4);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">GIA</div>
  <div class="tagline">Smart AI Stylist</div>

  <div class="search-box">
    <input type="text" placeholder="Luxury skincare for glowing skin?" />
    <div class="mic">🎤</div>
  </div>
</header>

<section class="hero">
  <h2>Curated luxury for you</h2>
  <p>Smart choices recommended by AI</p>
</section>

<section class="cards">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" />
    <h4>Luxury Watch</h4>
    <div class="price">₹7,999</div>
    <a class="buy">Buy Now</a>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1585238342028-4bbc8e65a37b" />
    <h4>Skincare Serum</h4>
    <div class="price">₹1,499</div>
    <a class="buy">Buy Now</a>
  </div>
</section>

</body>
</html>
