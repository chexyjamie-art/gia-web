<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <div class="menu-left" onclick="openMenu()">☰ <span>Menu</span></div>

  <div class="right">
    <span onclick="toggleHomeWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>
</header>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#">Terms</a>
  <a href="#">Privacy</a>
  <a href="#">Conditions</a>
</div>

<!-- CENTER -->
<div class="center">

  <!-- SEARCH BAR -->
  <div class="search-box premium-glow">
    <input type="text" placeholder="Ask AI anything...">
  </div>

  <h1 class="hero-title">Curated luxury for you</h1>
  <p class="hero-sub">Smart choices recommended by AI.</p>
</div>

<!-- HOME WISHLIST -->
<section class="ai-picks" id="homeWishlist" style="display:none;">
  <h2 class="ai-title">❤️ Your Wishlist</h2>
  <div id="homeWishlistItems" class="horizontal-scroll"></div>
</section>

<!-- PRODUCTS -->
<section class="ai-picks">
  <h2 class="ai-title">Trending Premium Combos</h2>

  <div class="horizontal-scroll">
    <div class="ai-card">
      <img src="https://via.placeholder.com/220">
      <h3>Luxury Watch</h3>
      <button onclick="addToWishlist('Luxury Watch')">♡ Wishlist</button>
    </div>

    <div class="ai-card">
      <img src="https://via.placeholder.com/220">
      <h3>Skincare Combo</h3>
      <button onclick="addToWishlist('Skincare Combo')">♡ Wishlist</button>
    </div>

    <div class="ai-card">
      <img src="https://via.placeholder.com/220">
      <h3>Premium Sneakers</h3>
      <button onclick="addToWishlist('Premium Sneakers')">♡ Wishlist</button>
    </div>
  </div>
</section>

<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script src="app.js"></script>
</body>
</html>
