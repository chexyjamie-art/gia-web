<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 2rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden; height: auto; display: flex; flex-direction: column; cursor: pointer;
        }
        .product-card:hover { transform: translateY(-10px); border: 1px solid #BF953F; box-shadow: 0 0 30px rgba(191, 149, 63, 0.2); }

        /* SCORE BADGE - TOP LEFT */
        .score-badge {
            position: absolute; top: 15px; left: 15px;
            background: linear-gradient(45deg, #BF953F, #FCF6BA);
            color: black; font-weight: 900; padding: 4px 10px;
            border-radius: 10px; font-size: 10px; z-index: 20;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }

        .stylist-lens-box { border-left: 3px solid #BF953F; background: rgba(191, 149, 63, 0.08); border-radius: 0 1.5rem 1.5rem 0; padding: 1.5rem; font-style: italic; }
        .gia-insight-panel { background: rgba(191, 149, 63, 0.05); border: 1px dashed rgba(191, 149, 63, 0.3); border-radius: 1.5rem; animation: fadeIn 0.8s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .mic-active { color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* MODALS */
        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); z-index: 2000; display: none; overflow-y: auto; backdrop-filter: blur(25px); }
        #score-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 3000; display: none; overflow-y: auto; backdrop-filter: blur(15px); }

        .mobile-nav { 
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
            padding: 1rem; justify-content: space-around;
        }

        /* 360 VIEWER STYLE */
        .viewer-3d { 
            background: radial-gradient(circle, rgba(191,149,63,0.1) 0%, rgba(0,0,0,0) 70%);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="offers.html" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i></a>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <div class="flex items-center gap-3">
                <p id="header-user-name" class="text-[9px] font-bold gold-text tracking-widest uppercase hidden sm:block">Loading...</p>
                <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden"><img id="user-avatar" src="" class="w-full h-full rounded-full object-cover"></a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center mb-10">
            <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-6">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Bhai, kya dhund rahe ho? (Gift, Acne, Party...)" class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5 hover:bg-white/5 rounded-full"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i> <span class="hidden sm:inline">Visual AI</span></button>
                <input type="file" id="image-upload" class="hidden">
            </div>

            <div id="gia-ai-box" class="max-w-2xl mx-auto gia-insight-panel p-6 text-left hidden">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-2 h-2 rounded-full bg-[#BF953F] animate-ping"></div>
                    <span class="text-[10px] uppercase font-black tracking-widest text-[#BF953F]">GIA Personal Stylist</span>
                </div>
                <p id="gia-ai-text" class="text-sm italic text-white/80 leading-relaxed font-light"></p>
                <div id="gia-tip-container" class="mt-4 pt-3 border-t border-white/5 flex items-center gap-2 text-[#BF953F] hidden">
                    <i data-lucide="lightbulb" class="w-3 h-3"></i>
                    <p id="gia-ai-tip" class="text-[10px] font-bold uppercase tracking-widest"></p>
                </div>
            </div>
        </section>

        <section class="mb-20">
            <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Curated Picks</h3>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <nav class="mobile-nav">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span>
        </button>
    </nav>

    <div id="score-modal">
        <div class="max-w-xl mx-auto px-6 py-20 relative text-center">
            <button onclick="closeScore()" class="absolute top-10 right-0 text-white/40"><i data-lucide="x"></i></button>
            <div id="score-modal-content"></div>
        </div>
    </div>

    <div id="details-modal">
        <div class="max-w-6xl mx-auto px-6 py-10 relative">
            <button onclick="closeDetails()" class="fixed top-8 right-8 text-white/40 hover:text-white z-[3000]"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="py-16 text-center border-t border-white/5">
        <h2 class="royal-logo gold-text text-xl italic mb-4">GIA LUXE</h2>
        <p class="text-[9px] text-white/30 italic max-w-xs mx-auto mb-8">GIA is an AI-powered affiliate platform. Psychological curation.</p>
        <p class="text-[8px] text-[#BF953F]/60 uppercase tracking-[0.3em] font-bold text-center">© 2026 ALTER PROJECT | LEGAL DISCLAIMER: AI-Generated Advice. Verified by GIA.</p>
    </footer>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI"; 
        lucide.createIcons();

        const allDatabase = [
            { id: 1, brand: 'Amazon', category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", match: "98.4", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", sentiment: "Summer parties ke liye best royal choice.", material: "100% Irish Linen", colors: "Emerald, White, Navy" },
            { id: 101, brand: 'Myntra', category: 'beauty', name: "Salicylic Face Wash", price: "499", match: "95.2", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600", sentiment: "Pimples ke liye sabse effective cleanser.", material: "2% Salicylic Acid", colors: "Clear Gel" },
            { id: 2, brand: 'Ajio', category: 'fashion', name: "Charcoal Chinos", price: "1,899", match: "94.2", img: "https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600", sentiment: "Durable aur comfortable chinos.", material: "Stretch Cotton Twill", colors: "Charcoal, Khaki, Black" },
            { id: 201, brand: 'Amazon', category: 'tech', name: "ANC Earbuds Pro", price: "4,499", match: "92.8", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600", sentiment: "Gym aur travel ke liye perfect choice.", material: "Hybrid ANC Tech", colors: "Space Gray, Pearl White" }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('header-user-name').innerText = name;
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-6" onclick="openDetails(${p.id})">
                    <div class="score-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match}% MATCH</div>
                    
                    <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl mb-4">
                    <h4 class="text-sm font-bold text-white/80">${p.name}</h4>
                    <div class="flex justify-between items-center mt-2">
                        <p class="text-xl font-black gold-text">₹${p.price}</p>
                        <span class="text-[8px] text-white/20 uppercase font-bold">${p.brand}</span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- NEW: ADVANCED SCORE PAGE ---
        function openScorePage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('score-modal');
            document.getElementById('score-modal-content').innerHTML = `
                <h2 class="text-6xl font-black gold-text mb-2">${p.match}%</h2>
                <p class="text-[10px] tracking-[0.5em] text-white/40 uppercase mb-12">GIA Trust Index</p>
                
                <div class="grid gap-6 text-left">
                    <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
                        <h4 class="text-[10px] gold-text font-bold uppercase mb-4">Sentiment Analysis</h4>
                        <div class="flex justify-between text-[10px] mb-2"><span>Real Positive Feedback</span><span>92%</span></div>
                        <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-[#BF953F]" style="width:92%"></div></div>
                        <p class="text-[9px] text-white/40 mt-3 italic">"Verified: GIA scanned 450+ reviews. AI-generated spam filtered out."</p>
                    </div>

                    <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
                        <h4 class="text-[10px] gold-text font-bold uppercase mb-4">Price History</h4>
                        <table class="w-full text-[11px]">
                            <tr class="border-b border-white/5"><td class="py-2 text-white/40">Last Month</td><td class="text-right">₹${parseInt(p.price) + 500}</td></tr>
                            <tr class="text-[#BF953F]"><td class="py-2 font-bold">Today's Deal</td><td class="text-right font-black">₹${p.price}</td></tr>
                        </table>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        // --- NEW: COMPLETE PRODUCT PAGE WITH 3D & VIDEO ---
        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                    <div class="space-y-6">
                        <div class="viewer-3d aspect-square rounded-[3rem] overflow-hidden relative group">
                            <img src="${p.img}" class="w-full h-full object-cover opacity-60">
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <i data-lucide="rotate-3d" class="w-16 h-16 text-[#BF953F] animate-pulse mb-4"></i>
                                <p class="text-[10px] font-black gold-text uppercase tracking-widest">360° AI Render Loading...</p>
                            </div>
                        </div>
                        <div class="aspect-video bg-black rounded-3xl border border-white/5 flex items-center justify-center overflow-hidden">
                             <i data-lucide="play" class="text-white/10 w-10 h-10"></i>
                             <p class="text-[10px] text-white/20 uppercase font-black ml-3">Product Reel Video</p>
                        </div>
                    </div>

                    <div class="p-4">
                        <span class="text-[#BF953F] text-[10px] font-black uppercase tracking-widest">Premium Selection</span>
                        <h2 class="text-5xl md:text-6xl royal-logo gold-text my-6">${p.name}</h2>
                        
                        <div class="flex items-center gap-6 mb-8">
                            <p class="text-4xl font-black italic">₹${p.price}</p>
                            <div class="bg-white/5 px-4 py-2 rounded-xl text-[10px] font-bold border border-white/10">FREE DELIVERY</div>
                        </div>

                        <div class="mb-10 p-6 bg-white/5 rounded-3xl border border-white/10">
                            <p class="text-[10px] text-white/40 font-bold uppercase mb-4">Check Availability</p>
                            <div class="flex gap-2">
                                <input type="text" placeholder="Enter Pincode" class="bg-black/40 border border-white/10 rounded-2xl px-5 py-3 text-xs outline-none focus:border-[#BF953F] flex-grow">
                                <button class="bg-[#BF953F] text-black px-6 py-3 rounded-2xl text-[10px] font-black uppercase">CHECK</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-10">
                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-white/30 uppercase">Material</p>
                                <p class="text-xs font-bold">${p.material}</p>
                            </div>
                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-white/30 uppercase">Variants</p>
                                <p class="text-xs font-bold">${p.colors}</p>
                            </div>
                        </div>

                        <div class="stylist-lens-box mb-10 text-sm">"Bhai, GIA ne isko ${p.brand} se dhoonda hai specifically tere elite vibe ke liye. Material ekdum aag hai."</div>

                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-6 rounded-[2rem] font-black uppercase text-xs shadow-2xl">Purchase Now on ${p.brand}</button>
                    </div>
                </div>`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeDetails() {
            document.getElementById('details-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function closeScore() {
            document.getElementById('score-modal').style.display = 'none';
        }

        // Voice & Search (Restored and Kept)
        async function askGiaAI(query) {
            const aiBox = document.getElementById('gia-ai-box');
            const aiText = document.getElementById('gia-ai-text');
            aiBox.classList.remove('hidden');
            aiText.innerHTML = "<span class='animate-pulse text-[#BF953F]'>GIA soch rahi hai...</span>";
            const prompt = `System: Tera naam GIA hai. Tu Rahul ki Best Friend aur Stylist hai. Query: "${query}". Real desi doston wali chat kar. Max 2 lines.`;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                aiText.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { aiText.innerText = "Signal weak hai bhai!"; }
        }

        document.getElementById('ai-search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if(query.length > 0) {
                    askGiaAI(query);
                    const filtered = allDatabase.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
                    renderProducts(filtered);
                }
            }
        });

        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'en-US';
            rec.onstart = () => document.querySelector('#mic-btn i').classList.add('mic-active');
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('ai-search-input').value = text;
                askGiaAI(text);
                document.querySelector('#mic-btn i').classList.remove('mic-active');
            };
            rec.start();
        }
    </script>
</body>
</html>
