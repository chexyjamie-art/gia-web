<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="menu-left">☰ Menu</div>

  <div class="right">
    <span>Notifications</span>
    <span>Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile">
  </div>
</header>

<!-- CENTER AREA -->
<div class="hero">

  <!-- SEARCH BAR -->
  <div class="search-wrapper">
    <div class="wave-bg"></div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Luxury skincare for glowing skin?">
    </div>
  </div>

  <!-- TEXT BELOW SEARCH -->
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

</body>
</html>
