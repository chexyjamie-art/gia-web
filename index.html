<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GIA – Your AI Shopping Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      text-align: center;
    }
    header {
      padding: 40px 20px;
    }
    h1 {
      font-size: 48px;
      letter-spacing: 3px;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
    }
    .search-box {
      margin-top: 40px;
    }
    input {
      width: 80%;
      max-width: 400px;
      padding: 15px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
    }
    footer {
      margin-top: 60px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>GIA</h1>
    <p>Your AI Shopping Guide</p>

    <div class="search-box">
      <input type="text" placeholder="Search anything… fashion, beauty, gadgets" />
    </div>
  </header>

  <footer>
    © 2026 GIA • Built with ❤️ in India
  </footer>

</body>
</html>
