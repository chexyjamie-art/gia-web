<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* GRID FIX: Mobile 2 Col | Desktop 4 Col */
        #product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 1024px) { #product-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 1.5rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden;
        }
        .product-card:hover { transform: translateY(-5px); border: 1px solid #BF953F; }

        /* Label Fixes */
        .match-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); 
            padding: 4px 8px; border-radius: 8px; border: 1px solid #BF953F; 
            font-size: 9px; font-weight: 900; color: #BF953F; z-index: 10;
        }
        .try-on-btn {
            position: absolute; bottom: 85px; right: 10px; background: #BF953F; 
            color: black; font-size: 8px; font-weight: 900; padding: 4px 10px; 
            border-radius: 6px; text-transform: uppercase; z-index: 20; cursor: pointer;
        }

        .stylist-lens-box { border-left: 3px solid #BF953F; background: rgba(191, 149, 63, 0.08); padding: 1rem; font-style: italic; }

        /* Navigation: Desktop Hide */
        .mobile-nav { 
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(4, 36, 26, 0.98); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
            padding: 1rem; justify-content: space-around;
        }
        @media (min-width: 1024px) { .mobile-nav { display: none; } }

        /* Modals */
        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 2000; display: none; overflow-y: auto; backdrop-filter: blur(15px); }
        .img-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .img-slider::-webkit-scrollbar { display: none; }
        .img-slider img, .img-slider video { flex: 0 0 100%; scroll-snap-align: start; object-fit: cover; aspect-ratio: 1/1; }

        /* Score Card Style */
        .score-card-white { background: white; border-radius: 2.5rem; color: #04241a; padding: 2rem; max-width: 450px; margin: auto; }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100] bg-[#04241a]/90">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl royal-logo gold-text cursor-pointer" onclick="location.reload()">GIA LUXE</h1>
            <div class="hidden lg:flex gap-8 text-[10px] font-bold uppercase tracking-widest">
                <a href="#" onclick="location.reload()" class="gold-text">Home</a>
                <a href="#" onclick="renderProducts(allDatabase)">Combos</a>
                <a href="profile.html">Profile</a>
            </div>
            <div class="flex items-center gap-3">
                <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden"><img id="user-avatar" src="" class="w-full h-full rounded-full object-cover"></a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="text-center mb-10">
            <h2 class="text-3xl royal-logo gold-text mb-6 italic">Hi, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-6">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Ask something to GIA..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
            </div>

            <div id="gia-ai-box" class="max-w-2xl mx-auto p-6 bg-white/5 border border-dashed border-[#BF953F]/30 rounded-3xl text-left hidden">
                <p id="gia-ai-text" class="text-sm italic text-white/80 leading-relaxed"></p>
            </div>
        </section>

        <div id="product-grid"></div>
    </main>

    <div id="details-modal">
        <div id="modal-content" class="min-h-screen flex items-center justify-center p-4"></div>
    </div>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span></button>
        <button onclick="renderProducts(allDatabase)" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span></button>
        <button class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Search</span></button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span></button>
    </nav>

    <footer class="py-16 text-center border-t border-white/5">
        <p class="text-[8px] text-[#BF953F]/60 uppercase tracking-[0.3em] font-bold">© 2026 ALTER PROJECT | LEGAL DISCLAIMER: AI-Generated Advice. Verified by GIA.</p>
    </footer>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI"; 
        
        const allDatabase = [
            { id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", match: "98.4", images: ["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", "https://images.unsplash.com/photo-1621072156002-e2fccdc0b176?w=600"], brand: 'Amazon', sentiment: "Bhai elite vibe hai!" },
            { id: 2, category: 'fashion', name: "Charcoal Chinos", price: "1,899", match: "94.2", images: ["https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600"], brand: 'Ajio', sentiment: "Formal look sorted!" },
            { id: 101, category: 'beauty', name: "Face Wash", price: "499", match: "95.2", images: ["https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600"], brand: 'Nykaa', sentiment: "Cleanses deep." },
            { id: 3, category: 'fashion', name: "Leather Boots", price: "4,500", match: "88.5", images: ["https://images.unsplash.com/photo-1520639885833-92c51b3983e2?w=600"], brand: 'Myntra', sentiment: "Perfect for winter." },
            { id: 4, category: 'tech', name: "Earbuds Pro", price: "2,999", match: "91.0", images: ["https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600"], brand: 'Amazon', sentiment: "Killer sound." },
            { id: 5, category: 'fashion', name: "Denim Jacket", price: "3,200", match: "84.2", images: ["https://images.unsplash.com/photo-1576871337622-98d48d890e49?w=600"], brand: 'Flipkart', sentiment: "Old school cool." },
            { id: 6, category: 'fashion', name: "Cargo Pants", price: "1,500", match: "79.8", images: ["https://images.unsplash.com/photo-1517438476312-10d79c6775e3?w=600"], brand: 'Ajio', sentiment: "Pocket king!" },
            { id: 7, category: 'fashion', name: "College Bag", price: "1,200", match: "92.0", images: ["https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600"], brand: 'Amazon', sentiment: "Durable for students." },
            { id: 8, category: 'beauty', name: "SPF 50 Sunscreen", price: "650", match: "96.1", images: ["https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600"], brand: 'Nykaa', sentiment: "No white cast." },
            { id: 9, category: 'fashion', name: "Cotton Kurta", price: "999", match: "89.4", images: ["https://images.unsplash.com/photo-1589156229687-496a31ad1d1f?w=600"], brand: 'Myntra', sentiment: "Ethnic swag." }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card" onclick="openProductPage(${p.id})">
                    <div class="match-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match}%</div>
                    ${p.category === 'fashion' ? `<div class="try-on-btn" onclick="event.stopPropagation(); openTryOnStudio(${p.id})">TRY ON</div>` : ''}
                    <img src="${p.images[0]}" class="w-full h-40 object-cover rounded-t-1.5rem">
                    <div class="p-3">
                        <p class="text-[8px] text-white/30 uppercase font-bold tracking-widest">${p.brand}</p>
                        <h4 class="text-[11px] font-bold truncate">${p.name}</h4>
                        <p class="gold-text font-black text-xs mt-1">₹${p.price}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openScorePage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="score-card-white">
                    <div class="flex justify-between mb-6">
                        <span class="bg-black text-white text-[7px] px-3 py-1 rounded-full font-black">VERIFIED BY GIA</span>
                        <button onclick="closeDetails()" class="text-black/20"><i data-lucide="x"></i></button>
                    </div>
                    <h2 class="text-2xl royal-logo italic text-black mb-6">${p.name}</h2>
                    <div class="border border-blue-50 rounded-3xl p-4 mb-4 bg-blue-50/30">
                        <p class="text-[9px] font-black text-blue-900 mb-4">PRICE ANALYSIS (30D)</p>
                        <div class="flex items-end gap-2 h-16">
                            <div class="flex-grow bg-blue-100 rounded-t h-1/2"></div>
                            <div class="flex-grow bg-blue-400 rounded-t h-full"></div>
                            <div class="flex-grow bg-blue-100 rounded-t h-1/3"></div>
                        </div>
                    </div>
                    <div class="bg-black text-white p-5 rounded-3xl text-[10px] italic">
                        "Bhai, GIA ne check kiya hai, ye legit best price hai."
                    </div>
                </div>`;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        function openTryOnStudio(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="bg-[#04241a] p-8 rounded-[3rem] border border-white/10 w-full max-w-md text-center">
                    <button onclick="closeDetails()" class="float-right text-white/20"><i data-lucide="x"></i></button>
                    <h2 class="gold-text royal-logo text-lg mb-8">Virtual Studio</h2>
                    <div id="studio-view" class="aspect-[3/4] bg-black/40 rounded-[2rem] border-2 border-dashed border-white/10 flex flex-col items-center justify-center p-6 mb-6">
                        <p class="text-[10px] text-white/40 mb-4 italic">Upload full photo to see it on you!</p>
                        <input type="file" id="studio-upload" class="hidden" onchange="runAI()">
                        <button onclick="document.getElementById('studio-upload').click()" class="bg-[#BF953F] text-black px-8 py-3 rounded-full text-[9px] font-black uppercase">Upload Photo</button>
                    </div>
                </div>`;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        function openProductPage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="bg-[#04241a] rounded-[3rem] overflow-hidden border border-white/10 w-full max-w-4xl">
                    <div class="grid grid-cols-1 md:grid-cols-2">
                        <div class="relative">
                            <div class="img-slider">
                                ${p.images.map(img => `<img src="${img}">`).join('')}
                                <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls class="w-full"></video>
                            </div>
                            ${p.category === 'fashion' ? `<div class="absolute bottom-6 left-6 animate-spin text-gold"><i data-lucide="rotate-cw"></i></div>` : ''}
                        </div>
                        <div class="p-8">
                            <button onclick="closeDetails()" class="float-right text-white/20"><i data-lucide="x"></i></button>
                            <h2 class="text-3xl royal-logo gold-text mb-4">${p.name}</h2>
                            <p class="text-2xl font-black mb-6">₹${p.price}</p>
                            <div class="stylist-lens-box text-xs mb-8">"${p.sentiment}"</div>
                            <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-4 rounded-2xl font-black uppercase text-xs">Buy Now</button>
                        </div>
                    </div>
                </div>`;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }

        async function askGiaAI(query) {
            const box = document.getElementById('gia-ai-box');
            const text = document.getElementById('gia-ai-text');
            box.classList.remove('hidden');
            text.innerHTML = "<span class='animate-pulse text-[#BF953F]'>GIA is thinking...</span>";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `You are GIA, Rahul's witty stylist best friend. Reply to: ${query}` }] }] })
                });
                const data = await res.json();
                text.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { text.innerText = "Error in connection!"; }
        }

        document.getElementById('ai-search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const q = e.target.value.trim();
                if(q) {
                    askGiaAI(q);
                    const filtered = allDatabase.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
                    renderProducts(filtered);
                }
            }
        });

        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => {
                const t = e.results[0][0].transcript;
                document.getElementById('ai-search-input').value = t;
                askGiaAI(t);
            };
            rec.start();
        }
    </script>
</body>
</html>
