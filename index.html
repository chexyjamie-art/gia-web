<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>GIA – Smart AI Stylist</title>

  <!-- Google Fonts (OLD) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Google Fonts (NEW – as you asked) -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="topbar">
  <div class="left">☰ Menu &nbsp; Shop</div>

  <div class="logo">
    <img src="assets/logo.svg" alt="GIA">
    <span>Smart AI Stylist</span>
  </div>

  <div class="right">🔔 👤</div>
</header>

<!-- ================= AI SEARCH + WAVE ================= -->
<section class="search-section">

  <!-- Apple-style AI Wave -->
  <canvas id="aiWave"></canvas>

  <!-- AI Search Input -->
  <div class="search-box">
    <input
      id="aiSearch"
      type="text"
      placeholder="Luxury skincare for glowing skin?"
    />
  </div>

</section>

<!-- ================= HEADLINE ================= -->
<section class="headline">
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>
</section>

<!-- ================= CATEGORIES ================= -->
<nav class="categories">
  <span class="active">All</span>
  <span>Watches</span>
  <span>Skincare</span>
  <span>Electronics</span>
  <span>Shoes</span>
</nav>

<!-- ================= PRODUCTS ================= -->
<section class="products">

  <div class="card">
    <img src="assets/watch1.jpg">
    <h3>Fossil Grant Classic</h3>
    <p>₹7,495 – 8,095</p>
    <button>Buy Now →</button>
  </div>

  <div class="card">
    <img src="assets/watch2.jpg">
    <h3>Titan Edge Ultra Thin</h3>
    <p>₹10,995 – 19,998</p>
    <button>Buy Now →</button>
  </div>

  <div class="card">
    <img src="assets/watch3.jpg">
    <h3>Seiko Prospex Solar</h3>
    <p>₹16,995 – 21,999</p>
    <button>Buy Now →</button>
  </div>

</section>

<!-- ================= FOOTER ================= -->
<footer>
  <p>About · FAQs · Contact</p>
</footer>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
