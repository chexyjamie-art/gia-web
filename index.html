<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="menu-left">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span>Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile">
  </div>
</header>

<!-- WAVE AREA -->
<div class="wave-wrapper">

  <div class="wave-right"></div>
</div>

<!-- CENTER SEARCH -->
<div class="center">

  <div class="search-box">
    <input type="text" placeholder="Luxury skincare for glowing skin?">
    <div class="mini-wave"></div>
  </div>

  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<footer class="footer">
  Terms | Privacy | Conditions
</footer>

</body>
</html>
