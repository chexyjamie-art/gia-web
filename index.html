<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: #04241a; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Mobile 2 Column, Desktop 3 Column */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 30px; }
        }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); border-radius: 1.5rem; 
            border: 1px solid rgba(191, 149, 63, 0.1); position: relative;
        }

        /* Try On Label on Card */
        .try-on-label {
            position: absolute; bottom: 80px; right: 10px;
            background: #BF953F; color: black; font-size: 8px;
            font-weight: 900; padding: 4px 8px; border-radius: 5px;
            text-transform: uppercase; z-index: 10;
        }

        /* Image Slider Container */
        .img-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .img-slider img, .img-slider video { flex: 0 0 100%; scroll-snap-align: start; object-fit: cover; }

        #details-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; overflow-y: auto; }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 border-b border-white/5 sticky top-0 bg-[#04241a] z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl royal-logo gold-text">GIA LUXE</h1>
            <div id="user-profile" class="w-8 h-8 rounded-full border border-gold overflow-hidden">
                <img id="user-avatar" src="" class="w-full h-full">
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="relative max-w-2xl mx-auto mb-12">
            <input type="text" id="ai-search-input" placeholder="Ask GIA for styling tips..." 
                   class="w-full bg-white/5 border border-[#BF953F]/30 rounded-full py-4 px-6 text-sm outline-none focus:border-[#BF953F]">
            <button class="absolute right-4 top-3 text-[#BF953F]"><i data-lucide="sparkles"></i></button>
        </div>

        <div id="product-grid" class="product-grid"></div>
    </main>

    <div id="details-modal">
        <div id="modal-content" class="p-4 md:p-10"></div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI";
        
        // Extended Database with Category & Multiple Images
        const allDatabase = [
            { 
                id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", 
                images: [
                    "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600",
                    "https://images.unsplash.com/photo-1621072156002-e2fccdc0b176?w=600"
                ],
                video: "https://www.w3schools.com/html/mov_bbb.mp4",
                brand: 'Amazon', match: "98", sentiment: "Bhai elite vibe hai!"
            },
            { 
                id: 101, category: 'beauty', name: "Face Wash", price: "499", 
                images: ["https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600"],
                brand: 'Nykaa', match: "95", sentiment: "Pimples khatam!"
            }
        ];

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card" onclick="openDetails(${p.id})">
                    ${p.category === 'fashion' ? `<div class="try-on-label" onclick="event.stopPropagation(); openTryOnPage(${p.id})">Try On</div>` : ''}
                    <img src="${p.images[0]}" class="w-full h-48 object-cover rounded-t-1.5rem">
                    <div class="p-4">
                        <p class="text-[10px] text-white/40 uppercase">${p.brand}</p>
                        <h4 class="text-xs font-bold truncate">${p.name}</h4>
                        <p class="gold-text font-black mt-1">₹${p.price}</p>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- DEDICATED TRY-ON PAGE ---
        function openTryOnPage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="max-w-md mx-auto text-center space-y-6">
                    <button onclick="closeDetails()" class="float-right text-white/50"><i data-lucide="x"></i></button>
                    <h2 class="text-xl gold-text royal-logo">GIA Virtual Studio</h2>
                    <div id="studio-screen" class="aspect-[3/4] bg-black/40 rounded-[2rem] border-2 border-dashed border-white/10 flex flex-col items-center justify-center p-6">
                        <p class="text-[10px] text-white/40 mb-6 italic">"Upload a full-size photo to see how this ${p.name} looks on you!"</p>
                        <input type="file" id="studio-upload" class="hidden" onchange="processStudioTryOn(${p.id})">
                        <button onclick="document.getElementById('studio-upload').click()" class="bg-[#BF953F] text-black px-8 py-3 rounded-full text-[10px] font-black uppercase">Upload Photo</button>
                    </div>
                    <div class="p-4 bg-white/5 rounded-2xl flex items-center gap-4">
                        <img src="${p.images[0]}" class="w-12 h-12 rounded-lg">
                        <p class="text-[10px] text-left">Selected: <b>${p.name}</b></p>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        async function processStudioTryOn(id) {
            const p = allDatabase.find(x => x.id === id);
            const file = document.getElementById('studio-upload').files[0];
            const screen = document.getElementById('studio-screen');
            
            screen.innerHTML = `<div class="animate-spin w-8 h-8 border-4 border-gold border-t-transparent rounded-full"></div>`;
            
            setTimeout(() => {
                const url = URL.createObjectURL(file);
                screen.innerHTML = `
                    <div class="relative h-full w-full rounded-[2rem] overflow-hidden">
                        <img src="${url}" class="w-full h-full object-cover">
                        <img src="${p.images[0]}" class="absolute inset-0 w-full h-full object-contain mix-blend-multiply opacity-90 transform scale-110 translate-y-4">
                    </div>
                `;
            }, 2000);
        }

        // --- PRODUCT DETAILS WITH SLIDER & 360 ONLY FOR FASHION ---
        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            
            document.getElementById('modal-content').innerHTML = `
                <div class="max-w-4xl mx-auto bg-black/60 rounded-[3rem] overflow-hidden border border-white/10">
                    <div class="grid grid-cols-1 md:grid-cols-2">
                        <div class="relative">
                            <div class="img-slider aspect-square">
                                ${p.images.map(img => `<img src="${img}">`).join('')}
                                ${p.video ? `<video src="${p.video}" controls></video>` : ''}
                            </div>
                            ${p.category === 'fashion' ? `
                                <div class="absolute bottom-4 left-4 bg-black/60 p-2 rounded-full border border-gold/30">
                                    <i data-lucide="rotate-cw" class="w-4 h-4 text-gold animate-spin"></i>
                                </div>
                            ` : ''}
                        </div>
                        <div class="p-8 space-y-6">
                            <h2 class="text-3xl royal-logo gold-text">${p.name}</h2>
                            <p class="text-2xl font-black">₹${p.price}</p>
                            <div class="stylist-lens-box text-sm">"${p.sentiment}"</div>
                            <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-4 rounded-2xl font-black uppercase text-xs">Buy on ${p.brand}</button>
                            <button onclick="closeDetails()" class="w-full text-white/30 text-[10px] uppercase font-bold tracking-widest">Close</button>
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }

        window.onload = () => { renderProducts(allDatabase); };
    </script>
</body>
</html>
