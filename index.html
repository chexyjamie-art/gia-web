<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Professional Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: #04241a;
            background-image: radial-gradient(circle at 2px 2px, rgba(191,149,63,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            font-family: 'Inter', sans-serif; color: white; min-height: 100vh; overflow-x: hidden;
        }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        
        /* Full Screen Overlays */
        #auth-overlay, #welcome-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #04241a;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #welcome-overlay { display: none; background: rgba(4, 36, 26, 0.98); backdrop-filter: blur(20px); }

        .vault-card { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(191, 149, 63, 0.2);
            padding: 3rem 2rem; border-radius: 2.5rem; width: 90%; max-width: 450px;
        }
        .input-field {
            background: transparent; border-bottom: 1px solid rgba(191, 149, 63, 0.3);
            width: 100%; padding: 1rem 0; outline: none; text-align: center; margin-bottom: 2rem;
        }
        .btn-gold {
            background: linear-gradient(to right, #BF953F, #FCF6BA); color: black;
            width: 100%; py: 1rem; border-radius: 99px; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; padding: 12px;
        }

        /* Mobile Nav */
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
                background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px);
                border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
                padding: 1rem; justify-content: space-around;
            }
        }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <div id="auth-overlay">
        <div class="vault-card">
            <div class="flex justify-center mb-6">
                <i data-lucide="crown" class="w-12 h-12 text-[#BF953F]"></i>
            </div>
            <h1 class="royal-logo gold-text text-4xl mb-2">GIA</h1>
            <p class="text-[10px] tracking-[0.4em] text-white/40 mb-10 uppercase">Enter the Legacy</p>
            
            <div id="phone-step">
                <p class="text-[10px] gold-text uppercase font-bold mb-2">Full Name</p>
                <input type="text" id="user-name" placeholder="John Doe" class="input-field">
                <p class="text-[10px] gold-text uppercase font-bold mb-2">Mobile Number</p>
                <input type="tel" id="user-phone" placeholder="+91 00000 00000" class="input-field">
                <button onclick="requestOTP()" class="btn-gold">Join the Vault</button>
            </div>

            <div id="otp-step" class="hidden">
                <p class="text-[10px] gold-text uppercase font-bold mb-2">Verification Code</p>
                <input type="number" id="otp-input" placeholder="0 0 0 0" class="input-field tracking-[1em]">
                <button onclick="verifyOTP()" class="btn-gold">Verify Access</button>
            </div>
            
            <p class="mt-8 text-[9px] text-white/20 tracking-widest uppercase">Est. 2026 • Exclusive Membership</p>
        </div>
    </div>

    <div id="welcome-overlay">
        <div class="text-center">
            <div class="w-24 h-24 bg-[#BF953F] rounded-full flex items-center justify-center mx-auto mb-8 shadow-[0_0_50px_rgba(191,149,63,0.3)]">
                <i data-lucide="crown" class="w-12 h-12 text-black"></i>
            </div>
            <h2 class="text-5xl royal-logo gold-text mb-2">Welcome</h2>
            <p class="text-white/40 tracking-[0.3em] uppercase mb-8">To the Vault</p>
            <div class="h-[1px] w-12 bg-[#BF953F]/30 mx-auto mb-8"></div>
            <p class="text-xs text-white/60 leading-relaxed max-w-xs mx-auto">
                Your details have been secured in our legacy archives. We will be in touch shortly.
            </p>
        </div>
    </div>

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="relative"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span></div>
            <h1 class="text-2xl royal-logo gold-text">GIA LUXE</h1>
            <div class="w-10 h-10 border border-[#BF953F] rounded-full overflow-hidden p-0.5"><img id="profile-img" src="" class="w-full h-full rounded-full object-cover"></div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <h2 class="text-4xl md:text-6xl royal-logo gold-text text-center mb-16 italic uppercase">Welcome, <span id="display-name">Stylist</span></h2>
        
        <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-20">
            <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
            <input type="text" placeholder="Search Style or Beauty..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
            <i data-lucide="camera" class="mr-4 text-[#BF953F] w-5 h-5 cursor-pointer"></i>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8" id="product-grid">
            </div>
    </main>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold">HOME</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold">SEARCH</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold">COMBOS</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold">PROFILE</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        // 1. Logic for Login Flow
        function requestOTP() {
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            if(!name || !phone) return alert("Please fill details");
            
            localStorage.setItem('giaUserName', name);
            localStorage.setItem('giaUserPhone', phone); // Save phone for profile automatically
            
            document.getElementById('phone-step').classList.add('hidden');
            document.getElementById('otp-step').classList.remove('hidden');
        }

        function verifyOTP() {
            const otp = document.getElementById('otp-input').value;
            if(otp === "1234") { // Temporary Static OTP
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('welcome-overlay').style.display = 'flex';
                
                // Show Welcome for 3 seconds, then go home
                setTimeout(() => {
                    document.getElementById('welcome-overlay').style.display = 'none';
                    initHome();
                }, 3000);
            } else {
                alert("Incorrect OTP! Try 1234");
            }
        }

        function initHome() {
            const name = localStorage.getItem('giaUserName');
            document.getElementById('display-name').innerText = name;
            document.getElementById('profile-img').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
        }

        // Check if already logged in
        window.onload = () => {
            if(localStorage.getItem('giaUserName')) {
                document.getElementById('auth-overlay').style.display = 'none';
                initHome();
            }
        };
    </script>
</body>
</html>
