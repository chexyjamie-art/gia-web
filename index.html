<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="menu-left" onclick="openMenu()">☰ Menu</div>

  <div class="header-right">
    <span class="notif">🔔 Notifications</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>
</header>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#" onclick="toggleWishlist()">Wishlist</a>
</div>

<!-- HOME WISHLIST DRAWER -->
<div id="homeWishlist" class="home-wishlist">
  <h3>❤️ Wishlist</h3>
  <div id="homeWishlistItems"></div>
</div>

<!-- CENTER SEARCH -->
<div class="center">
  <div class="search-box premium-glow">
    <input type="text" placeholder="Ask AI anything...">
  </div>

  <h1 class="hero-title">Curated luxury for you, Rahul</h1>
  <p class="hero-sub">Smart choices recommended by AI</p>
</div>

<!-- TRENDING PRODUCTS -->
<section class="ai-picks">
  <h2 class="ai-title">Trending Products</h2>

  <div class="horizontal-scroll">
    <div class="ai-card">
      <img src="https://via.placeholder.com/220">
      <h3>Luxury Watch</h3>
      <button onclick="addToWishlist('Luxury Watch')">❤️ Wishlist</button>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="ai-card">
      <img src="https://via.placeholder.com/220">
      <h3>Premium Sneakers</h3>
      <button onclick="addToWishlist('Premium Sneakers')">❤️ Wishlist</button>
      <button class="buy-btn">Buy Now</button>
    </div>
  </div>

  <!-- COMBO CARD -->
  <div class="combo-card">
    <img src="https://via.placeholder.com/500x220">
    <h3>🔥 Smart Combo Deal</h3>
    <p>Best value picked by AI</p>
    <button class="buy-btn">Buy Combo</button>
  </div>
</section>

<footer class="footer">
  <a href="terms.html">Terms</a> |
  <a href="privacy.html">Privacy</a> |
  <a href="policy.html">Policy</a>
</footer>

<script src="app.js"></script>
</body>
</html>
