<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="menu-left" onclick="openMenu()">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>
</header>

<!-- ================= SIDE MENU ================= -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>

  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#">Wishlist</a>
  <a href="#">Settings</a>
</div>

<!-- ================= WAVE AREA ================= -->
<div class="wave-wrapper">
  <div class="wave-left"></div>
  <div class="wave-right"></div>
</div>

<!-- ================= CENTER SEARCH ================= -->
<div class="center">

  <div class="search-box">
    <input type="text" placeholder="Luxury skincare for glowing skin?">
    <div class="mini-wave"></div>
  </div>

  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<!-- ================= JS ================= -->
<script>
function openProfile(){
  window.location.href = "profile.html";
}

function goWishlist(){
  alert("Wishlist page coming next");
}

function openMenu(){
  document.getElementById("sideMenu").style.width = "250px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width = "0";
}
</script>

</body>
</html>
