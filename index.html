<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="menu">☰</div>

  <div class="right-section">
    <img src="https://i.pravatar.cc/40" class="profile-pic">
    <span>Wishlist</span>
    <span>Notifications</span>
  </div>
</header>

<div class="center-area">

  <!-- LEFT WAVE -->
  <img src="wave.png" class="wave left-wave">

  <!-- SEARCH BAR -->
  <div class="search-container">
    <div class="search-icons">
      <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png">
      <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" onclick="voiceSearch()">
      <label>
        <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png">
        <input type="file" hidden>
      </label>
    </div>

    <input type="text" placeholder="Ask AI anything...">
  </div>

  <!-- RIGHT WAVE -->
  <img src="wave.png" class="wave right-wave">

</div>

<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script src="script.js"></script>
</body>
</html>
