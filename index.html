<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }

        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* SMOOTH SUMMONING ANIMATION */
        .summon-effect { animation: summon 1.2s ease-out forwards; }
        @keyframes summon {
            from { opacity: 0; transform: translateY(10px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* FULL SCREEN OVERLAYS */
        #auth-overlay, #welcome-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #04241a;
            display: flex; align-items: center; justify-content: center; text-align: center;
            transition: 0.8s ease-in-out;
        }

        .vault-card { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(191, 149, 63, 0.2);
            padding: 3rem 2rem; border-radius: 2.5rem; width: 90%; max-width: 450px;
            backdrop-filter: blur(20px);
        }

        .input-luxe {
            background: transparent; border-bottom: 1px solid rgba(191, 149, 63, 0.3);
            width: 100%; padding: 1rem 0; outline: none; text-align: center; margin-bottom: 1.5rem; color: white;
        }

        .btn-gold-luxe {
            background: linear-gradient(to right, #BF953F, #FCF6BA); color: black;
            width: 100%; padding: 14px; border-radius: 99px; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
        }

        /* EXISTING STYLES PRESERVED */
        .product-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border-radius: 1.5rem; transition: 0.3s; border: 1px solid rgba(191, 149, 63, 0.1); cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); border: 1px solid #BF953F; }

        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
                background: rgba(4, 36, 26, 0.9); backdrop-filter: blur(20px);
                border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
                padding: 1rem; justify-content: space-around;
            }
        }

        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 500; display: none; overflow-y: auto; padding: 2rem 0; backdrop-filter: blur(15px); }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 10px; }
        .price-table td, .price-table th { border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: left; }
        .sentiment-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
        .sentiment-fill { height: 100%; background: #BF953F; }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <div id="auth-overlay">
        <div class="vault-card summon-effect">
            <i data-lucide="shield-check" class="w-12 h-12 text-[#BF953F] mx-auto mb-6"></i>
            <h1 class="royal-logo gold-text text-3xl mb-2">The Vault</h1>
            <p class="text-[9px] tracking-[0.4em] text-white/30 mb-10 uppercase">Secure Legacy Access</p>
            
            <div id="auth-step-1">
                <input type="text" id="login-name" placeholder="YOUR NAME" class="input-luxe">
                <input type="tel" id="login-phone" placeholder="MOBILE NUMBER" class="input-luxe">
                <button onclick="goToOTP()" class="btn-gold-luxe">Request Access</button>
            </div>

            <div id="auth-step-2" class="hidden">
                <p class="text-[10px] gold-text mb-4 uppercase">Enter OTP sent to phone</p>
                <input type="number" id="login-otp" placeholder="0 0 0 0" class="input-luxe tracking-[1em]">
                <button onclick="verifyAndWelcome()" class="btn-gold-luxe">Verify Identity</button>
            </div>
        </div>
    </div>

    <div id="welcome-overlay" style="display: none; opacity: 0;">
        <div class="text-center summon-effect">
            <div class="w-20 h-20 border-2 border-[#BF953F] rounded-full flex items-center justify-center mx-auto mb-8">
                <i data-lucide="crown" class="w-10 h-10 text-[#BF953F]"></i>
            </div>
            <h2 class="text-5xl royal-logo gold-text mb-4">Welcome</h2>
            <p id="welcome-user" class="text-xl italic text-white/80 mb-2">Stylist</p>
            <p class="text-[10px] tracking-[0.5em] text-white/30 uppercase">To the Luxe Archives</p>
        </div>
    </div>

    <div id="main-site-content" style="display: none;">
        <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
            <nav class="max-w-7xl mx-auto flex justify-between items-center">
                <a href="offers.html" class="relative p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]">
                    <i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i>
                    <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-600 rounded-full border-2 border-[#04241a] animate-pulse"></span>
                </a>
                <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="location.reload()">GIA LUXE</h1>
                <div class="flex items-center gap-3">
                    <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden">
                        <img id="user-avatar" src="" class="w-full h-full rounded-full object-cover">
                    </a>
                </div>
            </nav>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-12">
            <section class="text-center mb-16 summon-effect">
                <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-4 italic">Curation for <span id="hero-user-name">You</span></h2>
                <p class="text-[10px] tracking-[0.3em] text-white/40 uppercase mb-8">GIA has analyzed your style profile for 2026</p>
                <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl">
                    <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                    <input type="text" id="ai-search-input" placeholder="Search Style or Beauty..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                    <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                    <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2">
                        <i data-lucide="camera" class="w-4 h-4"></i> <span class="hidden sm:inline">Visual AI</span>
                    </button>
                    <input type="file" id="image-upload" class="hidden">
                </div>
            </section>

            <section class="mb-20">
                <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Intel Grid</h3>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
            </section>

            <section id="combo-area" class="mb-20">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F]">GIA Suggested Bundle</h3>
                    <a href="combos.html" class="text-[10px] gold-text font-bold uppercase tracking-widest border-b border-[#BF953F] pb-1">View More Combos</a>
                </div>
                <div id="dynamic-combo-card" class="p-10 rounded-[2.5rem] bg-white/[0.03] border border-white/10 backdrop-blur-3xl"></div>
            </section>
        </main>
    </div>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="document.getElementById('ai-search-input').focus()" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Search</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span>
        </button>
    </nav>

    <div id="details-modal">
        <div class="max-w-4xl mx-auto px-6 relative"> 
            <button onclick="closeDetails()" class="fixed top-8 right-8 text-white/40 hover:text-white z-50"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. AUTH LOGIC
        function goToOTP() {
            const name = document.getElementById('login-name').value;
            const phone = document.getElementById('login-phone').value;
            if(name && phone) {
                localStorage.setItem('giaUserName', name);
                localStorage.setItem('giaUserPhone', phone);
                document.getElementById('auth-step-1').classList.add('hidden');
                document.getElementById('auth-step-2').classList.remove('hidden');
            } else { alert("Bhai, details toh daalo!"); }
        }

        function verifyAndWelcome() {
            const otp = document.getElementById('login-otp').value;
            if(otp === "1234") { // Demo OTP
                const name = localStorage.getItem('giaUserName');
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('welcome-overlay').style.display = 'flex';
                    document.getElementById('welcome-overlay').style.opacity = '1';
                    document.getElementById('welcome-user').innerText = name;
                    
                    setTimeout(() => {
                        document.getElementById('welcome-overlay').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('welcome-overlay').style.display = 'none';
                            showMainSite();
                        }, 800);
                    }, 2500);
                }, 800);
            } else { alert("OTP galat hai! (Hint: 1234)"); }
        }

        function showMainSite() {
            const mainContent = document.getElementById('main-site-content');
            mainContent.style.display = 'block';
            mainContent.classList.add('summon-effect');
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
        }

        // 2. PRODUCT DATA & RENDERING
        const allDatabase = [
            { id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", matchScore: 98, returns: "Low", rating: "4.8", pos: 85, neg: 15, sentiment: "Logon ne kaha ki kapda bohot breathable hai.", whyGia: "Price segment mein sabse best-rated hai.", history: [["Last Month", "₹2,699"], ["Today", "₹2,499"]], img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600" }
        ];

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-6" onclick="openDetails(${p.id})">
                    <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl mb-4">
                    <h4 class="text-sm font-bold text-white/80">${p.name}</h4>
                    <p class="text-xl font-black mt-2">₹${p.price}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="bg-[#04241a] rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl flex flex-col md:flex-row">
                    <div class="w-full md:w-1/2 relative h-[400px] md:h-auto"><img src="${p.img}" class="w-full h-full object-cover"></div>
                    <div class="w-full md:w-1/2 p-8 md:p-12">
                        <h2 class="text-3xl royal-logo gold-text italic mb-4">${p.name}</h2>
                        <div class="mb-8 p-5 bg-white/5 rounded-2xl border border-white/10">
                            <p class="text-[10px] gold-text font-black uppercase mb-3">Review Score: ${p.matchScore}%</p>
                            <div class="sentiment-bar"><div class="sentiment-fill" style="width: ${p.pos}%"></div></div>
                        </div>
                        <p class="text-xs text-white/60 mb-8">${p.whyGia}</p>
                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-4 rounded-full font-black uppercase text-xs tracking-widest">Buy on Amazon</button>
                    </div>
                </div>`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }

        // CHECK LOGIN ON LOAD
        window.onload = () => {
            if(localStorage.getItem('giaUserName')) {
                document.getElementById('auth-overlay').style.display = 'none';
                showMainSite();
            }
        };
    </script>
</body>
</html>
