<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }

        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* PRODUCT CARDS */
        .product-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border-radius: 1.5rem; transition: 0.3s; border: 1px solid rgba(191, 149, 63, 0.1); cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); border: 1px solid #BF953F; }

        /* MOBILE NAV - Hidden on Desktop */
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
                background: rgba(4, 36, 26, 0.9); backdrop-filter: blur(20px);
                border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
                padding: 1rem; justify-content: space-around;
            }
        }

        /* MODAL & TABLES */
        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 500; display: none; overflow-y: auto; padding: 2rem 0; backdrop-filter: blur(15px); }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 10px; }
        .price-table td, .price-table th { border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: left; }
        
        .sentiment-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
        .sentiment-fill { height: 100%; background: #BF953F; }

        .mic-active { color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
</head>
<body class="pb-24 md:pb-0"> <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="offers.html" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]">
                <i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i>
            </a>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <div class="flex items-center gap-3">
                <p id="header-user-name" class="text-[9px] font-bold gold-text tracking-widest uppercase hidden sm:block">Loading...</p>
                <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden">
                    <img id="user-avatar" src="" class="w-full h-full rounded-full object-cover">
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Search Style or Beauty..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2">
                    <i data-lucide="camera" class="w-4 h-4"></i> <span class="hidden sm:inline">Visual AI</span>
                </button>
                <input type="file" id="image-upload" class="hidden" onchange="alert('GIA is analyzing your photo...')">
            </div>
        </section>

        <section class="mb-20">
            <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Intel Grid</h3>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <section id="combo-area" class="mb-20">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F]">GIA Suggested Bundle</h3>
                <a href="combos.html" id="view-more-btn" class="text-[10px] gold-text font-bold uppercase tracking-widest border-b border-[#BF953F] pb-1">View More Combos</a>
            </div>
            <div id="dynamic-combo-card" class="p-10 rounded-[2.5rem] bg-white/[0.03] border border-white/10 backdrop-blur-3xl"></div>
        </section>
    </main>

    <div id="details-modal">
        <div class="max-w-4xl mx-auto px-6 relative"> <button onclick="closeDetails()" class="fixed top-8 right-8 text-white/40 hover:text-white z-50"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <nav class="mobile-nav">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="document.getElementById('ai-search-input').focus()" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Search</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span>
        </button>
    </nav>

    <footer class="py-16 text-center border-t border-white/5">
        <h2 class="royal-logo gold-text text-xl italic mb-4">GIA LUXE</h2>
        <p class="text-[10px] text-white/30 italic max-w-lg mx-auto px-6">
            Disclaimer: GIA LUXE is an AI-driven curation platform. As an Amazon Associate, we earn from qualifying purchases. Prices and availability are accurate at the time of analysis.
        </p>
    </footer>

    <script>
        lucide.createIcons();

        // Extended Database with Review Intel
        const allDatabase = [
            { 
                id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", 
                matchScore: 98, returns: "Low", rating: "4.8", seller: "Premium",
                positiveReviews: 85, negativeReviews: 15,
                mainSentiment: "Logon ne kaha ki kapda bohot breathable hai aur color luxury feel deta hai.",
                whyGia: "Iska score isliye high hai kyunki ye 100% organic linen hai aur price segment mein sabse best-rated hai.",
                priceHistory: [["Last Month", "₹2,699"], ["Today", "₹2,499"], ["Deal", "₹2,299"]],
                img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600" 
            },
            { 
                id: 101, category: 'beauty', name: "Salicylic Face Wash", price: "499", 
                matchScore: 92, returns: "Very Low", rating: "4.9", seller: "Verified",
                positiveReviews: 94, negativeReviews: 6,
                mainSentiment: "Majority customers ko 1 week mein results dikhe. Oily skin ke liye 10/10.",
                whyGia: "Dermatologically tested aur paraben-free hone ki wajah se GIA isse rank 1 deti hai.",
                priceHistory: [["Last Month", "₹550"], ["Today", "₹499"], ["Deal", "₹475"]],
                img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600" 
            }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('header-user-name').innerText = name;
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-6" onclick="openDetails(${p.id})">
                    <div class="relative mb-4">
                        <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl">
                        <div class="absolute top-2 right-2 bg-black/60 px-2 py-1 rounded text-[8px] gold-text font-bold border border-[#BF953F]/30">${p.matchScore}% INTEL</div>
                    </div>
                    <h4 class="text-sm font-bold text-white/80">${p.name}</h4>
                    <p class="text-xl font-black mt-2">₹${p.price}</p>
                </div>
            `).join('');
            
            if(data.length < allDatabase.length && data.length > 0) {
                updateDynamicCombo(data[0]);
            } else {
                showDefaultCombo();
            }
            lucide.createIcons();
        }

        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="bg-[#04241a] rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl flex flex-col md:flex-row">
                    <div class="w-full md:w-1/2 relative h-[400px] md:h-auto">
                        <img src="${p.img}" class="w-full h-full object-cover">
                        <div class="absolute top-6 left-6 bg-black/80 backdrop-blur-md p-4 rounded-2xl border border-[#BF953F]/30">
                            <p class="text-[10px] gold-text font-black mb-1">GIA CONFIDENCE SCORE</p>
                            <p class="text-3xl font-black">${p.matchScore}<span class="text-sm">%</span></p>
                        </div>
                    </div>

                    <div class="w-full md:w-1/2 p-8 md:p-12 overflow-y-auto">
                        <h2 class="text-3xl royal-logo gold-text italic mb-4">${p.name}</h2>
                        <p class="text-2xl font-bold mb-8">₹${p.price}</p>

                        <div class="mb-8 p-5 bg-white/5 rounded-2xl border border-white/10">
                            <p class="text-[10px] gold-text font-black uppercase mb-3 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-3 h-3"></i> Majority Review Summary</p>
                            <p class="text-sm italic text-white/80 mb-4">"${p.mainSentiment}"</p>
                            <div class="flex justify-between text-[10px] mb-1">
                                <span>Positive (${p.positiveReviews}%)</span>
                                <span>Negative (${p.negativeReviews}%)</span>
                            </div>
                            <div class="sentiment-bar">
                                <div class="sentiment-fill" style="width: ${p.positiveReviews}%"></div>
                            </div>
                        </div>

                        <div class="mb-8 border-l-2 border-[#BF953F] pl-4">
                            <p class="text-[10px] gold-text font-black uppercase mb-1">Why GIA Recommends This?</p>
                            <p class="text-xs text-white/60 leading-relaxed">${p.whyGia}</p>
                        </div>

                        <div class="mb-10">
                            <p class="text-[10px] text-white/40 uppercase font-bold mb-2">Price Intel</p>
                            <table class="price-table">
                                <tr>${p.priceHistory.map(h => `<th>${h[0]}</th>`).join('')}</tr>
                                <tr>${p.priceHistory.map(h => `<td>${h[1]}</td>`).join('')}</tr>
                            </table>
                        </div>

                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-5 rounded-full font-black uppercase text-[12px] tracking-widest shadow-xl">Purchase on Amazon</button>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        // Logic for search & combos (Remains same as previous stable version)
        function showDefaultCombo() { /* ... same as previous ... */ }
        function updateDynamicCombo(product) { /* ... same as previous ... */ }
        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        
        document.getElementById('ai-search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allDatabase.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderProducts(filtered);
        });

        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'en-US';
            rec.onstart = () => document.querySelector('#mic-btn i').classList.add('mic-active');
            rec.onresult = (e) => {
                document.getElementById('ai-search-input').value = e.results[0][0].transcript;
                document.getElementById('ai-search-input').dispatchEvent(new Event('input'));
                document.querySelector('#mic-btn i').classList.remove('mic-active');
            };
            rec.start();
        }
    </script>
</body>
</html>
