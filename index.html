<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA | Smart AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        h1, h2, .font-serif { font-family: 'Playfair Display', serif; }

        .search-wrapper { margin-top: 28vh; margin-bottom: 8vh; }

        .reveal-section { animation: slideUp 0.8s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #success-screen {
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.95);
            z-index: 300; align-items: center; justify-content: center; backdrop-filter: blur(15px);
        }
        .pop-in { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* NEW: Check Availability Animation */
        @keyframes checkIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .check-tick { animation: checkIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-white text-black overflow-x-hidden">

    <nav class="fixed top-0 left-0 w-full px-6 py-4 flex justify-between items-center z-[100] bg-white/80 backdrop-blur-md border-b border-gray-50">
        <button class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div class="text-xl font-bold tracking-[0.3em] pl-10">GIA</div>
        <div class="flex items-center gap-6">
            <button class="hidden md:block text-[10px] font-bold uppercase tracking-widest text-gray-400 hover:text-black transition-colors">Notifications</button>
            <button class="relative p-2 hover:bg-gray-100 rounded-xl transition-colors">
                <i data-lucide="heart" class="w-5 h-5 text-gray-600"></i>
                <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
            </button>
            <div class="w-10 h-10 rounded-full bg-gray-100 border border-gray-200 overflow-hidden shadow-sm cursor-pointer hover:ring-2 ring-blue-100 transition-all">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" alt="Profile">
            </div>
        </div>
    </nav>

    <div id="success-screen">
        <div class="text-center pop-in">
            <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-white text-4xl mx-auto mb-4 shadow-xl shadow-green-100">✓</div>
            <h2 class="text-2xl font-bold italic font-serif">Excellent Choice, Rahul!</h2>
            <p class="text-gray-500 text-sm mt-1">GIA has updated your preferences.</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 md:px-6">
        
        <div class="search-wrapper relative max-w-2xl mx-auto">
            <div class="relative group">
                <input type="text" id="gia-search-input" onkeypress="if(event.key==='Enter') updateGIACombo(this.value)" placeholder="Search luxury or ask GIA..." 
                    class="w-full bg-white border border-gray-100 shadow-[0_20px_50px_rgba(0,0,0,0.06)] py-5 px-8 pr-32 rounded-[2rem] focus:outline-none focus:ring-2 ring-blue-50 transition-all text-sm md:text-base">
                <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-4">
                    <button onclick="document.getElementById('photo-input').click()" class="text-gray-400 hover:text-black transition-colors p-1"><i data-lucide="camera" class="w-5 h-5"></i></button>
                    <button id="gia-voice-btn" onclick="listenForResponse()" class="bg-black text-white p-2.5 rounded-2xl hover:scale-110 active:scale-95 transition-all shadow-lg"><i data-lucide="mic" class="w-5 h-5"></i></button>
                </div>
            </div>
            <input type="file" id="photo-input" class="hidden" accept="image/*">
        </div>

        <section class="mb-12 reveal-section">
            <h2 class="text-[10px] font-bold tracking-[0.2em] uppercase text-gray-400 mb-6 px-2">Top Selections</h2>
            
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10">
                <div onclick="updateGIACombo('sunscreen')" class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm hover:shadow-xl transition-all cursor-pointer text-center group">
                    <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?w=200" class="w-20 h-20 mx-auto object-contain mb-3 group-hover:scale-110 transition-transform">
                    <h4 class="text-[10px] font-bold truncate">Matte Sunscreen</h4>
                    <p class="text-xs font-black text-blue-600 mt-1">₹599</p>
                </div>
                <div onclick="updateGIACombo('shirt')" class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm hover:shadow-xl transition-all cursor-pointer text-center group">
                    <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=200" class="w-20 h-20 mx-auto object-contain mb-3 group-hover:scale-110 transition-transform">
                    <h4 class="text-[10px] font-bold truncate">Linen Shirt</h4>
                    <p class="text-xs font-black text-blue-600 mt-1">₹1,899</p>
                </div>
                </div>

            <div id="gia-combo-card" class="glass-card rounded-[2.5rem] p-6 md:p-10 border border-blue-50 relative overflow-hidden shadow-2xl bg-white/90">
                <div class="flex flex-col lg:flex-row gap-10 items-center">
                    
                    <div id="combo-items-container" class="flex items-center gap-4 overflow-x-auto no-scrollbar py-6 min-w-[65%]">
                        <div class="text-gray-400 italic text-sm">Tap a product above to see GIA's Combo...</div>
                    </div>

                    <div class="w-full lg:w-1/3 border-t lg:border-t-0 lg:border-l border-gray-100 pt-8 lg:pt-0 lg:pl-10">
                        <div class="flex justify-between items-start mb-4">
                            <h3 id="combo-name" class="text-2xl font-bold italic font-serif text-black leading-tight">Smart Set</h3>
                            <div class="text-right">
                                <span class="text-[8px] font-bold text-blue-600 uppercase">Score</span>
                                <div id="combo-score" class="text-2xl font-black italic">--</div>
                            </div>
                        </div>
                        <p id="combo-reasoning" class="text-gray-500 text-[11px] leading-relaxed mb-8">GIA analysis will appear here.</p>
                        
                        <div class="bg-gray-50 p-5 rounded-[2rem] flex items-center justify-between border border-gray-50">
                            <div>
                                <p class="text-[8px] text-gray-400 font-bold uppercase tracking-widest">Total Bundle</p>
                                <p id="combo-total" class="text-xl font-black text-black">₹0</p>
                            </div>
                            <button onclick="triggerSuccess()" class="bg-black text-white px-8 py-4 rounded-2xl text-[10px] font-bold shadow-lg hover:scale-105 transition-all">Buy Full Set</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="gia-similar-section" class="hidden mb-12 reveal-section"></section>
        <section id="gia-3d-section" class="hidden mb-12 reveal-section">
            <div class="glass-card rounded-[2.5rem] md:rounded-[4rem] p-8 md:p-12 flex flex-col items-center border border-gray-50 min-h-[400px]">
                <div id="product-3d-container" class="w-64 md:w-80 cursor-grab">
                    <img src="https://images.unsplash.com/photo-1547996160-81dfa63595dd?w=600" id="floating-product" class="w-full drop-shadow-2xl transition-transform duration-75">
                </div>
                <h3 class="text-xl font-medium mt-8 italic">Royal Oak Gold Concept (360°)</h3>
            </div>
        </section>
    </main>

    <div id="gia-modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-xl z-[200] hidden items-center justify-center p-4" onclick="closeTruthModal()">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl pop-in" onclick="event.stopPropagation()">
            </div>
    </div>

    <div id="gia-aura-container" class="fixed bottom-6 right-4 z-[100] flex flex-col items-end">
        <div id="gia-chat-bubble" class="hidden w-[85vw] md:w-80 bg-black text-white p-6 rounded-[2rem] shadow-2xl mb-4 border border-white/10">
            <p id="gia-chat-text" class="text-xs md:text-sm leading-relaxed italic"></p>
        </div>
        <button id="aura-trigger" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-black shadow-2xl flex items-center justify-center text-xl md:text-2xl active:scale-90 transition shadow-blue-500/20">✨</button>
    </div>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
