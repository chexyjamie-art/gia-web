<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 2rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden; height: auto; display: flex; flex-direction: column; cursor: pointer;
        }
        .product-card:hover { transform: translateY(-10px); border: 1px solid #BF953F; box-shadow: 0 0 30px rgba(191, 149, 63, 0.2); }

        .score-badge {
            position: absolute; top: 15px; left: 15px;
            background: linear-gradient(45deg, #BF953F, #FCF6BA);
            color: black; font-weight: 900; padding: 4px 10px;
            border-radius: 10px; font-size: 10px; z-index: 20;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }

        .stylist-lens-box { border-left: 3px solid #BF953F; background: rgba(191, 149, 63, 0.08); border-radius: 0 1.5rem 1.5rem 0; padding: 1.5rem; font-style: italic; }
        .gia-insight-panel { background: rgba(191, 149, 63, 0.05); border: 1px dashed rgba(191, 149, 63, 0.3); border-radius: 1.5rem; animation: fadeIn 0.8s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .mic-active { color: #ef4444 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); z-index: 2000; display: none; overflow-y: auto; backdrop-filter: blur(25px); }
        
        /* 360 & Try-On Animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 12s linear infinite; }
        .mix-blend-multiply { mix-blend-mode: multiply; }

        .mobile-nav { 
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
            padding: 1rem; justify-content: space-around;
        }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="offers.html" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i></a>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <div class="flex items-center gap-3">
                <p id="header-user-name" class="text-[9px] font-bold gold-text tracking-widest uppercase hidden sm:block">Loading...</p>
                <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden"><img id="user-avatar" src="" class="w-full h-full rounded-full object-cover"></a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center mb-10">
            <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-6">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Bhai, kya dhund rahe ho?" class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button id="mic-btn" onclick="startVoiceSearch()" class="p-2.5 hover:bg-white/5 rounded-full"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2"><i data-lucide="camera" class="w-4 h-4"></i></button>
                <input type="file" id="image-upload" class="hidden">
            </div>

            <div id="gia-ai-box" class="max-w-2xl mx-auto gia-insight-panel p-6 text-left hidden">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-2 h-2 rounded-full bg-[#BF953F] animate-ping"></div>
                    <span class="text-[10px] uppercase font-black tracking-widest text-[#BF953F]">GIA Personal Stylist</span>
                </div>
                <p id="gia-ai-text" class="text-sm italic text-white/80 leading-relaxed font-light"></p>
            </div>
        </section>

        <section class="mb-20">
            <h3 class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Curated Picks</h3>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <div id="details-modal">
        <div class="flex min-h-screen items-center justify-center p-4">
            <div id="modal-content" class="w-full max-w-6xl"></div>
        </div>
    </div>

    <nav class="mobile-nav">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span>
        </button>
    </nav>

    <footer class="py-16 text-center border-t border-white/5">
        <h2 class="royal-logo gold-text text-xl italic mb-4">GIA LUXE</h2>
        <p class="text-[8px] text-[#BF953F]/60 uppercase tracking-[0.3em] font-bold">© 2026 ALTER PROJECT | LEGAL DISCLAIMER: AI-Generated Advice. Verified by GIA.</p>
    </footer>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI"; 
        
        const allDatabase = [
            { id: 1, brand: 'Amazon', category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", match: "98.4", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", sentiment: "Bhai ye color elite vibe deta hai, summer parties ke liye aag hai!", material: "100% Irish Linen", colors: "Emerald, White" },
            { id: 101, brand: 'Myntra', category: 'beauty', name: "Salicylic Face Wash", price: "499", match: "95.2", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600", sentiment: "Pimples ke liye sabse effective cleanser.", material: "Dermatologically Tested", colors: "Clear Gel" },
            { id: 2, brand: 'Ajio', category: 'fashion', name: "Charcoal Chinos", price: "1,899", match: "94.2", img: "https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=600", sentiment: "Durable aur comfortable chinos.", material: "Stretch Cotton", colors: "Charcoal, Black" },
            { id: 201, brand: 'Amazon', category: 'tech', name: "ANC Earbuds Pro", price: "4,499", match: "92.8", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600", sentiment: "Gym aur travel ke liye perfect choice.", material: "Hybrid ANC", colors: "Space Gray" }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('header-user-name').innerText = name;
            document.getElementById('hero-user-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(allDatabase);
            lucide.createIcons();
        };

        // --- 1. VIRTUAL TRY-ON LOGIC ---
        async function startVirtualTryOn(productId) {
            const p = allDatabase.find(x => x.id === productId);
            const uploadInput = document.getElementById('user-photo-upload');
            const displayArea = document.getElementById('try-on-display-area');
            
            if (!uploadInput.files[0]) return;

            displayArea.innerHTML = `<div class="flex flex-col items-center justify-center h-full"><div class="w-10 h-10 border-4 border-[#BF953F] border-t-transparent rounded-full animate-spin mb-4"></div><p class="text-[8px] gold-text font-black uppercase animate-pulse">Mapping Body...</p></div>`;

            setTimeout(() => {
                const userImgURL = URL.createObjectURL(uploadInput.files[0]);
                displayArea.innerHTML = `
                    <div class="relative h-full w-full rounded-[2rem] overflow-hidden group">
                        <img src="${userImgURL}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <img src="${p.img}" class="w-[85%] opacity-85 mix-blend-multiply transform translate-y-6 scale-125 transition-all duration-1000 group-hover:scale-110">
                        </div>
                        <div class="absolute top-4 left-4 bg-black/70 px-3 py-1 rounded-full text-[7px] gold-text font-black">AI VIRTUAL TWIN</div>
                    </div>`;
                lucide.createIcons();
            }, 2500);
        }

        // --- 2. PRODUCT RENDER ---
        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-6" onclick="openDetails(${p.id})">
                    <div class="score-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match}% MATCH</div>
                    <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl mb-4">
                    <h4 class="text-sm font-bold text-white/80">${p.name}</h4>
                    <p class="text-xl font-black gold-text mt-2">₹${p.price}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- 3. PREMIUM WHITE SCORE PAGE ---
        function openScorePage(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="bg-white text-[#04241a] rounded-[3rem] p-8 max-w-lg mx-auto shadow-2xl relative text-left">
                    <button onclick="closeDetails()" class="absolute top-8 right-8 bg-gray-100 p-2 rounded-full text-black"><i data-lucide="x" class="w-4 h-4"></i></button>
                    <div class="flex items-center gap-2 mb-6"><span class="bg-black text-white text-[8px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest">Verified by GIA AI</span></div>
                    <h2 class="text-3xl font-black royal-logo mb-8 text-black italic">${p.name}</h2>
                    <div class="bg-[#f8fbff] border border-[#eef5ff] rounded-[2rem] p-6 mb-6">
                        <div class="flex justify-between items-center mb-8"><h4 class="text-[10px] font-black text-[#2b5ba1] uppercase">Price Analysis</h4><span class="text-[9px] font-bold text-[#2b5ba1]">30 Days</span></div>
                        <div class="flex items-end justify-between h-20 gap-3 mb-4">
                            <div class="flex-grow bg-[#dbeafe] rounded-lg h-[60%]"></div>
                            <div class="flex-grow bg-[#3b82f6] rounded-lg h-[85%] shadow-lg"></div>
                            <div class="flex-grow bg-[#dbeafe] rounded-lg h-[45%]"></div>
                        </div>
                        <div class="flex justify-between pt-4 border-t border-blue-50">
                            <div><p class="text-[8px] text-gray-400 font-bold uppercase">Signal</p><p class="text-[10px] font-black text-green-600">BEST PRICE</p></div>
                            <div class="text-right"><p class="text-[8px] text-gray-400 font-bold uppercase">Today</p><p class="text-[10px] font-black text-[#2b5ba1]">₹${p.price}</p></div>
                        </div>
                    </div>
                    <div class="bg-black text-white p-8 rounded-[2.5rem]">
                        <p class="text-[8px] font-black text-[#BF953F] uppercase tracking-[0.3em] mb-4">GIA Sentiment</p>
                        <p class="text-xs leading-relaxed italic font-light">"Bhai, ye item abhi buying range mein hai. GIA analysis ke hisab se legit deal hai. Bindass lelo!"</p>
                    </div>
                </div>`;
            modal.style.display = 'block';
            lucide.createIcons();
        }

        // --- 4. PRODUCT PAGE WITH TRY-ON STUDIO & NO PINCODE ---
        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            const combos = allDatabase.filter(x => x.id !== id).slice(0, 2);

            document.getElementById('modal-content').innerHTML = `
                <div class="bg-[#04241a] rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl max-w-6xl mx-auto">
                    <button onclick="closeDetails()" class="absolute top-8 right-8 text-white/40 hover:text-white z-[3000]"><i data-lucide="x"></i></button>
                    <div class="grid grid-cols-1 lg:grid-cols-3">
                        <div class="p-6 border-r border-white/5 space-y-4 text-center">
                            <div class="aspect-square bg-black/40 rounded-[2.5rem] overflow-hidden relative border border-white/5">
                                <img src="${p.img}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/10">
                                    <i data-lucide="rotate-cw" class="w-10 h-10 text-[#BF953F] animate-spin-slow mb-2"></i>
                                    <p class="text-[8px] font-black gold-text uppercase tracking-widest">360° AI View</p>
                                </div>
                            </div>
                            <div class="aspect-video bg-black/60 rounded-2xl flex items-center justify-center border border-white/5">
                                <i data-lucide="play" class="text-white/20 w-8 h-8"></i>
                                <p class="text-[8px] uppercase text-white/20 ml-2 font-bold">Reel Video</p>
                            </div>
                        </div>

                        <div class="p-6 bg-white/5 border-r border-white/5 text-center">
                            <h3 class="text-[10px] gold-text font-black uppercase tracking-[0.2em] mb-4">GIA Digital Twin</h3>
                            <div id="try-on-display-area" class="aspect-[3/4] bg-black/40 rounded-[2.5rem] border-2 border-dashed border-white/10 flex flex-col items-center justify-center p-6">
                                <i data-lucide="camera" class="w-10 h-10 text-white/10 mb-4"></i>
                                <p class="text-[10px] text-white/40 italic mb-6">"Bhai, apni photo daal aur dekh tere upar ye kaisa lagega."</p>
                                <input type="file" id="user-photo-upload" class="hidden" accept="image/*" onchange="startVirtualTryOn(${p.id})">
                                <button onclick="document.getElementById('user-photo-upload').click()" class="bg-white/10 text-white px-8 py-4 rounded-full text-[9px] font-black uppercase border border-white/10">Try it on, Bhai!</button>
                            </div>
                        </div>

                        <div class="p-8 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] text-[#BF953F] font-black uppercase tracking-widest">${p.brand} Selection</span>
                                <h2 class="text-4xl royal-logo gold-text my-4">${p.name}</h2>
                                <p class="text-3xl font-black italic mb-6">₹${p.price}</p>
                                <div class="stylist-lens-box text-xs italic text-white/80 mb-8">"${p.sentiment}"</div>
                            </div>

                            <div class="mb-8 p-4 bg-white/5 rounded-3xl border border-white/5">
                                <p class="text-[9px] font-black gold-text uppercase mb-4 tracking-widest">GIA Flash Match Combo</p>
                                <div class="flex gap-3">
                                    <img src="${p.img}" class="w-12 h-12 rounded-xl object-cover border border-[#BF953F]">
                                    ${combos.map(c => `<img src="${c.img}" class="w-12 h-12 rounded-xl object-cover opacity-40">`).join('')}
                                </div>
                                <button class="w-full mt-4 py-2 border border-[#BF953F]/20 rounded-xl text-[8px] font-bold gold-text uppercase">Unlock Full Combo</button>
                            </div>

                            <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-5 rounded-2xl font-black uppercase text-xs">Buy Now on ${p.brand}</button>
                        </div>
                    </div>
                </div>`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeDetails() {
            document.getElementById('details-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // --- 5. SEARCH & VOICE ---
        async function askGiaAI(query) {
            const aiBox = document.getElementById('gia-ai-box');
            const aiText = document.getElementById('gia-ai-text');
            aiBox.classList.remove('hidden');
            aiText.innerHTML = "<span class='animate-pulse text-[#BF953F]'>GIA soch rahi hai...</span>";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Tera naam GIA hai. Tu Rahul ki Best Friend aur Stylist hai. User ne pucha: "${query}". Desi doston wali chat kar 2 lines mein.` }] }] })
                });
                const data = await response.json();
                aiText.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) { aiText.innerText = "Signal weak hai bhai!"; }
        }

        document.getElementById('ai-search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if(query) {
                    askGiaAI(query);
                    renderProducts(allDatabase.filter(p => p.name.toLowerCase().includes(query.toLowerCase())));
                }
            }
        });

        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'en-US';
            rec.onstart = () => document.querySelector('#mic-btn i').classList.add('mic-active');
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('ai-search-input').value = text;
                askGiaAI(text);
                document.querySelector('#mic-btn i').classList.remove('mic-active');
            };
            rec.start();
        }
    </script>
</body>
</html>
