<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTER | Smart AI Stylist</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-main text-white font-sans overflow-x-hidden">

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <nav class="flex justify-between items-center p-6 backdrop-blur-md sticky top-0 z-50">
        <div class="text-2xl font-bold tracking-widest">ALTER</div>
        <div class="flex gap-6 items-center">
            <span class="cursor-pointer">Menu</span>
            <span class="cursor-pointer">Shop</span>
            <div class="w-10 h-10 rounded-full bg-gray-700 border border-white/20 overflow-hidden">
                <img src="https://via.placeholder.com/40" alt="User">
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-10">
        <div class="relative max-w-2xl mx-auto mb-16">
            <input type="text" placeholder="Search luxury skincare for glowing skin?" 
                   class="w-full bg-white/10 border border-white/20 backdrop-blur-xl py-4 px-12 rounded-full focus:outline-none focus:ring-2 ring-purple-500/50">
            <span class="absolute left-4 top-4 opacity-50">🔍</span>
        </div>

        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-light">Curated luxury for you, <span class="font-semibold text-gradient">Rahul</span></h1>
            <p class="text-gray-400 mt-2">Smart choices recommended by ALTER AI.</p>
        </div>

        <div class="flex gap-8 justify-center mb-12 overflow-x-auto pb-4 no-scrollbar text-sm uppercase tracking-widest opacity-70">
            <span class="border-b-2 border-white pb-1 cursor-pointer">Watches</span>
            <span class="hover:text-white cursor-pointer transition">Skincare</span>
            <span class="hover:text-white cursor-pointer transition">Electronics</span>
            <span class="hover:text-white cursor-pointer transition">Shoes</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="glass-card p-6 rounded-[2rem] border border-white/10 hover:border-white/30 transition duration-500">
                <div class="flex justify-between items-start mb-4">
                    <span class="bg-blue-500/20 text-blue-300 text-[10px] px-3 py-1 rounded-full border border-blue-500/30">✦ AI SELECTED</span>
                    <span class="text-gray-500 text-xs">Verified</span>
                </div>
                <div class="h-48 flex items-center justify-center mb-6">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" class="rounded-2xl drop-shadow-2xl">
                </div>
                <h3 class="text-lg font-medium">St. Fossil Grant Classic</h3>
                <p class="text-gray-400 text-sm mb-4">Chronograph, Brown Leather</p>
                <div class="flex justify-between items-center">
                    <span class="text-xl">₹47,495</span>
                    <button class="bg-white text-black px-6 py-2 rounded-full font-bold hover:bg-gray-200 transition">Buy Now</button>
                </div>
            </div>
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
