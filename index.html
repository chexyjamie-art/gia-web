<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="menu-left" onclick="openMenu()">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>

</header>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#">Wishlist</a>
</div>

<!-- CENTER -->
<div class="center">

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input type="text" placeholder="Ask AI anything...">

    <!-- ATTACHMENT ICON -->
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M16.5 6.5L8 15a3 3 0 104.2 4.2l7.3-7.3a5 5 0 10-7.1-7.1L4.8 12.4"
            stroke="black"
            stroke-width="1.5"
            fill="none"
            stroke-linecap="round"/>
    </svg>

    <!-- MIC ICON -->
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3z"
            stroke="black"
            stroke-width="1.5"
            fill="none"/>
      <path d="M19 11a7 7 0 01-14 0M12 18v3"
            stroke="black"
            stroke-width="1.5"
            fill="none"
            stroke-linecap="round"/>
    </svg>
  </div>

  <!-- AI RESPONSE -->
  <div id="aiResponse" class="ai-response"></div>

  <!-- CHAT BOX -->
  <div class="chat-box">
    <div id="chatMessages"></div>
    <input type="text" id="chatInput" placeholder="Ask AI Stylist for advice...">
  </div>

  <!-- OUTFIT GENERATOR -->
  <button onclick="generateOutfit()" class="outfit-btn">
    Generate Outfit
  </button>

  <div id="outfitResult"></div>

  <!-- TEXT BELOW SEARCH -->
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script src="app.js"></script>

<script>
function openProfile(){
  window.location.href = "profile.html";
}

function goWishlist(){
  alert("Wishlist page coming soon");
}

function openMenu(){
  document.getElementById("sideMenu").style.width = "250px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width = "0";
}
</script>

</body>
</html>
