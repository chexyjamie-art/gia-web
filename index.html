<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function() {
            const userName = localStorage.getItem('giaUserName');
            if (!userName) { window.location.href = 'login.html'; }
        })();
    </script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .product-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); 
            border-radius: 2rem; transition: 0.4s; border: 1px solid rgba(191, 149, 63, 0.1); 
            position: relative; overflow: hidden; height: auto; display: flex; flex-direction: column; cursor: pointer;
        }
        .product-card:hover { transform: translateY(-10px); border: 1px solid #BF953F; box-shadow: 0 0 30px rgba(191, 149, 63, 0.2); }

        .score-badge {
            position: absolute; top: 15px; left: 15px;
            background: linear-gradient(45deg, #BF953F, #FCF6BA);
            color: black; font-weight: 900; padding: 4px 10px;
            border-radius: 10px; font-size: 10px; z-index: 20;
        }

        /* 360 VIEWER EFFECT */
        .viewer-360 { position: relative; overflow: hidden; cursor: grab; background: #000; border-radius: 2rem; aspect-ratio: 1/1; }
        .viewer-360 img { width: 100%; h-full: 100%; object-fit: contain; transition: transform 0.1s ease-out; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: #BF953F; top: 0; animation: scan 2s linear infinite; z-index: 10; opacity: 0.5; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* MODALS */
        #details-modal, #score-modal { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(25px); overflow-y: auto; background: rgba(0,0,0,0.9); }
        .score-card-white { background: white; border-radius: 2.5rem; color: #04241a; padding: 2rem; max-width: 420px; width: 95%; position: relative; }

        .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000; padding: 1rem; justify-content: space-around; }
        @media (min-width: 1024px) { .mobile-nav { display: none !important; } }
    </style>
</head>
<body class="pb-24"> 

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 sticky top-0 z-[100] bg-[#04241a]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <button onclick="filterType('offer')" class="p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20"><i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i></button>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="location.reload()">GIA LUXE</h1>
            <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden"><img id="user-avatar" src="" class="w-full h-full rounded-full object-cover"></a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section class="text-center mb-10">
            <h2 class="text-4xl md:text-5xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-name">Stylist</span></h2>
            
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl mb-6">
                <i data-lucide="sparkles" class="ml-4 text-[#BF953F] w-5 h-5 animate-pulse"></i>
                <input type="text" id="ai-search-input" placeholder="Ask Gemini: Find red dress for party..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button onclick="startVoiceSearch()" class="p-2.5"><i data-lucide="mic" class="text-[#BF953F] w-5 h-5"></i></button>
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2 border border-gold/20 mr-1"><i data-lucide="camera" class="w-4 h-4"></i></button>
                <input type="file" id="image-upload" class="hidden">
            </div>

            <div id="gia-ai-box" class="max-w-2xl mx-auto p-6 bg-white/5 border border-dashed border-[#BF953F]/30 rounded-3xl text-left hidden">
                <p id="gia-ai-text" class="text-sm italic text-white/80 leading-relaxed"></p>
            </div>
        </section>

        <h3 id="section-title" class="text-[10px] font-bold tracking-[0.4em] uppercase text-[#BF953F] mb-10">AI Curated Picks</h3>
        <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8"></div>
    </main>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span></button>
        <button onclick="filterType('combo')" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span></button>
        <button onclick="filterType('offer')" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="percent" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Offers</span></button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span></button>
    </nav>

    <div id="score-modal" onclick="if(event.target==this) closeScore()">
        <div id="score-modal-content"></div>
    </div>

    <div id="details-modal" onclick="if(event.target==this) closeDetails()">
        <div id="modal-content" class="w-full max-w-6xl p-6"></div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyBooGwe97LGLxzaDBzr0txng2_sHfFfhdI"; 

        // 20+ PRODUCTS DATABASE
        const products = [
            { id: 1, type: 'regular', name: "Emerald Linen Shirt", price: "2,499", match: "9.1", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600", brand: "Amazon", tag: "Fashion" },
            { id: 2, type: 'combo', name: "Office Power Combo", price: "5,999", match: "9.8", img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=600", brand: "Myntra", tag: "Combo" },
            { id: 3, type: 'offer', name: "AirPods Max (Sale)", price: "44,900", match: "8.5", img: "https://images.unsplash.com/photo-1613040809024-b4ef7ba99bc3?w=600", brand: "Amazon", tag: "Tech" },
            { id: 4, type: 'regular', name: "Velvet Dinner Jacket", price: "8,500", match: "9.4", img: "https://images.unsplash.com/photo-1594932224828-99e02639dd6f?w=600", brand: "Ajio", tag: "Luxury" },
            { id: 5, type: 'offer', name: "Skincare Glow Kit", price: "1,299", match: "9.2", img: "https://images.unsplash.com/photo-1612817288484-6f916006741a?w=600", brand: "Nykaa", tag: "Beauty" },
            { id: 6, type: 'combo', name: "Gym Freak Set", price: "2,400", match: "8.9", img: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=600", brand: "Amazon", tag: "Sports" },
            { id: 7, type: 'regular', name: "Leather Chelsea Boots", price: "4,200", match: "9.0", img: "https://images.unsplash.com/photo-1638247025967-b4e38f787b76?w=600", brand: "Myntra", tag: "Footwear" },
            { id: 8, type: 'offer', name: "4K OLED Monitor", price: "32,000", match: "9.5", img: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=600", brand: "Amazon", tag: "Tech" },
            { id: 9, type: 'combo', name: "Date Night Look", price: "4,500", match: "9.7", img: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=600", brand: "Ajio", tag: "Fashion" },
            { id: 10, type: 'regular', name: "Gold Aviators", price: "12,999", match: "9.3", img: "https://images.unsplash.com/photo-1511499767350-a1590fdb2863?w=600", brand: "Lenskart", tag: "Accessory" },
            { id: 11, type: 'offer', name: "Mechanical Keyboard", price: "3,500", match: "8.8", img: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=600", brand: "Amazon", tag: "Tech" },
            { id: 12, type: 'combo', name: "Winter Travel Kit", price: "7,200", match: "9.1", img: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600", brand: "Myntra", tag: "Travel" },
            { id: 13, type: 'regular', name: "Raw Denim Jeans", price: "2,900", match: "8.7", img: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=600", brand: "Ajio", tag: "Fashion" },
            { id: 14, type: 'offer', name: "Smart Coffee Mug", price: "1,800", match: "9.4", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600", brand: "Amazon", tag: "Lifestyle" },
            { id: 15, type: 'combo', name: "Gaming Setup Essentials", price: "15,000", match: "9.9", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600", brand: "Amazon", tag: "Tech" },
            { id: 16, type: 'regular', name: "Silver Chronograph", price: "18,500", match: "9.2", img: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=600", brand: "Tata CLiQ", tag: "Luxury" },
            { id: 17, type: 'offer', name: "Cotton Bedding Set", price: "2,200", match: "8.6", img: "https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=600", brand: "HomeCentre", tag: "Decor" },
            { id: 18, type: 'combo', name: "Summer Beach Set", price: "3,100", match: "9.5", img: "https://images.unsplash.com/photo-1520367445093-50dc08a59d9d?w=600", brand: "Myntra", tag: "Travel" },
            { id: 19, type: 'regular', name: "Signature Perfume", price: "5,500", match: "9.0", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=600", brand: "Nykaa", tag: "Beauty" },
            { id: 20, type: 'offer', name: "E-Reader Paperwhite", price: "10,999", match: "9.6", img: "https://images.unsplash.com/photo-1592434134753-a70baf7979d7?w=600", brand: "Amazon", tag: "Tech" }
        ];

        window.onload = () => {
            const name = localStorage.getItem('giaUserName') || 'Stylist';
            document.getElementById('hero-name').innerText = name;
            document.getElementById('user-avatar').src = localStorage.getItem('giaUserDP') || `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            renderProducts(products);
            lucide.createIcons();
        };

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-4" onclick="openDetails(${p.id})">
                    <div class="score-badge" onclick="event.stopPropagation(); openScorePage(${p.id})">${p.match} GIA</div>
                    <img src="${p.img}" class="w-full h-44 object-cover rounded-2xl mb-4">
                    <p class="text-[7px] text-white/30 uppercase font-black mb-1 tracking-widest">${p.brand} • ${p.tag}</p>
                    <h4 class="text-[10px] font-bold text-white/80 uppercase tracking-widest truncate">${p.name}</h4>
                    <p class="text-xs font-black gold-text mt-2">₹${p.price}</p>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // 360 FEATURE LOGIC
        function openDetails(id) {
            const p = products.find(x => x.id === id);
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-content').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 bg-[#04241a] p-10 rounded-[3rem] border border-white/10">
                    <div>
                        <div class="viewer-360 mb-6 group" id="viewer-box">
                            <div class="scan-line"></div>
                            <img src="${p.img}" id="rotate-img">
                            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 px-4 py-2 rounded-full text-[8px] font-black gold-text uppercase tracking-widest opacity-0 group-hover:opacity-100 transition">Hold & Drag to Rotate</div>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <button onclick="closeDetails()" class="self-end text-white/20 mb-4"><i data-lucide="x"></i></button>
                        <span class="text-[#BF953F] text-[10px] font-black uppercase tracking-widest">360° AI Rendered</span>
                        <h2 class="text-5xl royal-logo gold-text my-6 leading-tight">${p.name}</h2>
                        <p class="text-3xl font-black mb-10 italic">₹${p.price}</p>
                        <div class="p-6 bg-white/5 rounded-3xl border border-white/5 mb-8 italic text-sm text-white/70">"Bhai, ye item GIA ne specifically tere liye Amazon aur Ajio scan karke nikala hai. 360 check kar le, quality solid hai."</div>
                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-6 rounded-[2rem] font-black uppercase text-xs">Buy Now on ${p.brand}</button>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            init360();
            lucide.createIcons();
        }

        function init360() {
            const box = document.getElementById('viewer-box');
            const img = document.getElementById('rotate-img');
            let startX, isDown = false;
            box.onmousedown = (e) => { isDown = true; startX = e.pageX; };
            window.onmouseup = () => isDown = false;
            box.onmousemove = (e) => {
                if(!isDown) return;
                let move = (e.pageX - startX) * 0.5;
                img.style.transform = `rotateY(${move}deg) scale(1.1)`;
            };
        }

        function openScorePage(id) {
            const p = products.find(x => x.id === id);
            const modal = document.getElementById('score-modal');
            document.getElementById('score-modal-content').innerHTML = `
                <div class="score-card-white shadow-2xl">
                    <button onclick="closeScore()" class="absolute top-8 right-8 text-black/20"><i data-lucide="x"></i></button>
                    <span class="bg-black text-white text-[7px] px-3 py-1.5 rounded-full font-black uppercase">Verified by Gemini 1.5</span>
                    <h2 class="text-4xl royal-logo italic text-black my-8">${p.name}</h2>
                    <div class="border border-blue-50 rounded-[2rem] p-6 mb-6 bg-blue-50/20 text-black">
                        <div class="flex justify-between items-center mb-6"><span class="text-[10px] font-black uppercase">Gemini Price Analysis</span></div>
                        <div class="flex items-end gap-3 h-20 mb-4">
                            <div class="flex-grow bg-blue-100 rounded-xl h-2/3"></div>
                            <div class="flex-grow bg-blue-500 rounded-xl h-full"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-1/2"></div>
                            <div class="flex-grow bg-blue-100 rounded-xl h-3/4"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="gia-score-box"><p class="text-4xl font-black text-green-700">${p.match}</p></div>
                        <div class="checks-box text-[9px] font-bold">✓ Verified Seller<br>✓ Stock OK<br>✓ Price Drop</div>
                    </div>
                    <div class="bg-black text-white p-6 rounded-[2rem] text-[11px] italic">"Bhai, Gemini ne history scan ki hai. Ye price last 6 mahine mein sabse kam hai!"</div>
                </div>`;
            modal.style.display = 'flex';
            lucide.createIcons();
        }

        // GEMINI AI SEARCH FUNCTION
        async function askGemini(query) {
            const box = document.getElementById('gia-ai-box');
            const text = document.getElementById('gia-ai-text');
            box.classList.remove('hidden');
            text.innerHTML = "<span class='animate-pulse gold-text font-black uppercase tracking-widest text-[10px]'>Gemini 1.5 is analyzing...</span>";
            
            try {
                const prompt = `System: You are GIA, powered by Gemini 1.5. You are a witty, street-smart stylist best friend. The user says: "${query}". Respond in Hinglish (mix of Hindi/English), be very cool and helpful. Max 2 short lines.`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                text.innerText = data.candidates[0].content.parts[0].text;
                
                // Live Search filtering
                const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.tag.toLowerCase().includes(query.toLowerCase()));
                if(filtered.length > 0) renderProducts(filtered);
            } catch (e) { text.innerText = "Bhai, Gemini ka dimaag garam ho gaya. Dubara try kar!"; }
        }

        document.getElementById('ai-search-input').onkeydown = (e) => {
            if(e.key === 'Enter') askGemini(e.target.value);
        };

        function filterType(type) {
            document.getElementById('section-title').innerText = type === 'combo' ? "Flash Match Combos" : "Exclusive Offers";
            renderProducts(products.filter(p => p.type === type));
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }
        function closeScore() { document.getElementById('score-modal').style.display = 'none'; }
        
        function startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.onresult = (e) => {
                const t = e.results[0][0].transcript;
                document.getElementById('ai-search-input').value = t;
                askGemini(t);
            };
            rec.start();
        }
    </script>
</body>
</html>
