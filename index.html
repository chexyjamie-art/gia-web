<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="left"></div>

  <div class="right">
    <span>Notifications</span>
    <span>Wishlist</span>

    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>

</header>

<!-- CENTER SEARCH AREA -->
<div class="center">

  <div class="search-box">

    <input type="text" placeholder="Ask AI anything...">

    <div class="icons">
      <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" title="Voice Search">
      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" title="Google Lens">
    </div>

  </div>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script>
function openProfile() {
  window.location.href = "profile.html";
}
</script>

</body>
</html>
