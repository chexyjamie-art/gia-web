<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="menu-left" onclick="openMenu()">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>
</header>

<!-- ================= SIDE MENU ================= -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>

  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#">Wishlist</a>
  <a href="#">Settings</a>
</div>

<!-- ================= CENTER AREA ================= -->
<div class="center">

  <!-- LEFT SIRI WAVE -->
  <div class="siri-wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input type="text" placeholder="Ask AI anything...">

    <div class="icons">
      <!-- Attachment -->
      <img src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/attach_file/default/24px.svg">

      <!-- Mic -->
      <img src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/mic/default/24px.svg">
    </div>
  </div>

  <!-- RIGHT SIRI WAVE -->
  <div class="siri-wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

</div>

<!-- ================= TEXT ================= -->
<div class="tagline">
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<!-- ================= JS ================= -->
<script>
function openProfile(){
  window.location.href = "profile.html";
}

function goWishlist(){
  alert("Wishlist page coming next");
}

function openMenu(){
  document.getElementById("sideMenu").style.width = "250px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width = "0";
}
</script>

</body>
</html>
