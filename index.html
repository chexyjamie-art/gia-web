<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="menu-left">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span>Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile">
  </div>
</header>

<!-- HERO SECTION -->
<section class="hero">

  <!-- SEARCH AREA -->
  <div class="search-wrapper">

    <!-- LEFT WAVE -->
    <div class="wave wave-left"></div>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Luxury skincare for glowing skin?">
      <span class="mic">🎤</span>
    </div>

    <!-- RIGHT WAVE -->
    <div class="wave wave-right"></div>

  </div>

  <!-- HEADLINE -->
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</section>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

</body>
</html>
