<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GIA AI Stylist</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">GIA <span>AI STYLIST</span></div>
  <p class="welcome-text">Welcome, Rahul!</p>
</header>

<main class="container">

  <!-- Search -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for the best styles..." />
    <button id="searchBtn"><i class="fa fa-search"></i></button>
  </div>

  <!-- Hero -->
  <section class="hero-text">
    <h1>Curated luxury for you, Rahul</h1>
    <p>Smart choices recommended by AI</p>
  </section>

  <div class="section-divider">
    <span>AI Picks for You</span>
  </div>

  <!-- Products -->
  <div class="product-grid">

    <div class="card">
      <span class="badge">Best Pick</span>
      <img src="https://via.placeholder.com/150" />
      <h3>Stylish & Under ₹10k</h3>
      <p class="price">₹8,999</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="card">
      <span class="badge">Premium</span>
      <img src="https://via.placeholder.com/150" />
      <h3>Luxury Gadget</h3>
      <p class="price">₹22,999</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="card">
      <span class="badge">Value</span>
      <img src="https://via.placeholder.com/150" />
      <h3>Great Price</h3>
      <p class="price">₹1,899</p>
      <button class="buy-btn">Buy Now</button>
    </div>

  </div>

</main>

<footer>
  <a href="#">Terms</a> |
  <a href="#">Privacy</a> |
  <a href="#">Conditions</a>
</footer>

<script src="script.js"></script>
</body>
</html>
