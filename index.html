<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Visual AI Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }

        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* OFFER NOTIFICATION DOT */
        .offer-btn { position: relative; }
        .red-dot { 
            position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; 
            background: #ef4444; border-radius: 50%; border: 2px solid #04241a;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* LOGIN SECTION - Responsive Fix */
        .login-box { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(191, 149, 63, 0.2); border-radius: 2.5rem;
            transition: 0.4s;
        }
        @media (min-width: 1024px) { .login-box { min-width: 800px; padding: 4rem; } }

        /* MOBILE NAV */
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
                background: rgba(4, 36, 26, 0.9); backdrop-filter: blur(20px);
                border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
                padding: 1rem; justify-content: space-around;
            }
        }

        /* PRODUCT INTEL MODAL */
        #details-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 500; display: none; overflow-y: auto; padding: 2rem 0; backdrop-filter: blur(15px); }
        .sentiment-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
        .sentiment-fill { height: 100%; background: #BF953F; }
        .price-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 10px; color: rgba(255,255,255,0.5); }
        .price-table td, .price-table th { border: 1px solid rgba(255,255,255,0.1); padding: 8px; text-align: center; }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <header class="py-6 px-4 md:px-8 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="offers.html" class="offer-btn p-2.5 bg-white/5 rounded-full border border-[#BF953F]/20 hover:border-[#BF953F]">
                <i data-lucide="percent" class="w-5 h-5 text-[#BF953F]"></i>
                <span class="red-dot"></span>
            </a>
            <h1 class="text-2xl md:text-3xl royal-logo gold-text cursor-pointer" onclick="window.location.href='index.html'">GIA LUXE</h1>
            <a href="profile.html" class="w-10 h-10 border border-[#BF953F] rounded-full p-0.5 overflow-hidden">
                <img id="user-avatar" src="" class="w-full h-full rounded-full object-cover">
            </a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section id="login-section" class="flex justify-center mb-20">
            <div class="login-box p-8 w-full max-w-4xl text-center">
                <span class="text-[10px] gold-text font-black uppercase tracking-[0.5em] mb-4 block">Identity Vault</span>
                <h2 class="text-3xl md:text-5xl royal-logo gold-text italic mb-8">Enter the Luxe</h2>
                <div class="flex flex-col md:flex-row gap-4 justify-center">
                    <input type="text" id="username-input" placeholder="Bhai, apna naam batao..." class="bg-black/40 border border-[#BF953F]/30 rounded-full px-8 py-4 outline-none md:w-80">
                    <button onclick="saveUser()" class="bg-[#BF953F] text-black px-10 py-4 rounded-full font-black uppercase text-xs tracking-widest hover:bg-white transition-all">Claim Profile</button>
                </div>
            </div>
        </section>

        <section class="text-center mb-16">
            <h2 class="text-4xl md:text-6xl royal-logo gold-text mb-8 italic">Welcome, <span id="hero-user-name">Stylist</span></h2>
            <div class="relative max-w-2xl mx-auto flex items-center border border-[#BF953F]/30 rounded-full p-1.5 bg-black/40 backdrop-blur-xl">
                <i data-lucide="search" class="ml-4 text-white/30 w-5 h-5"></i>
                <input type="text" id="ai-search-input" placeholder="Search Style or Beauty..." class="flex-grow bg-transparent text-white text-sm py-3 px-4 outline-none">
                <button onclick="document.getElementById('image-upload').click()" class="gold-text py-2.5 px-6 rounded-full text-xs font-bold bg-white/5 flex items-center gap-2">
                    <i data-lucide="camera" class="w-4 h-4"></i> <span class="hidden sm:inline">Visual AI</span>
                </button>
                <input type="file" id="image-upload" class="hidden">
            </div>
        </section>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-20"></div>
    </main>

    <div id="details-modal">
        <div class="max-w-4xl mx-auto px-6 relative">
            <button onclick="closeDetails()" class="fixed top-8 right-8 text-white/40 hover:text-white z-50"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <nav class="mobile-nav">
        <button onclick="location.reload()" class="flex flex-col items-center gap-1 text-[#BF953F]"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold">HOME</span></button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold">COMBOS</span></button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-white/40"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold">PROFILE</span></button>
    </nav>

    <script>
        // Database with Intel
        const allDatabase = [
            { id: 1, category: 'fashion', name: "Emerald Linen Shirt", price: "2,499", score: 98, rating: "4.8", pos: 85, neg: 15, sentiment: "Logon ne kaha ki kapda bohot premium hai.", why: "Selected because it has the highest comfort rating in this price bracket.", history: ["₹2,699", "₹2,499", "₹2,299"], img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600" },
            { id: 101, category: 'beauty', name: "Salicylic Face Wash", price: "499", score: 94, rating: "4.9", pos: 94, neg: 6, sentiment: "Oily skin ke liye 10/10 results.", why: "Dermatologically recommended and paraben-free.", history: ["₹550", "₹499", "₹475"], img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600" }
        ];

        window.onload = () => {
            lucide.createIcons();
            const name = localStorage.getItem('giaUserName');
            if(name) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('hero-user-name').innerText = name;
                document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            } else {
                document.getElementById('user-avatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=Stylist`;
            }
            renderProducts(allDatabase);
        };

        function saveUser() {
            const name = document.getElementById('username-input').value;
            if(name) {
                localStorage.setItem('giaUserName', name);
                location.reload();
            }
        }

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-6" onclick="openDetails(${p.id})">
                    <img src="${p.img}" class="w-full h-52 object-cover rounded-2xl mb-4">
                    <h4 class="text-sm font-bold text-white/80">${p.name}</h4>
                    <p class="text-xl font-black mt-2 italic gold-text">₹${p.price}</p>
                </div>
            `).join('');
        }

        function openDetails(id) {
            const p = allDatabase.find(x => x.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="bg-[#04241a] rounded-[2.5rem] overflow-hidden border border-white/10 flex flex-col md:flex-row shadow-2xl">
                    <div class="w-full md:w-1/2 h-80 md:h-auto"><img src="${p.img}" class="w-full h-full object-cover"></div>
                    <div class="w-full md:w-1/2 p-8 md:p-12">
                        <h2 class="text-3xl royal-logo gold-text italic mb-6">${p.name}</h2>
                        <div class="mb-8 p-5 bg-white/5 rounded-2xl border border-white/10">
                            <p class="text-[9px] gold-text font-black uppercase mb-3 tracking-widest">GIA Intel Summary</p>
                            <p class="text-xs italic text-white/70 mb-4">"${p.sentiment}"</p>
                            <div class="sentiment-bar"><div class="sentiment-fill" style="width: ${p.pos}%"></div></div>
                            <div class="flex justify-between text-[8px] mt-2 text-white/30"><span>POSITIVE ${p.pos}%</span><span>NEGATIVE ${p.neg}%</span></div>
                        </div>
                        <div class="mb-8 border-l-2 border-[#BF953F] pl-4">
                            <p class="text-[9px] gold-text font-black uppercase mb-1">Why This?</p>
                            <p class="text-xs text-white/50 leading-relaxed">${p.why}</p>
                        </div>
                        <div class="mb-10 text-center">
                            <table class="price-table">
                                <tr><th>Last Month</th><th>Today</th><th>Deal Price</th></tr>
                                <tr><td>${p.history[0]}</td><td class="gold-text font-bold">${p.history[1]}</td><td>${p.history[2]}</td></tr>
                            </table>
                        </div>
                        <button onclick="window.open('https://amazon.in')" class="w-full bg-[#BF953F] text-black py-4 rounded-full font-black uppercase text-[10px] tracking-widest shadow-xl">Buy Now</button>
                    </div>
                </div>`;
            document.getElementById('details-modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeDetails() { document.getElementById('details-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
