<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA AI Stylist</title>

<link rel="stylesheet" href="style.css">

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="menu-left" onclick="openMenu()">
    ☰ <span>Menu</span>
  </div>

  <div class="right">
    <span>Notifications</span>
    <span onclick="goWishlist()">Wishlist</span>
    <img src="https://i.pravatar.cc/40" class="profile" onclick="openProfile()">
  </div>

</header>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="closeMenu()">✖</span>
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="#">Wishlist</a>
</div>

<!-- CENTER -->
<div class="center">

  <!-- SEARCH BAR -->
  <div class="search-box">
    <input type="text" placeholder="Ask AI anything...">

    <!-- ATTACHMENT ICON -->
    <img src="https://cdn-icons-png.flaticon.com/512/60/60710.png"
         class="icon">

    <!-- MIC ICON -->
    <img src="https://cdn-icons-png.flaticon.com/512/61/61012.png"
         class="icon">
  </div>

  <!-- TEXT BELOW SEARCH -->
  <h1>Curated luxury for you, Rahul</h1>
  <p>Smart choices recommended by AI.</p>

</div>

<!-- FOOTER -->
<footer class="footer">
  Terms | Privacy | Conditions
</footer>

<script>
function openProfile(){
  window.location.href = "profile.html";
}

function goWishlist(){
  alert("Wishlist page coming soon");
}

function openMenu(){
  document.getElementById("sideMenu").style.width = "250px";
}

function closeMenu(){
  document.getElementById("sideMenu").style.width = "0";
}
</script>

</body>
</html>
