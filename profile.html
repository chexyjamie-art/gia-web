<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile – GIA AI Stylist</title>
<link rel="stylesheet" href="profile.css">
</head>

<body>

<div class="profile-container">

  <!-- TOP PROFILE -->
  <div class="profile-header">
    <img src="https://i.pravatar.cc/120" class="dp">

    <input id="name" class="edit-field" value="Rahul Sharma">
<input id="gender" class="edit-field" value="Male">
<input id="mobile" class="edit-field" value="+91 9876543210">
<input id="email" class="edit-field" value="rahul@email.com">
<input id="address" class="edit-field" value="Bhawanipatna, Odisha">

<button onclick="saveProfile()" class="save-btn">Save Profile</button>
  </div>

  <!-- WISHLIST -->
  <div class="card" onclick="goWishlist()">
    ❤️ Wishlist
  </div>

  <!-- ORDER HISTORY -->
  <div class="card">
    📦 Order History
    <div class="orders">
      <div class="order-item">Silver Watch – ₹3,999</div>
      <div class="order-item">Running Shoes – ₹2,499</div>
      <div class="order-item">Face Serum – ₹799</div>
    </div>
  </div>

  <!-- AI SETTINGS (CLICK TO OPEN) -->
  <div class="card" onclick="openAISettings()">
    ⚙ AI Settings
  </div>

  <!-- AI SETTINGS PANEL -->
  <div id="aiSettingsBox" class="card" style="display:none;">
    <label>AI Gender</label>
    <select>
      <option>Male</option>
      <option>Female</option>
    </select>

    <label>AI Voice</label>
    <select>
      <option>Male Voice</option>
      <option>Female Voice</option>
    </select>

    <label>AI Name</label>
    <input type="text" placeholder="Enter AI name">

    <button onclick="closeAISettings()">Close</button>
  </div>

  <!-- LOGOUT -->
  <button class="logout" onclick="logout()">Logout</button>

</div>

<script src="profile.js"></script>

<script>
function openAISettings(){
  document.getElementById("aiSettingsBox").style.display = "block";
}

function closeAISettings(){
  document.getElementById("aiSettingsBox").style.display = "none";
}
</script>

</body>
</html>
