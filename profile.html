<!DOCTYPE html>
<html>
<head>
<title>Profile – GIA</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-container">

  <div class="profile-header">
    <img id="profilePic" class="dp" src="https://i.pravatar.cc/120">
    <input type="file" id="dpInput" hidden>

    <input class="edit-field" placeholder="Name">
    <button onclick="saveProfile()">Save Profile</button>
  </div>

  <div class="card" onclick="toggleWishlist()">❤️ Wishlist</div>
  <div id="wishlistBox"></div>

  <div class="card" onclick="toggleAI()">⚙ AI Settings</div>
  <div id="aiBox">AI Settings Ready ✔</div>

  <button class="logout">Logout</button>
</div>

<script src="profile.js"></script>
</body>
</html>
