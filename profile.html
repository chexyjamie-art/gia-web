<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background: radial-gradient(circle at top right, #f0f9ff 0%, #ffffff 100%);
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }

        /* The "Frost" Card Effect */
        .frost-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03);
        }

        /* Soft Floating Animation */
        .float-anim {
            animation: floating 4s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .avatar-glow {
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-[120px] -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-50 rounded-full blur-[120px] -z-10"></div>

    <nav class="p-8 flex justify-between items-center">
        <button onclick="window.location.href='index.html'" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-gray-100 active:scale-90 transition-all">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xs font-extrabold uppercase tracking-[0.5em] text-gray-400">Identity</h1>
        <button class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-gray-100 text-red-500">
            <i data-lucide="power" class="w-5 h-5"></i>
        </button>
    </nav>

    <main class="max-w-md mx-auto px-6 pt-10 pb-20">
        
        <div class="flex flex-col items-center mb-12">
            <div class="relative float-anim">
                <div class="w-36 h-36 rounded-[3rem] bg-white p-2 avatar-glow overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" class="w-full h-full object-cover rounded-[2.5rem] bg-blue-50">
                </div>
                <div class="absolute -bottom-2 -right-2 bg-blue-600 text-white p-3 rounded-2xl shadow-lg border-4 border-white">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
            </div>
            <div class="mt-8 text-center">
                <h2 class="text-4xl font-black tracking-tight">Rahul K.</h2>
                <p class="text-sm text-blue-500 font-bold mt-1 tracking-widest uppercase">Style Level: Elite</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="frost-card p-6 rounded-[2.5rem] flex items-center gap-5">
                <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600">
                    <i data-lucide="mail" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Connect</p>
                    <p class="text-sm font-semibold">rahul.k@gia.ai</p>
                </div>
            </div>

            <div class="frost-card p-6 rounded-[2.5rem] flex items-center gap-5">
                <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600">
                    <i data-lucide="map-pin" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Base</p>
                    <p class="text-sm font-semibold">Bandra, Mumbai</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50 flex flex-col items-center group cursor-pointer active:scale-95 transition-all">
                <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-blue-600 group-hover:text-white transition-all">
                    <i data-lucide="package" class="w-5 h-5"></i>
                </div>
                <p class="text-xs font-bold uppercase tracking-widest">Orders</p>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50 flex flex-col items-center group cursor-pointer active:scale-95 transition-all">
                <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-red-500 group-hover:text-white transition-all">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                </div>
                <p class="text-xs font-bold uppercase tracking-widest">Wishlist</p>
            </div>
        </div>

        <div class="mt-12 text-center">
            <button class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-300 hover:text-blue-500 transition-colors">
                GIA AI Personal Assistant • v2.0
            </button>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
