<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="profile-container">

  <!-- PROFILE IMAGE -->
  <img id="profilePic" src="https://i.pravatar.cc/120" class="profile-large">
  <input type="file" id="dpUpload" hidden onchange="changeDP(event)">
  <button onclick="document.getElementById('dpUpload').click()">Change Photo</button>

  <!-- FORM -->
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="mobile" placeholder="Mobile Number">
  <input type="email" id="email" placeholder="Email Address">
  <textarea id="address" placeholder="Home Address"></textarea>

  <button onclick="saveProfile()">Save Profile</button>

</div>

<script src="app.js"></script>
</body>
</html>
