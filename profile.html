<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="profile-container">

  <!-- PROFILE IMAGE -->
  <img id="profilePic" src="https://i.pravatar.cc/120" class="profile-large">
  <input type="file" id="dpUpload" hidden onchange="changeDP(event)">
  <button onclick="document.getElementById('dpUpload').click()">Change Photo</button>

  <!-- FORM -->
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="mobile" placeholder="Mobile Number">
  <input type="email" id="email" placeholder="Email Address">
  <textarea id="address" placeholder="Home Address"></textarea>

  <!-- AI SETTINGS -->
  <div class="ai-setting" onclick="openAISettings()">
    AI Setting
  </div>

  <!-- AI SETTINGS POPUP -->
  <div id="aiSettingsBox" class="ai-settings-box">
    <h3>AI Preferences</h3>

    <label>AI Gender</label>
    <select>
      <option>Male</option>
      <option>Female</option>
    </select>

    <label>Voice Type</label>
    <select>
      <option>Soft</option>
      <option>Professional</option>
      <option>Friendly</option>
    </select>

    <button onclick="closeAISettings()">Close</button>
  </div>

  <button onclick="saveProfile()">Save Profile</button>

</div>

<script src="app.js"></script>

<!-- ✅ AI SETTINGS JS -->
<script>
function openAISettings(){
  document.getElementById("aiSettingsBox").style.display = "block";
}

function closeAISettings(){
  document.getElementById("aiSettingsBox").style.display = "none";
}
</script>

</body>
</html>
