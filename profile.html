<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background: linear-gradient(rgba(4, 36, 26, 0.95), rgba(4, 36, 26, 0.98)), 
                        url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-attachment: fixed; font-family: 'Inter', sans-serif; color: white; min-height: 100vh;
        }
        .royal-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase; }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card-bg { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(191, 149, 63, 0.1); border-radius: 2rem; }
        
        input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; outline: none; }
        input:focus { border-color: #BF953F !important; }

        .toggle-active { background: #BF953F !important; color: black !important; }

        .mobile-nav { 
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(4, 36, 26, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(191, 149, 63, 0.2); z-index: 1000;
            padding: 1rem; justify-content: space-around;
        }
    </style>
</head>
<body class="pb-32">

    <header class="py-6 px-6 border-b border-[#BF953F]/20 backdrop-blur-md sticky top-0 z-[100]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl royal-logo gold-text">Customer Vault</h1>
            <button onclick="logout()" class="text-[10px] font-black uppercase text-red-500 bg-red-500/10 px-4 py-2 rounded-full border border-red-500/20">Logout</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-10">
        
        <section class="mb-10">
            <p class="text-[10px] font-black gold-text uppercase tracking-[0.3em] mb-4 ml-2">Personal Information</p>
            <div class="card-bg p-8">
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-bold mb-2 block">Full Name</label>
                        <input type="text" id="cust-name" class="w-full p-4 rounded-xl text-sm" readonly>
                    </div>
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-bold mb-2 block">Mobile Number</label>
                        <input type="text" id="cust-phone" class="w-full p-4 rounded-xl text-sm" readonly>
                    </div>
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-bold mb-2 block">Email Address (Optional)</label>
                        <input type="email" id="cust-email" placeholder="Add your email" class="w-full p-4 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-bold mb-2 block">Delivery Address</label>
                        <textarea id="cust-address" placeholder="Enter your full address" class="w-full p-4 rounded-xl text-sm bg-white/5 border border-white/10 outline-none focus:border-[#BF953F] h-24"></textarea>
                    </div>
                    <button onclick="saveDetails()" class="w-full bg-white/5 border border-[#BF953F]/30 py-3 rounded-full text-[10px] font-black gold-text uppercase tracking-widest hover:bg-[#BF953F] hover:text-black transition-all">Save Profile</button>
                </div>
            </div>
        </section>

        <section class="mb-10">
            <p class="text-[10px] font-black gold-text uppercase tracking-[0.3em] mb-4 ml-2">GIA Assistant Settings</p>
            <div class="card-bg p-8">
                <div class="space-y-8">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-sm font-bold">AI Gender Persona</p>
                            <p class="text-[9px] text-white/30">Choose GIA's identity</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="setAI('male')" id="ai-male" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase border border-white/10">Male</button>
                            <button onclick="setAI('female')" id="ai-female" class="px-4 py-2 rounded-lg text-[9px] font-black uppercase border border-white/10 toggle-active">Female</button>
                        </div>
                    </div>

                    <div>
                        <p class="text-sm font-bold mb-4">Voice Modulation</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setVoice('energetic')" id="v-energetic" class="p-4 rounded-xl border border-[#BF953F]/20 text-[9px] font-bold uppercase bg-white/5">Energetic / Fast</button>
                            <button onclick="setVoice('soft')" id="v-soft" class="p-4 rounded-xl border border-[#BF953F]/20 text-[9px] font-bold uppercase bg-white/5">Soft / Luxury</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="py-16 text-center border-t border-white/5">
        <div class="max-w-md mx-auto">
            <h2 class="royal-logo gold-text text-lg italic mb-4">GIA LUXE</h2>
            <p class="text-[9px] text-white/30 italic leading-relaxed uppercase tracking-[0.2em]">
                GIA IS AN AI-POWERED AFFILIATE PLATFORM. WE CURATE PRODUCTS BASED ON ANALYSIS. 
                COMMISSIONS MAY BE EARNED THROUGH YOUR PURCHASES. ALL RIGHTS RESERVED 2026.
            </p>
        </div>
    </footer>

    <nav class="mobile-nav">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="home" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="search" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Search</span>
        </button>
        <button onclick="window.location.href='combos.html'" class="flex flex-col items-center gap-1 text-white/40">
            <i data-lucide="package" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Combos</span>
        </button>
        <button onclick="window.location.href='profile.html'" class="flex flex-col items-center gap-1 text-[#BF953F]">
            <i data-lucide="user" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Profile</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        // 1. SESSION MANAGEMENT & AUTO-FILL
        window.onload = () => {
            // Login ke waqt save kiye gaye data ko uthana
            const userName = localStorage.getItem('giaUserName');
            const userPhone = localStorage.getItem('giaUserPhone');
            
            if (!userName || !userPhone) {
                window.location.href = 'login.html'; // Agar data nahi hai toh login bhej do
            } else {
                document.getElementById('cust-name').value = userName;
                document.getElementById('cust-phone').value = userPhone;
                
                // Extra details agar pehle save ki thi
                document.getElementById('cust-email').value = localStorage.getItem('giaUserEmail') || '';
                document.getElementById('cust-address').value = localStorage.getItem('giaUserAddress') || '';
            }
        };

        // 2. SAVE ADDITIONAL DETAILS
        function saveDetails() {
            const email = document.getElementById('cust-email').value;
            const address = document.getElementById('cust-address').value;
            
            localStorage.setItem('giaUserEmail', email);
            localStorage.setItem('giaUserAddress', address);
            alert("GIA Vault Updated Successfully!");
        }

        // 3. AI SETTINGS LOGIC
        function setAI(gender) {
            document.getElementById('ai-male').classList.toggle('toggle-active', gender === 'male');
            document.getElementById('ai-female').classList.toggle('toggle-active', gender === 'female');
            localStorage.setItem('gia_ai_gender', gender);
        }

        function setVoice(type) {
            document.getElementById('v-energetic').classList.toggle('border-[#BF953F]', type === 'energetic');
            document.getElementById('v-soft').classList.toggle('border-[#BF953F]', type === 'soft');
            localStorage.setItem('gia_ai_voice', type);
        }

        // 4. LOGOUT
        function logout() {
            if(confirm("Bhai, logout karna hai? Aapki settings save rahengi.")) {
                // Hum name aur phone nahi hatayenge agar session sirf logout karna hai, 
                // par agar full clean chahiye toh localStorage.clear() use kar sakte hain.
                localStorage.removeItem('giaUserName');
                localStorage.removeItem('giaUserPhone');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
