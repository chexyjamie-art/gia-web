<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-container">

<img id="profilePic" src="https://i.pravatar.cc/120" class="dp" onclick="uploadDP()">
<input type="file" id="dpInput" hidden onchange="changeDP(event)">

<input class="edit-field" id="name" placeholder="Name">
<input class="edit-field" id="mobile" placeholder="Mobile">

<button onclick="saveProfile()">Save</button>

<div class="card" onclick="toggleWishlist()">❤️ Wishlist</div>
<div id="wishlistBox"></div>

<div class="card" onclick="toggleAI()">⚙ AI Settings</div>
<div id="aiBox">AI Gender, Voice, Name</div>

</div>

<script src="profile.js"></script>
</body>
</html>
