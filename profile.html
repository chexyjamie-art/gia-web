<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            background-color: #F4F4F2; /* Stone/Beige tint - very premium */
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1a1a1a;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Thin Sharp Borders */
        .sharp-card {
            background: white;
            border: 1px solid #1a1a1a;
            box-shadow: 8px 8px 0px #1a1a1a; /* Retro-modern shadow */
        }

        .avatar-frame {
            border: 1px solid #1a1a1a;
            padding: 10px;
            background: white;
        }

        .btn-black {
            background: #1a1a1a;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-black:hover {
            background: transparent;
            color: #1a1a1a;
            box-shadow: 4px 4px 0px #1a1a1a;
        }
    </style>
</head>
<body class="p-4">

    <header class="flex justify-between items-center py-6 px-2">
        <button onclick="window.location.href='index.html'" class="hover:scale-110 transition-transform">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-sm font-bold uppercase tracking-[0.3em]">Account / Profile</h1>
        <div class="w-6"></div> </header>

    <main class="max-w-md mx-auto pt-10 pb-20">
        
        <div class="text-center mb-12">
            <div class="inline-block relative">
                <div class="avatar-frame mb-6">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" class="w-32 h-32 bg-gray-100" alt="Rahul">
                </div>
                <div class="absolute -bottom-2 -right-4 bg-[#1a1a1a] text-white text-[8px] px-3 py-1 font-bold uppercase tracking-widest">
                    Privé Member
                </div>
            </div>
            <h2 class="text-5xl font-serif italic font-bold mt-4">Rahul Kapoor</h2>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-2">Personalized by GIA AI</p>
        </div>

        <div class="space-y-4">
            <div class="sharp-card p-6">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Email Address</p>
                        <p class="text-sm font-bold italic">rahul.kapoor@gia.com</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                </div>
            </div>

            <div class="sharp-card p-6">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Shipping</p>
                        <p class="text-sm font-bold">Bandra West, Mumbai, 400050</p>
                    </div>
                    <i data-lucide="map-pin" class="w-4 h-4 text-gray-300"></i>
                </div>
            </div>
        </div>

        <div class="mt-12 border-t border-black/10">
            <div class="flex items-center justify-between py-6 border-b border-black/10 cursor-pointer group">
                <span class="text-xl font-serif italic group-hover:pl-4 transition-all">Order History</span>
                <span class="text-xs text-gray-400">08</span>
            </div>
            <div class="flex items-center justify-between py-6 border-b border-black/10 cursor-pointer group">
                <span class="text-xl font-serif italic group-hover:pl-4 transition-all">Saved Items</span>
                <span class="text-xs text-gray-400">14</span>
            </div>
            <div class="flex items-center justify-between py-6 border-b border-black/10 cursor-pointer group">
                <span class="text-xl font-serif italic group-hover:pl-4 transition-all">Styling Preferences</span>
                <i data-lucide="settings" class="w-4 h-4"></i>
            </div>
        </div>

        <button class="w-full btn-black py-5 mt-12 text-[10px] font-bold uppercase tracking-[0.3em] border border-black">
            Log Out from GIA
        </button>

        <p class="text-[8px] text-center mt-12 text-gray-400 uppercase tracking-widest leading-relaxed">
            GIA is an affiliate curator for Amazon & Myntra. <br>
            All rights reserved 2026.
        </p>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
