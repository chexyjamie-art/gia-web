<div class="profile-header">
  <img id="profilePic" src="https://i.pravatar.cc/120" class="dp" onclick="uploadDP()">
  <input type="file" id="dpInput" hidden accept="image/*" onchange="previewDP(event)">

  <input class="edit-field" placeholder="Full Name">
  <input class="edit-field" placeholder="Gender">
  <input class="edit-field" placeholder="Mobile Number">
  <input class="edit-field" placeholder="Email Address">
  <input class="edit-field" placeholder="Full Delivery Address">

  <button onclick="saveProfile()">Save Profile</button>
</div>

<div class="card" onclick="toggleWishlist()">❤️ Wishlist</div>
<div id="wishlistBox" class="card">Wishlist Items Here</div>

<div class="card" onclick="toggleAI()">⚙ AI Settings</div>
<div id="aiBox" class="card">
  <p>AI Gender</p>
  <p>AI Voice</p>
</div>

<button class="logout">Logout</button>

<script src="profile.js"></script>
