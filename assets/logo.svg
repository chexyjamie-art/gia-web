<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ovalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EDEDED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D8D8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Outer Oval Ring -->
  <ellipse cx="200" cy="90" rx="170" ry="70" fill="none" stroke="url(#ovalGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Lotus Flower -->
  <g transform="translate(200,90)">
    <!-- Petals -->
    <ellipse fill="#F2E8D7" stroke="#D4C4A0" stroke-width="1.5" stroke-linejoin="round" filter="url(#shadow)" rx="22" ry="35" opacity="0.9"/>
    <ellipse fill="#EDE0C6" stroke="#D4C4A0" stroke-width="1.5" stroke-linejoin="round" filter="url(#shadow)" rx="18" ry="28" opacity="0.95"/>
    <path fill="#F8F4E6" stroke="#E2D2B0" stroke-width="1" stroke-linejoin="round" d="M0,-18 Q5,-25 12,-22 Q18,-18 15,-10 Q12,-2 5,2 Q-2,5 -8,0 Q-12,-5 -10,-12 Q-7,-18 -2,-20 Z" transform="rotate(0)"/>
    <path fill="#F8F4E6" stroke="#E2D2B0" stroke-width="1" stroke-linejoin="round" d="M0,-18 Q5,-25 12,-22 Q18,-18 15,-10 Q12,-2 5,2 Q-2,5 -8,0 Q-12,-5 -10,-12 Q-7,-18 -2,-20 Z" transform="rotate(72)"/>
    <path fill="#F8F4E6" stroke="#E2D2B0" stroke-width="1" stroke-linejoin="round" d="M0,-18 Q5,-25 12,-22 Q18,-18 15,-10 Q12,-2 5,2 Q-2,5 -8,0 Q-12,-5 -10,-12 Q-7,-18 -2,-20 Z" transform="rotate(144)"/>
    <path fill="#F8F4E6" stroke="#E2D2B0" stroke-width="1" stroke-linejoin="round" d="M0,-18 Q5,-25 12,-22 Q18,-18 15,-10 Q12,-2 5,2 Q-2,5 -8,0 Q-12,-5 -10,-12 Q-7,-18 -2,-20 Z" transform="rotate(216)"/>
    <path fill="#F8F4E6" stroke="#E2D2B0" stroke-width="1" stroke-linejoin="round" d="M0,-18 Q5,-25 12,-22 Q18,-18 15,-10 Q12,-2 5,2 Q-2,5 -8,0 Q-12,-5 -10,-12 Q-7,-18 -2,-20 Z" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="4" fill="#D4A55A" stroke="#B8944A" stroke-width="1"/>
  </g>
  
  <!-- GLA Text (script font simulation) -->
  <text x="200" y="85" text-anchor="middle" font-family="'Dancing Script', 'Great Vibes', cursive" font-size="72" font-weight="700" fill="#2C1810" stroke="#1A0F08" stroke-width="0.3" stroke-linejoin="round" filter="url(#shadow)">GLA</text>
  
  <!-- Swirls/Trails -->
  <path d="M 80 55 Q 60 40 45 65 Q 35 85 55 95 Q 70 105 90 90" fill="none" stroke="#2C1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#shadow)"/>
  <path d="M 320 125 Q 340 140 355 115 Q 365 95 345 85 Q 330 75 310 90" fill="none" stroke="#2C1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#shadow)"/>
  
  <!-- Smart AI Stylist Text -->
  <text x="200" y="170" text-anchor="middle" font-family="'Poppins', 'Roboto', sans-serif" font-size="18" font-weight="600" fill="#4A5568" letter-spacing="0.5">Smart AI Stylist</text>
</svg>