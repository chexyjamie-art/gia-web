<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA | My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; }
        .order-card { transition: all 0.3s ease; }
        .order-card:hover { transform: translateY(-5px); shadow: 0 20px 40px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="pb-10">
    <nav class="fixed top-0 w-full p-6 bg-white/80 backdrop-blur-md z-50 border-b border-gray-50 flex justify-between items-center">
        <button onclick="window.history.back()" class="p-2 bg-gray-50 rounded-full"><i data-lucide="chevron-left"></i></button>
        <h1 class="text-[10px] font-black uppercase tracking-widest">Order History</h1>
        <div class="w-10"></div>
    </nav>

    <main class="max-w-xl mx-auto pt-24 px-6 space-y-6">
        <div class="order-card bg-white p-6 rounded-[2.5rem] border border-gray-100 flex gap-5 items-center">
            <div class="w-20 h-24 bg-gray-50 rounded-2xl overflow-hidden shrink-0">
                <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=200" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h4 class="text-xs font-bold">Blue Check Linen</h4>
                    <span class="text-[8px] font-black text-green-600 bg-green-50 px-2 py-1 rounded-full border border-green-100">GIA 9.4</span>
                </div>
                <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-tighter">Delivered on 12 Jan 2026</p>
                <p class="text-sm font-black mt-2">₹1,899</p>
            </div>
            <i data-lucide="chevron-right" class="text-gray-300 w-4 h-4"></i>
        </div>

        <div class="order-card bg-white p-6 rounded-[2.5rem] border border-gray-100 flex gap-5 items-center opacity-70">
            <div class="w-20 h-24 bg-gray-50 rounded-2xl overflow-hidden shrink-0">
                <img src="https://images.unsplash.com/photo-1624373666563-54ec85a14962?w=200" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-start">
                    <h4 class="text-xs font-bold">Beige Chino</h4>
                    <span class="text-[8px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-full border border-blue-100">GIA 8.9</span>
                </div>
                <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-tighter">Delivered on 05 Jan 2026</p>
                <p class="text-sm font-black mt-2">₹2,400</p>
            </div>
            <i data-lucide="rotate-ccw" class="text-gray-300 w-4 h-4"></i>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
