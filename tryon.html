<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA AI | 3D Photo Upload Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background: #0a0a0a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .interactive { pointer-events: auto; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 2.5rem; }
        .upload-box { border: 2px dashed rgba(14, 165, 233, 0.4); transition: 0.3s; }
        .upload-box:hover { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.05); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        
        <div id="setup-card" class="glass p-8 w-full max-w-lg shadow-2xl interactive">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black italic gold-text">GIA <span class="text-sky-500">3D ENGINE</span></h1>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 mt-2 font-bold">Please provide your photos & metrics</p>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase text-sky-400">Height (cm)</label>
                    <input type="number" id="height-input" value="175" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-sky-400">Weight (kg)</label>
                    <input type="number" id="weight-input" value="70" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-sky-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <label class="upload-box p-6 rounded-3xl flex flex-col items-center gap-3 cursor-pointer">
                    <i data-lucide="camera" class="text-sky-400"></i>
                    <span class="text-[10px] font-bold uppercase" id="front-status">Upload Front</span>
                    <input type="file" id="front-file" class="hidden" accept="image/*" onchange="updateLabel('front')">
                </label>

                <label class="upload-box p-6 rounded-3xl flex flex-col items-center gap-3 cursor-pointer">
                    <i data-lucide="camera" class="text-pink-400"></i>
                    <span class="text-[10px] font-bold uppercase" id="back-status">Upload Back</span>
                    <input type="file" id="back-file" class="hidden" accept="image/*" onchange="updateLabel('back')">
                </label>
            </div>

            <button onclick="processTryOn()" class="w-full bg-sky-500 py-5 rounded-2xl font-black uppercase text-xs tracking-[0.2em] shadow-xl shadow-sky-500/20 hover:scale-[1.02] active:scale-95 transition-all">
                Generate My 3D Avatar
            </button>
        </div>

        <div id="success-hud" class="hidden glass p-6 flex flex-col items-center gap-4 interactive animate-bounce">
            <p class="text-[10px] font-black uppercase tracking-widest">3D Fit Successful!</p>
            <button onclick="location.reload()" class="bg-white text-black px-8 py-3 rounded-full text-[10px] font-black uppercase">Try Another</button>
        </div>

    </div>

    <script>
        lucide.createIcons();
        let scene, camera, renderer, controls, avatar;

        function updateLabel(side) {
            const input = document.getElementById(side + '-file');
            const label = document.getElementById(side + '-status');
            if(input.files.length > 0) {
                label.innerText = "Photo Ready ✅";
                label.classList.add('text-green-400');
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            animate();
        }

        async function processTryOn() {
            const fFile = document.getElementById('front-file').files[0];
            const bFile = document.getElementById('back-file').files[0];

            if(!fFile || !bFile) {
                alert("Bhai, pehle Front aur Back dono photos toh upload karo!");
                return;
            }

            // UI Changes
            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('success-hud').classList.remove('hidden');

            const loader = new THREE.TextureLoader();
            const fTex = loader.load(URL.createObjectURL(fFile));
            const bTex = loader.load(URL.createObjectURL(bFile));

            const h = document.getElementById('height-input').value / 175;
            const w = document.getElementById('weight-input').value / 70;

            avatar = new THREE.Group();

            // 3D Mesh Body
            const geo = new THREE.PlaneGeometry(5 * w, 8 * h, 40, 40);
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i);
                pos.setZ(i, Math.cos(x * (0.8/w)) * 0.5);
            }

            const frontMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: fTex, transparent: true, side: THREE.FrontSide }));
            const backMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: bTex, transparent: true, side: THREE.FrontSide }));
            backMesh.rotation.y = Math.PI;
            backMesh.position.z = -0.1;

            // Product (Cloth Overlay)
            const cGeo = new THREE.PlaneGeometry(5.2 * w, 6.5 * h, 40, 40);
            const clothTex = loader.load('https://i.imgur.com/u7V0HhK.png');
            const clothMesh = new THREE.Mesh(cGeo, new THREE.MeshStandardMaterial({ map: clothTex, transparent: true, side: THREE.DoubleSide }));
            clothMesh.position.y = 0.5 * h;
            clothMesh.position.z = 0.1;

            avatar.add(frontMesh, backMesh, clothMesh);
            scene.add(avatar);

            // Intro Animation
            gsap.from(avatar.rotation, { y: Math.PI * 2, duration: 2.5, ease: "power2.out" });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();
            renderer.render(scene, camera);
        }

        init3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
