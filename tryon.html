<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA AI | 3D Human Mapping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background: #f0f4f8; font-family: 'Inter', sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; background: radial-gradient(circle, #ffffff, #e2e8f0); }
        .ui-panel { position: absolute; z-index: 100; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        .interactive { pointer-events: auto; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); border-radius: 2rem; }
        .scan-line { position: absolute; width: 100%; height: 5px; background: #0ea5e9; box-shadow: 0 0 25px #0ea5e9; z-index: 200; display: none; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="scanner" class="scan-line"></div>
        
        <div class="ui-panel">
            <div class="flex justify-between items-start interactive">
                <div class="glass p-6 shadow-xl">
                    <h1 class="text-3xl font-black italic gold-text tracking-tighter">GIA <span class="text-sky-500">3D-MAP</span></h1>
                    <p class="text-[9px] font-bold uppercase tracking-[0.4em] text-slate-400">Generative AI Fitting Room</p>
                </div>
                <div id="report" class="glass p-4 shadow-2xl hidden">
                    <p class="text-[8px] font-black text-pink-500 uppercase">3D Mapping Score</p>
                    <div class="text-2xl font-black italic">9.9/10</div>
                </div>
            </div>

            <div id="upload-step" class="flex flex-col items-center gap-4 interactive">
                <div class="glass p-8 shadow-2xl text-center max-w-sm">
                    <h2 class="text-xl font-bold mb-4 italic">Create Your 3D Avatar</h2>
                    <p class="text-[10px] text-slate-500 mb-6 uppercase tracking-widest leading-relaxed">Please upload your Front & Back photos for a full 360° Try-On.</p>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <label class="flex flex-col items-center gap-2 p-4 border-2 border-dashed border-sky-200 rounded-2xl cursor-pointer hover:bg-sky-50 transition-all">
                            <i data-lucide="image" class="text-sky-400 w-5 h-5"></i>
                            <span class="text-[8px] font-black uppercase">Front View</span>
                            <input type="file" id="front-img" class="hidden" accept="image/*">
                        </label>
                        <label class="flex flex-col items-center gap-2 p-4 border-2 border-dashed border-pink-200 rounded-2xl cursor-pointer hover:bg-pink-50 transition-all">
                            <i data-lucide="image" class="text-pink-400 w-5 h-5"></i>
                            <span class="text-[8px] font-black uppercase">Back View</span>
                            <input type="file" id="back-img" class="hidden" accept="image/*">
                        </label>
                    </div>
                    
                    <button onclick="generate3D()" class="w-full bg-slate-900 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest shadow-xl hover:bg-black transition-all">Generate 3D Fit</button>
                </div>
            </div>

            <div id="controls-step" class="hidden flex justify-center gap-4 interactive mb-4">
                <div class="glass p-4 flex gap-4 shadow-2xl">
                    <button onclick="location.reload()" class="p-3 bg-slate-100 rounded-xl hover:bg-pink-100"><i data-lucide="refresh-cw" class="w-5 h-5"></i></button>
                    <button class="bg-sky-500 text-white px-10 py-3 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] shadow-lg shadow-sky-200">Confirm Order</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let scene, camera, renderer, controls, userModel, clothMesh;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.autoRotate = false;

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            const light = new THREE.PointLight(0xffffff, 0.5);
            light.position.set(5, 5, 5);
            scene.add(light);

            animate();
        }

        async function generate3D() {
            const frontFile = document.getElementById('front-img').files[0];
            const backFile = document.getElementById('back-img').files[0];

            if (!frontFile || !backFile) return alert("Bhai, Front aur Back dono photos upload karo!");

            document.getElementById('upload-step').classList.add('hidden');
            const scanner = document.getElementById('scanner');
            scanner.style.display = 'block';
            gsap.fromTo(scanner, { top: '0%' }, { top: '100%', duration: 2, repeat: 1, yoyo: true, onComplete: () => {
                scanner.style.display = 'none';
                finalize3D(frontFile, backFile);
            }});
        }

        function finalize3D(frontFile, backFile) {
            const loader = new THREE.TextureLoader();
            const frontTex = loader.load(URL.createObjectURL(frontFile));
            const backTex = loader.load(URL.createObjectURL(backFile));

            // Create a 3D Avatar Group
            userModel = new THREE.Group();

            // 1. FRONT PANEL (User's front)
            const geo = new THREE.PlaneGeometry(5, 8, 30, 30);
            // Warp it slightly for 3D depth
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i);
                pos.setZ(i, Math.cos(x * 0.8) * 0.4);
            }
            const matFront = new THREE.MeshStandardMaterial({ map: frontTex, transparent: true, side: THREE.FrontSide });
            const frontPlane = new THREE.Mesh(geo, matFront);

            // 2. BACK PANEL (User's back)
            const matBack = new THREE.MeshStandardMaterial({ map: backTex, transparent: true, side: THREE.FrontSide });
            const backPlane = new THREE.Mesh(geo, matBack);
            backPlane.rotation.y = Math.PI; // Flip it to face back
            backPlane.position.z = -0.1; // Place it just behind

            userModel.add(frontPlane);
            userModel.add(backPlane);
            scene.add(userModel);

            // 3. THE PRODUCT (Automatically wrap the product on the model)
            // Using a sample product image for demo
            const clothGeo = new THREE.PlaneGeometry(4.2, 6, 40, 40);
            const clothPos = clothGeo.attributes.position;
            for(let i=0; i<clothPos.count; i++) {
                let x = clothPos.getX(i);
                clothPos.setZ(i, Math.cos(x * 0.8) * 0.5 + 0.1); // Slightly wider than body
            }
            const clothTex = loader.load('https://i.imgur.com/u7V0HhK.png');
            const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, transparent: true, side: THREE.DoubleSide });
            clothMesh = new THREE.Mesh(clothGeo, clothMat);
            clothMesh.position.y = 0.5;
            userModel.add(clothMesh); // Cloth moves with userModel

            document.getElementById('controls-step').classList.remove('hidden');
            document.getElementById('report').classList.remove('hidden');
            
            // Auto-Rotate success animation
            gsap.to(userModel.rotation, { y: Math.PI * 2, duration: 4, ease: "power2.inOut" });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
