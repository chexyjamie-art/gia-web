<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIA | Enter The Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --vault-green: #062c26;
            --vault-gold: #c5a35d;
            --vault-light-green: #0a4d43;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--vault-green);
            /* Background Pattern Jaisa Screenshot mein hai */
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Alert Box */
        .access-granted {
            background: rgba(10, 77, 67, 0.4);
            border: 1px solid var(--vault-gold);
            padding: 15px 20px;
            border-radius: 12px;
            display: none; /* Initially Hidden */
            animation: fadeIn 0.5s ease-in;
        }

        .access-granted h2 { color: var(--vault-gold); font-size: 14px; font-weight: 700; margin-bottom: 5px; }
        .access-granted p { color: #ffffffcc; font-size: 12px; }

        /* Welcome Card */
        .vault-card {
            background: rgba(10, 77, 67, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(197, 163, 93, 0.1);
        }

        .crown-circle {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #fdf4d5 0%, #c5a35d 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(197, 163, 93, 0.4);
        }

        .crown-icon { color: #062c26; width: 40px; height: 40px; }

        .welcome-text {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: var(--vault-gold);
            margin-bottom: 5px;
        }

        .sub-text {
            font-size: 12px;
            letter-spacing: 3px;
            color: #ffffff99;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Input Styling from Screenshot */
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff66;
            margin-bottom: 8px;
            display: block;
        }

        .vault-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ffffff33;
            padding: 10px 0;
            color: white;
            font-size: 14px;
            text-align: center;
            transition: 0.3s;
        }

        .vault-input:focus {
            border-bottom-color: var(--vault-gold);
            outline: none;
        }

        .vault-input::placeholder { color: #ffffff22; }

        /* Join Button Gradient */
        .btn-join {
            width: 100%;
            background: linear-gradient(90deg, #0ea5e9 0%, #f472b6 100%);
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-join:hover { opacity: 0.9; transform: scale(1.02); }

        .archive-msg {
            margin-top: 30px;
            font-size: 13px;
            line-height: 1.6;
            color: #ffffffaa;
            padding: 0 10px;
        }

        /* Bottom Center Disclaimer */
        .footer-legal {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            text-align: center;
            font-size: 8px;
            letter-spacing: 2px;
            color: #ffffff33;
            text-transform: uppercase;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="alertBox" class="access-granted">
            <h2>Access Granted</h2>
            <p>You have successfully entered the Vault.</p>
        </div>

        <div class="vault-card">
            <div class="crown-circle">
                <i data-lucide="crown" class="crown-icon"></i>
            </div>

            <h1 class="welcome-text">Welcome</h1>
            <p class="sub-text">To The Vault</p>

            <form id="vaultForm" onsubmit="handleVaultEntry(event)">
                <div class="input-group">
                    <span class="input-label">Full Name</span>
                    <input type="text" id="userName" class="vault-input" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <span class="input-label">Mobile Number</span>
                    <input type="tel" id="userPhone" class="vault-input" placeholder="+91 00000 00000">
                </div>

                <button type="submit" class="btn-join">Join The Vault</button>
            </form>

            <p class="archive-msg">
                Your details have been secured in our legacy archives. We will be in touch shortly.
            </p>
        </div>
    </div>

    <div class="footer-legal">
        EST. 2026 • EXCLUSIVE MEMBERSHIP • ALTER PROJECT
    </div>

    <script>
        lucide.createIcons();

        function handleVaultEntry(event) {
            event.preventDefault();
            const name = document.getElementById('userName').value;
            const alertBox = document.getElementById('alertBox');
            
            // LocalStorage for Index.html compatibility
            localStorage.setItem('giaUserName', name);
            localStorage.setItem('giaUserDP', `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`);

            // Show Success UI
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>
</html>
