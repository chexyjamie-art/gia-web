<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIA | Enter The Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --vault-green: #062c26;
            --vault-gold: #c5a35d;
            --sky-accent: #0ea5e9;
            --pink-accent: #f472b6;
        }

        body {
            background-color: #fcfcfc;
            /* Geometric Hexagon Pattern from Screenshot 4 */
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0l40 20v40L40 80 0 60V20z' fill-rule='evenodd' fill='%230ea5e9' fill-opacity='0.03'/%3E%3C/svg%3E");
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Access Granted Notification Block (Screenshot 1) */
        .notification-top {
            position: fixed;
            top: 30px;
            background: rgba(6, 44, 38, 0.95);
            border: 1px solid var(--vault-gold);
            padding: 18px 30px;
            border-radius: 15px;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: left;
            min-width: 320px;
        }

        .notification-top h2 { color: var(--vault-gold); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .notification-top p { color: #fff; font-size: 11px; margin-top: 2px; opacity: 0.8; }

        /* Auth Card Container */
        .auth-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px);
            padding: 4rem 2.5rem;
            border-radius: 3.5rem;
            width: 92%;
            max-width: 440px;
            text-align: center;
            border: 1px solid rgba(14, 165, 233, 0.15);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* GIA Logo Aesthetic */
        .gia-title {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 58px;
            background: linear-gradient(to right, var(--sky-accent), var(--pink-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .crown-badge {
            display: inline-flex;
            background: radial-gradient(circle, #fdf4d5 0%, #c5a35d 100%);
            padding: 12px;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 20px rgba(197, 163, 93, 0.3);
        }

        /* Input Styles (Underline Style from Screenshot 4) */
        .input-group { margin-bottom: 2rem; text-align: left; }
        .input-tag { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; display: block; padding-left: 5px; }
        
        .vault-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid #e2e8f0;
            padding: 12px 5px;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            transition: 0.4s;
            text-align: left;
        }

        .vault-input:focus {
            outline: none;
            border-bottom-color: var(--sky-accent);
            background: linear-gradient(to top, rgba(14, 165, 233, 0.02), transparent);
        }

        /* Master Button */
        .btn-vault-entry {
            width: 100%;
            background: linear-gradient(90deg, var(--sky-accent) 0%, var(--pink-accent) 100%);
            color: white;
            padding: 1.2rem;
            border-radius: 100px;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.25);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-vault-entry:hover { transform: translateY(-3px); box-shadow: 0 20px 45px rgba(244, 114, 182, 0.35); }

        /* Legal Disclaimer Footer (Bottom Center) */
        .legal-footer-box {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .legal-footer-box p {
            color: #94a3b8;
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Hidden AI Search Box (Reference to Commit line 327) */
        #gia-ai-box {
            position: fixed;
            bottom: 100px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
        }
    </style>
</head>
<body>

    <div id="access-alert" class="notification-top">
        <h2>Access Granted</h2>
        <p>Your identity has been verified. Redirecting to GIA LUXE...</p>
    </div>

    <div class="auth-container">
        <div class="crown-badge">
            <i data-lucide="crown" class="w-6 h-6 text-[#062c26]"></i>
        </div>

        <h1 class="gia-title">GIA</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.5em] mb-12">Vault Authentication</p>

        <form id="vault-form" onsubmit="handleFinalAuth(event)">
            <div class="input-group">
                <span class="input-tag">Registered Name</span>
                <input type="text" id="user-name" class="vault-input" placeholder="Enter Full Name" required autocomplete="off">
            </div>

            <div class="input-group">
                <span class="input-tag">Secure Key / Mobile</span>
                <input type="tel" id="user-key" class="vault-input" placeholder="+91 XXXX XXXX">
            </div>

            <div class="flex items-center gap-3 mb-10 px-2">
                <input type="checkbox" id="terms-check" class="w-4 h-4 accent-sky-500 rounded" checked>
                <label for="terms-check" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest cursor-pointer">Accept Vault Legacy Terms</label>
            </div>

            <button type="submit" class="btn-vault-entry">
                Join The Vault
            </button>
        </form>

        <p class="mt-10 text-[10px] text-slate-400 leading-relaxed font-medium uppercase tracking-tighter opacity-60">
            Secure Encryption Enabled • Session Valid 24h
        </p>
    </div>

    <div class="legal-footer-box">
        <p>EST. 2026 • ALTER PROJECT • BHAWANIPATNA, ODISHA</p>
    </div>

    <div id="gia-ai-box">
        <p id="gia-ai-text" class="text-xs font-bold text-sky-600"></p>
    </div>

    <script>
        lucide.createIcons();

        // ---------------------------------------------------------
        // RESTORED LOGIC FROM GITHUB COMMIT (Approx Lines 165-334)
        // ---------------------------------------------------------

        function finishLogin() {
            // Check validation
            const isAgreed = document.getElementById('terms-check').checked;
            if(!isAgreed) {
                alert("Bhai, please accept the terms first!");
                return;
            }

            // Session data initialization
            localStorage.setItem('giaSessionActive', 'true');
            localStorage.setItem('giaTimestamp', new Date().getTime());
            
            // Final Redirect
            window.location.href = 'index.html';
        }

        async function handleFinalAuth(e) {
            e.preventDefault();
            
            const name = document.getElementById('user-name').value;
            const alertBox = document.getElementById('access-alert');

            // Set local identity
            localStorage.setItem('giaUserName', name);
            localStorage.setItem('giaUserDP', `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`);

            // Visual feedback (Screenshot 1 style)
            alertBox.style.display = 'block';
            gsap.from(alertBox, { y: -50, opacity: 0, duration: 0.6, ease: "back.out" });

            // Unified Search Prep (Line 327 logic)
            runUnifiedSearch(name);

            setTimeout(() => {
                finishLogin();
            }, 2200);
        }

        async function runUnifiedSearch(userName) {
            const aiBox = document.getElementById('gia-ai-box');
            const aiText = document.getElementById('gia-ai-text');
            
            // Log to console for debugging commit logic
            console.log(`System: Unified search initiated for user ${userName}`);
            
            if(aiText) {
                aiText.innerText = `Bhai, check these curated items for ${userName}!`;
            }
        }

        // GSAP Entrance Animation
        gsap.from(".auth-container", { 
            scale: 0.9, 
            opacity: 0, 
            duration: 1.2, 
            ease: "power4.out" 
        });

    </script>
</body>
</html>
