<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIA LUXE | Secure Access Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --sky-primary: #0ea5e9;
            --pink-primary: #f472b6;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --border-light: rgba(14, 165, 233, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #fff1f2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(50px);
        }

        .royal-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .gold-text {
            background: linear-gradient(to right, var(--sky-primary), var(--pink-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- LOGIN CARD STYLES --- */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            padding: 4rem 2.5rem;
            border-radius: 4rem;
            border: 1px solid var(--border-light);
            width: 95%;
            max-width: 480px;
            box-shadow: 0 40px 100px -20px rgba(14, 165, 233, 0.15);
            position: relative;
            z-index: 10;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- AVATAR SECTION --- */
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 3rem;
        }

        .avatar-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, var(--sky-primary), var(--pink-primary));
            position: relative;
            transition: transform 0.5s ease;
        }

        .avatar-outer:hover {
            transform: rotate(15deg);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
        }

        #avatar-preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: white;
            color: var(--sky-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 1px solid var(--border-light);
            transition: 0.3s;
        }

        .camera-btn:hover {
            background: var(--pink-primary);
            color: white;
            transform: scale(1.1);
        }

        /* --- FORM CONTROLS --- */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--sky-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-left: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 1.2rem 1.8rem;
            border-radius: 2rem;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            transition: all 0.4s ease;
        }

        .input-field:focus {
            border-color: var(--sky-primary);
            box-shadow: 0 15px 30px -10px rgba(14, 165, 233, 0.2);
            transform: translateY(-2px);
        }

        /* --- BUTTONS --- */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--sky-primary), var(--pink-primary));
            color: white;
            padding: 1.4rem;
            border-radius: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 11px;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(244, 114, 182, 0.5);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .btn-glow-effect {
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .submit-btn:hover .btn-glow-effect {
            left: 150%;
        }

        /* --- FOOTER & STATUS --- */
        .status-container {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .legal-tag {
            margin-top: 3rem;
            font-size: 8px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- LOADING OVERLAY --- */
        #loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loader-ring {
            width: 60px; height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--sky-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="bg-glow" style="top: -100px; left: -100px;"></div>
    <div class="bg-glow" style="bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(244, 114, 182, 0.1) 0%, transparent 70%);"></div>

    <div id="loader">
        <div class="loader-ring"></div>
        <p class="mt-4 text-[10px] font-bold gold-text tracking-[0.5em] uppercase">Encrypting Vault...</p>
    </div>

    <div class="login-card">
        <header class="text-center">
            <h1 class="royal-logo gold-text text-4xl mb-2 italic">GIA LUXE</h1>
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.6em] mb-12">Visual AI Architecture</p>
        </header>

        <div class="avatar-container" id="avatar-section">
            <div class="avatar-outer" id="avatar-ring">
                <div class="avatar-inner">
                    <img id="avatar-preview-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Gia" alt="Profile">
                </div>
            </div>
            <label for="dp-input" class="camera-btn">
                <i data-lucide="camera" class="w-5 h-5"></i>
            </label>
            <input type="file" id="dp-input" class="hidden" accept="image/*">
        </div>

        <form id="vault-form" onsubmit="handleVaultEntry(event)">
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" id="username" class="input-field" placeholder="Identify yourself..." required autocomplete="off">
            </div>

            <div class="input-group">
                <label class="input-label">Access Token</label>
                <input type="password" id="token" class="input-field" placeholder="Enter Access Key (Optional)" autocomplete="new-password">
            </div>

            <div class="input-group flex items-center gap-3 px-4 mt-6">
                <input type="checkbox" id="remember" class="w-4 h-4 accent-sky-500" checked>
                <label for="remember" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest cursor-pointer">Remember Identity</label>
            </div>

            <button type="submit" class="submit-btn">
                <div class="btn-glow-effect"></div>
                <span>Enter The Vault</span>
            </button>
        </form>

        <div class="status-container">
            <div class="status-dot"></div>
            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em]">Secure Server Online</span>
        </div>

        <footer class="text-center">
            <p class="legal-tag">© 2026 ALTER PROJECT | BHAWANIPATNA, ODISHA</p>
            <div class="flex justify-center gap-4 mt-4 opacity-40">
                <i data-lucide="shield-check" class="w-4 h-4 text-sky-500"></i>
                <i data-lucide="fingerprint" class="w-4 h-4 text-pink-500"></i>
                <i data-lucide="cpu" class="w-4 h-4 text-sky-500"></i>
            </div>
        </footer>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // GSAP Animations on Start
        window.addEventListener('DOMContentLoaded', () => {
            gsap.from(".input-group", {
                opacity: 0,
                y: 20,
                duration: 0.8,
                stagger: 0.2,
                ease: "power3.out",
                delay: 0.5
            });
        });

        // Image Handling Logic
        const dpInput = document.getElementById('dp-input');
        const previewImg = document.getElementById('avatar-preview-img');
        const avatarRing = document.getElementById('avatar-ring');

        dpInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imageData = event.target.result;
                    previewImg.src = imageData;
                    
                    // Add success animation
                    gsap.to(avatarRing, {
                        scale: 1.1,
                        duration: 0.3,
                        yoyo: true,
                        repeat: 1
                    });

                    // Save to local storage
                    localStorage.setItem('giaUserDP', imageData);
                };
                reader.readAsDataURL(file);
            }
        };

        // Form Submission Logic
        async function handleVaultEntry(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const loader = document.getElementById('loader');
            
            if (!username) return;

            // Show Loader
            loader.style.display = 'flex';
            
            // Save Session Data
            localStorage.setItem('giaUserName', username);
            
            // If no custom DP, generate a seed-based avatar
            if (!localStorage.getItem('giaUserDP')) {
                const defaultAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
                localStorage.setItem('giaUserDP', defaultAvatar);
            }

            // Simulate Vault Decryption
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }

        // Auto-seed avatar on name typing
        document.getElementById('username').oninput = (e) => {
            if (!localStorage.getItem('giaUserDP')) {
                const name = e.target.value;
                if(name.length > 2) {
                    previewImg.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
                }
            }
        };
    </script>
</body>
</html>
