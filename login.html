<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIA LUXE | Enter The Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --vault-primary: #062c26;
            --vault-gold: #c5a35d;
            --sky-glow: #0ea5e9;
            --pink-glow: #f472b6;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            /* Precise Hexagon Grid Pattern from Screenshot */
            background-image: radial-gradient(#0ea5e9 0.5px, transparent 0.5px), radial-gradient(#0ea5e9 0.5px, #ffffff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Full Background Overlay for depth */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(255,255,255,0.8) 100%);
            z-index: 1;
        }

        /* Notification Alert (Screenshot 1: Access Granted) */
        .access-notif {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--vault-primary);
            border: 1px solid var(--vault-gold);
            padding: 20px 40px;
            border-radius: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .access-notif.show { top: 30px; }
        .access-notif h2 { color: var(--vault-gold); font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .access-notif p { color: white; font-size: 11px; font-weight: 500; opacity: 0.9; }

        /* Main Center Card */
        .auth-vault-card {
            background: var(--glass-white);
            backdrop-filter: blur(40px);
            padding: 5rem 3rem;
            border-radius: 4rem;
            width: 92%;
            max-width: 460px;
            text-align: center;
            border: 1px solid rgba(14, 165, 233, 0.12);
            box-shadow: 0 50px 120px -20px rgba(14, 165, 233, 0.15);
            position: relative;
            z-index: 10;
        }

        /* Branding Section */
        .crown-ring {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #fdf4d5 0%, #c5a35d 100%);
            border-radius: 50%;
            margin: 0 auto 2.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 15px 30px rgba(197, 163, 93, 0.4);
        }

        .gia-legacy-logo {
            font-family: 'Playfair Display', serif;
            font-size: 62px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--sky-glow), var(--pink-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.8;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.6em;
            margin-bottom: 3.5rem;
        }

        /* Form Logic Styling */
        .input-box { margin-bottom: 2.2rem; text-align: left; position: relative; }
        .input-box label { font-size: 9px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 2.5px; margin-left: 10px; display: block; }
        
        .vault-input-field {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #f1f5f9;
            padding: 12px 10px;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            transition: all 0.4s ease;
        }

        .vault-input-field:focus {
            outline: none;
            border-bottom-color: var(--sky-glow);
            transform: translateY(-2px);
        }

        /* The "Join" Button (Screenshot 4) */
        .btn-join-vault {
            width: 100%;
            background: linear-gradient(90deg, var(--sky-glow) 0%, var(--pink-glow) 100%);
            color: white;
            padding: 1.4rem;
            border-radius: 100px;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            border: none;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.3);
            margin-top: 1rem;
            transition: 0.5s;
        }

        .btn-join-vault:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(244, 114, 182, 0.4);
        }

        /* Disclaimer Text */
        .archive-notice {
            margin-top: 2.5rem;
            font-size: 11px;
            line-height: 1.8;
            color: #94a3b8;
            font-weight: 500;
            padding: 0 1rem;
        }

        /* Bottom Legal Branding (Required Footer) */
        .footer-branding {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 5;
        }

        .footer-branding p {
            color: #cbd5e1;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Search Debug Box (Line 327) */
        #gia-debug-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="vault-alert" class="access-notif">
        <h2>Access Granted</h2>
        <p>GIA AI is preparing your personalized vault.</p>
    </div>

    <div class="auth-vault-card" id="auth-ui">
        <div class="crown-ring">
            <i data-lucide="crown" class="w-8 h-8 text-[#062c26]"></i>
        </div>
        
        <h1 class="gia-legacy-logo">GIA</h1>
        <p class="tagline">Enter The Vault</p>

        <form id="vault-access-form" onsubmit="handleAuthSequence(event)">
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="vault-name" class="vault-input-field" placeholder="John Doe" required>
            </div>

            <div class="input-box">
                <label>Mobile Number</label>
                <input type="tel" id="vault-phone" class="vault-input-field" placeholder="+91 00000 00000">
            </div>

            <div class="flex items-center gap-3 mb-8 px-2">
                <input type="checkbox" id="vault-agree" class="w-4 h-4 accent-sky-500" checked>
                <label for="vault-agree" class="text-[9px] font-black text-slate-400 uppercase tracking-widest cursor-pointer">Agree to Legacy Terms</label>
            </div>

            <button type="submit" class="btn-join-vault">
                Join The Vault
            </button>
        </form>

        <p class="archive-notice">
            Your details have been secured in our legacy archives. We will be in touch shortly.
        </p>
    </div>

    <div class="footer-branding">
        <p>EST. 2026 • EXCLUSIVE MEMBERSHIP • ALTER PROJECT</p>
    </div>

    <div id="gia-debug-box">
        <span id="debug-text"></span>
    </div>

    <script>
        // Init Icons
        lucide.createIcons();

        // -------------------------------------------------------------------
        // CORE RECONSTRUCTED LOGIC (Ref: GitHub Commit Lines 165-334)
        // -------------------------------------------------------------------

        /**
         * finishLogin() function
         * Lines: Approx 165-175 in your original file
         */
        function finishLogin() {
            const check = document.getElementById('vault-agree');
            if(!check.checked) {
                alert("Please accept the vault terms to proceed.");
                return;
            }

            // Sync with Index.html
            localStorage.setItem('giaVaultStatus', 'authenticated');
            localStorage.setItem('giaLoginTime', new Date().toISOString());
            
            // Proceed to the main interface
            window.location.href = 'index.html';
        }

        /**
         * handleAuthSequence() 
         * Logic handling the notification and storage
         */
        async function handleAuthSequence(e) {
            e.preventDefault();
            
            const nameValue = document.getElementById('vault-name').value;
            const notif = document.getElementById('vault-alert');

            // Data Persistence
            localStorage.setItem('giaUserName', nameValue);
            localStorage.setItem('giaUserDP', `https://api.dicebear.com/7.x/avataaars/svg?seed=${nameValue}`);

            // Trigger "Access Granted" Alert (Screenshot 1)
            notif.classList.add('show');

            // Unified Search Reference (Commit Line 327)
            await runUnifiedSearch(nameValue);

            // Redirect delay for effect
            setTimeout(() => {
                finishLogin();
            }, 2400);
        }

        /**
         * runUnifiedSearch()
         * Lines: Approx 327-334 in your original file
         */
        async function runUnifiedSearch(userName) {
            const debugBox = document.getElementById('gia-debug-box');
            const debugText = document.getElementById('debug-text');
            
            console.log(`GIA AI: Initiating secure vault search for ${userName}...`);
            
            if(debugText) {
                debugText.innerText = `Bhai, check these curated items for ${userName}!`;
            }

            // Simulate AI Processing
            return new Promise(resolve => setTimeout(resolve, 1000));
        }

        // GSAP Visual Polish
        window.onload = () => {
            gsap.from("#auth-ui", {
                opacity: 0,
                y: 40,
                duration: 1.2,
                ease: "power4.out"
            });
            
            gsap.from(".input-box", {
                opacity: 0,
                x: -20,
                stagger: 0.2,
                delay: 0.5,
                duration: 1
            });
        };
    </script>
</body>
</html>
